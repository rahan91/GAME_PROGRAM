<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARGET</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(140,180,150,0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(140,180,150,1); }

  h1 {
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(140,180,150,0.85);
  }

  #hud {
    position: fixed; top: 68px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 18px; padding: 0 12px;
    pointer-events: none; z-index: 8;
    font-size: 14px; color: rgba(140,180,150,0.75);
  }
  #hud .stat { letter-spacing: 0.1em; }
  #hud b { color: rgba(200,230,210,0.95); }

  #targetWrap {
    position: fixed;
    width: 96px; height: 96px;
    z-index: 5;
    transform: translate(-50%, -50%);
    transition: width 0.12s, height 0.12s;
  }
  #targetWrap.down { width: 90px; height: 90px; }
  #target {
    display: block;
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    cursor: none;
    box-shadow: 0 0 30px rgba(140,180,150,0.4);
  }
  #targetTint {
    position: absolute; inset: 0;
    border-radius: 50%;
    mix-blend-mode: color;
    pointer-events: none;
  }

  #cursorfx {
    position: fixed; top: 0; left: 0;
    width: 31px; height: 40px;
    pointer-events: none;
    z-index: 100;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }
  #cursorfx.arrow  { background: url('assets/cursor-arrow.png') no-repeat 0 0; }
  #cursorfx.finger { background: url('assets/cursor-finger.png') no-repeat 0 0; }

  .hint {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: rgba(140,180,150,0.35);
    font-size: 13px; pointer-events: none; z-index: 6;
  }

  #runStatus {
    position: fixed; bottom: 44px; left: 0; right: 0;
    text-align: center; color: rgba(140,180,150,0.7);
    font-size: 13px; pointer-events: none; z-index: 6;
  }

  @media (max-width: 640px) {
    h1 { font-size: 1.25rem; letter-spacing: 4px; }
    #hud { top: 58px; font-size: 12px; gap: 3px 14px; }
    #runStatus, .hint { font-size: 12px; }
  }
  @media (pointer: coarse) {
    #cursorfx { display: none; }
  }
</style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
  <script src="score.js"></script>
  <script src="scoring.js"></script>
  <script src="shop.js"></script>
</head>
<body>

<div class="orb orb--1"></div>
<div class="orb orb--2"></div>

<a class="back" href="/gallery">&larr; Gallery</a>

<h1>Target</h1>

<div id="hud">
  <span class="stat">Player <b id="playerName">anonymous</b></span>
  <span class="stat">Score <b id="scoreDisplay">0</b></span>
  <span class="stat">Hits <b id="hitsDisplay">0</b></span>
  <span class="stat">Misses <b id="missesDisplay">0</b></span>
  <span class="stat">Run <b id="runDisplay">0/20</b></span>
  <span class="stat">Time <b id="timeDisplay">0.0s</b></span>
</div>

<div id="targetWrap">
  <img id="target" src="assets/target.png" alt="target">
  <div id="targetTint" style="background:transparent;"></div>
</div>

<div id="cursorfx" class="arrow"></div>

<div id="runStatus"></div>
<div class="hint">Click the target &middot; Clicking the background counts as a miss &middot; 20 hits per run</div>

<script>
(() => {
  const target = document.getElementById('target');
  const targetWrap = document.getElementById('targetWrap');
  const targetTint = document.getElementById('targetTint');
  const nameInput = document.getElementById('playerName');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const hitsDisplay = document.getElementById('hitsDisplay');
  const missesDisplay = document.getElementById('missesDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const runDisplay = document.getElementById('runDisplay');
  const runStatus = document.getElementById('runStatus');

  const TARGET_SIZE = 96;
  const RUN_TARGETS = Scoring.RUN_TARGETS;

  // A "run" is a fixed set of RUN_TARGETS hits, and the only time points are
  // submitted to the leaderboard (once, at the end of the run).
  let running = false;
  let hits = 0;
  let misses = 0;
  let runScore = 0;
  let spawnedAt = 0;  // when the current target appeared -> reaction window start
  let runStart = 0;   // when the current run started (Time stat)
  let isLoggedIn = false;
  let missGuard = false;
  let serverTotal = null;

  function currentPlayer() {
    return nameInput.textContent.trim() || 'anonymous';
  }
  function refreshScoreDisplay() {
    const local = isLoggedIn ? (ScoreBoard.get(currentPlayer()).total || 0) : 0;
    const total = (isLoggedIn && serverTotal != null) ? serverTotal : local;
    scoreDisplay.textContent = Math.round(total * 100) / 100;
  }
  function addScore(points) {
    if (!isLoggedIn) return;
    ScoreBoard.add(currentPlayer(), points);
    fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ points })
    }).then(r => r.json()).then((d) => {
      if (d && Number.isFinite(d.balance)) { serverTotal = d.balance; refreshScoreDisplay(); }
      else if (d && Number.isFinite(d.total)) { serverTotal = d.total; refreshScoreDisplay(); }
    }).catch(() => {});
  }
  function updateRunDisplay() {
    runDisplay.textContent = hits + '/' + RUN_TARGETS;
    hitsDisplay.textContent = hits;
    missesDisplay.textContent = misses;
  }

  function randomPosition() {
    const radius = TARGET_SIZE / 2;
    const margin = TARGET_SIZE + 8;
    const hud = document.getElementById('hud').getBoundingClientRect();
    const topClear = Math.max(margin, hud.bottom + 12 + radius);
    const hint = document.querySelector('.hint').getBoundingClientRect();
    const status = document.getElementById('runStatus').getBoundingClientRect();
    const lowestOverlayTop = Math.min(hint.top, status.top);
    const bottomClear = Math.min(window.innerHeight - margin, lowestOverlayTop - 12 - radius);
    const minY = topClear;
    const maxY = Math.max(minY, bottomClear);
    const minX = margin;
    const maxX = Math.max(margin, window.innerWidth - margin);
    const x = Math.random() * (maxX - minX) + minX;
    const y = Math.random() * (maxY - minY) + minY;
    return { x, y };
  }

  function spawn() {
    const pos = randomPosition();
    targetWrap.style.left = pos.x + 'px';
    targetWrap.style.top = pos.y + 'px';
  }

  // End of a run: submit its total exactly once, then prepare the next run.
  function endRun(now) {
    const points = Scoring.targetRunScore(runScore);
    addScore(points);
    const total = hits + misses;
    const acc = total > 0 ? Math.round(hits / total * 100) : 0;
    runStatus.textContent = 'Run complete: +' + points +
      ' pts (' + hits + ' hits, ' + misses + ' misses, ' + acc + '% accuracy)';
    running = false;
    hits = 0; misses = 0; runScore = 0; runStart = 0;
    updateRunDisplay();
    timeDisplay.textContent = '0.0s';
    spawn();
    spawnedAt = now;
  }

  // The drawn cursor trails the pointer slightly (sluggish aim). Hits resolve
  // at the drawn cursor's position, so what you see is what you hit.
  const cursorfx = document.getElementById('cursorfx');
  let realX = window.innerWidth / 2, realY = window.innerHeight / 2;
  let curX = realX, curY = realY;
  document.addEventListener('pointermove', (e) => {
    realX = e.clientX;
    realY = e.clientY;
  });

  function cursorTick() {
    curX += (realX - curX) * 0.24;
    curY += (realY - curY) * 0.24;
    const over = hitTest(curX, curY);
    cursorfx.className = over ? 'finger' : 'arrow';
    const hotX = over ? 11 : 1;
    cursorfx.style.transform = 'translate3d(' + (curX - hotX) + 'px,' + curY + 'px,0)';
    requestAnimationFrame(cursorTick);
  }

  function hitTest(x, y) {
    const r = target.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    return (dx * dx + dy * dy) <= (r.width * r.width) / 4;
  }

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('a')) return;
    e.preventDefault();
    const now = Date.now();
    const x = e.pointerType === 'touch' ? e.clientX : curX;
    const y = e.pointerType === 'touch' ? e.clientY : curY;

    if (!hitTest(x, y)) {
      if (missGuard || !running) return;
      misses += 1;
      updateRunDisplay();
      return;
    }

    if (!running) {
      running = true;
      hits = 0; misses = 0; runScore = 0;
      runStart = now;
      runStatus.textContent = '';
    }
    // Reaction window: from when this target appeared until it was hit.
    const reactionMs = now - spawnedAt;
    hits += 1;
    const hitScore = Scoring.targetHitScore(reactionMs, hits, misses);
    runScore += hitScore;
    updateRunDisplay();

    if (hits >= RUN_TARGETS) {
      endRun(now);
      return;
    }
    spawn();
    spawnedAt = now;
    missGuard = true;
    setTimeout(() => missGuard = false, 250);
  });

  requestAnimationFrame(cursorTick);

  targetWrap.addEventListener('pointerdown', () => targetWrap.classList.add('down'));
  window.addEventListener('pointerup', () => targetWrap.classList.remove('down'));
  window.addEventListener('pointercancel', () => targetWrap.classList.remove('down'));

  async function applyCosmetics() {
    try {
      const s = await Shop.state();
      const cur = Shop.installed(s.equipped, Shop.CURSOR);
      cursorfx.style.filter = (cur && cur.color) ? Shop.cursorFilterCss(cur.color) : '';
      const tgt = Shop.installed(s.equipped, Shop.TARGET);
      targetTint.style.background = (tgt && tgt.color) ? tgt.color : 'transparent';
    } catch (e) {}
  }

  setInterval(() => {
    if (!running) return;
    const sec = (Date.now() - runStart) / 1000;
    timeDisplay.textContent = sec.toFixed(1) + 's';
  }, 100);

  spawn();
  spawnedAt = Date.now();

  async function loadPlayerAndScore() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      const user = data.user || null;
      isLoggedIn = !!(user && user.username);
      if (user && user.username) nameInput.textContent = user.username;
      serverTotal = (user && Number.isFinite(user.balance))
        ? user.balance
        : (user && Number.isFinite(user.total)) ? user.total : null;
    } catch {
      isLoggedIn = false;
    }
    await applyCosmetics();
    refreshScoreDisplay();
  }
  loadPlayerAndScore();
  window.addEventListener('pageshow', loadPlayerAndScore);
})();
</script>
</body>
</html>
