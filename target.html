<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARGET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(140,180,150,0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(140,180,150,1); }

  h1 {
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(140,180,150,0.85);
  }

  #hud {
    position: fixed; top: 68px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 24px; pointer-events: none; z-index: 8;
    font-size: 14px; color: rgba(140,180,150,0.75);
  }
  #hud .stat { letter-spacing: 0.1em; }
  #hud b { color: rgba(200,230,210,0.95); }

  #target {
    position: fixed;
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    cursor: crosshair;
    z-index: 5;
    box-shadow: 0 0 30px rgba(140,180,150,0.4);
    transition: width 0.12s, height 0.12s;
    transform: translate(-50%, -50%);
  }
  #target:active { width: 90px; height: 90px; }

  .hint {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: rgba(140,180,150,0.35);
    font-size: 13px; pointer-events: none; z-index: 6;
  }
</style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
  <script src="score.js"></script>
</head>
<body>

<div class="orb orb--1"></div>
<div class="orb orb--2"></div>

<a class="back" href="index.html">&larr; Gallery</a>

<h1>Target</h1>

<div id="hud">
  <span class="stat">Player <b id="playerName">anonymous</b></span>
  <span class="stat">Score <b id="scoreDisplay">0</b></span>
  <span class="stat">Hits <b id="hitsDisplay">0</b></span>
  <span class="stat">Misses <b id="missesDisplay">0</b></span>
  <span class="stat">Time <b id="timeDisplay">0.0s</b></span>
</div>

<img id="target" src="assets/target.png" alt="target">

<div class="hint">Click the target &middot; Clicking the background counts as a miss</div>

<script>
(() => {
  const target = document.getElementById('target');
  const nameInput = document.getElementById('playerName');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const hitsDisplay = document.getElementById('hitsDisplay');
  const missesDisplay = document.getElementById('missesDisplay');
  const timeDisplay = document.getElementById('timeDisplay');

  const TARGET_SIZE = 96;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  let started = false;
  let sessionStart = 0;
  let lastHitAt = 0;
  let hits = 0;
  let misses = 0;

  function currentPlayer() {
    return nameInput.textContent.trim() || 'anonymous';
  }
  function refreshScoreDisplay() {
    const total = ScoreBoard.get(currentPlayer()).total || 0;
    scoreDisplay.textContent = Math.round(total * 100) / 100;
  }
  function addScore(points) {
    ScoreBoard.add(currentPlayer(), points);
    refreshScoreDisplay();
  }

  function randomPosition() {
    const margin = TARGET_SIZE + 8;
    const maxX = Math.max(margin, window.innerWidth - margin);
    const maxY = Math.max(margin, window.innerHeight - margin);
    const yMin = margin;
    const hud = document.getElementById('hud').getBoundingClientRect();
    const hudBottom = hud.bottom + 12;
    const topAreaMaxY = Math.max(yMin, hudBottom);
    const actualMaxY = Math.max(topAreaMaxY, window.innerHeight - margin);
    const x = Math.random() * (maxX - margin) + margin;
    const y = Math.random() * (actualMaxY - topAreaMaxY) + topAreaMaxY;
    return { x, y };
  }

  function spawn() {
    const pos = randomPosition();
    target.style.left = pos.x + 'px';
    target.style.top = pos.y + 'px';
    target.style.width = TARGET_SIZE + 'px';
    target.style.height = TARGET_SIZE + 'px';
  }

  target.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!started) {
      started = true;
      sessionStart = Date.now();
      lastHitAt = Date.now();
      hits = 1;
      hitsDisplay.textContent = hits;
      spawn();
      refreshScoreDisplay();
      return;
    }
    const now = Date.now();
    const betweenMs = Math.max(now - lastHitAt, 0.001);
    lastHitAt = now;
    hits += 1;
    hitsDisplay.textContent = hits;

    const reactionFactor = clamp(500 / betweenMs, 0.5, 3.0);
    const accuracyFactor = 0.4 + 0.6 * (hits / (hits + misses));
    const sessionTimeSec = (now - sessionStart) / 1000;
    const sessionFactor = clamp(0.75 + 0.25 * Math.sqrt(sessionTimeSec / 60), 0.75, 1.5);
    const added = Math.ceil(Math.min(100, 20 * reactionFactor * accuracyFactor * sessionFactor));
    addScore(added);
    refreshScoreDisplay();

    spawn();
  });

  document.addEventListener('click', (e) => {
    if (e.target === target) return;
    if (!started) return;
    misses += 1;
    missesDisplay.textContent = misses;
    refreshScoreDisplay();
  });

  setInterval(() => {
    if (!started) return;
    const sec = (Date.now() - sessionStart) / 1000;
    timeDisplay.textContent = sec.toFixed(1) + 's';
  }, 100);

  target.style.left = '50%';
  target.style.top = '50%';

  async function loadPlayerAndScore() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      const user = data.user || null;
      if (user && user.username) nameInput.textContent = user.username;
    } catch {}
    refreshScoreDisplay();
  }
  loadPlayerAndScore();
  window.addEventListener('pageshow', loadPlayerAndScore);
})();
</script>
</body>
</html>
