<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8">

  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Button",

    "description": "Hold the button to earn points. The longer you hold, the more you earn.",
    "genre": "Arcade",

    "applicationCategory": "Game",

  }
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
    cursor: none !important;
  }
  *, *::before, *::after { cursor: url('assets/cursor-empty.cur') 0 0, none !important; }
  a, .back { cursor: none; }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(var(--acc-dim),0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(var(--acc-orb),0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .enter {
    animation: enterIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes enterIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes enterFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #btn3d.enter { animation: enterFade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
  #hud.enter, #status.enter, .hint.enter, .back.enter, h1.enter { animation-duration: 0.22s; }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(var(--acc-main),0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(var(--acc-main),1); }

  h1 {
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
  }

  #hud {
    position: fixed; top: 68px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 18px; padding: 0 12px;
    pointer-events: none; z-index: 8;
    font-size: 14px; color: rgba(var(--acc-main),0.75);
  }
  #hud .stat { letter-spacing: 0.1em; }
  #hud b { color: rgba(var(--acc-texthi),0.95); }

  #btn3d {
    position: fixed;
    left: 50%; top: 55%;
    transform: translate(-50%, -50%) perspective(400px)
      rotateX(calc(var(--press, 0) * 14deg))
      translateY(calc(var(--press, 0) * 10px));
    width: 260px; height: 96px;
    border-radius: 16px;
    border: 2px solid rgba(var(--acc-main),0.35);
    background: linear-gradient(180deg, #87a795 0%, #4a6a58 45%, #38534a 100%);
    box-shadow:
      0 calc(10px - var(--press, 0) * 8px) 0 #22332a,
      0 calc(16px - var(--press, 0) * 6px) 24px rgba(0,0,0,0.45),
      inset 0 2px 0 rgba(255,255,255,0.25),
      inset 0 -3px 6px rgba(0,0,0,0.3);
    color: rgba(var(--acc-texthi),0.95);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
    cursor: none;
    z-index: 5;
    touch-action: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .hint {
    position: fixed; bottom: 20px; left: 0; right: 0;
    text-align: center; color: rgba(var(--acc-main),0.35);
    font-size: 13px; pointer-events: none; z-index: 6;
  }

  #status {
    position: fixed; bottom: 44px; left: 0; right: 0;
    text-align: center; color: rgba(var(--acc-main),0.7);
    font-size: 13px; pointer-events: none; z-index: 6;
  }

  #cursorfx {
    position: fixed; top: 0; left: 0;
    width: 31px; height: 40px;
    background-size: auto 30px;
    pointer-events: none;
    z-index: 100;
    will-change: transform;
    image-rendering: pixelated;
    transform: translate3d(0, 0, 0);
  }
  #cursorfx.arrow  { background: url('assets/cursor-arrow.png') no-repeat 0 0 / auto 30px; }
  #cursorfx.finger { background: url('assets/cursor-finger.png') no-repeat 0 0 / auto 30px; }

  #leaderboard {
    position: fixed; bottom: 20px; left: 20px; z-index: 6;
    width: 230px; max-height: 42vh;
    border: 1px solid rgba(var(--acc-main),0.2);
    border-radius: 12px; background: rgba(var(--acc-panel),0.82);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    overflow: hidden; pointer-events: none;
  }
  #leaderboard h3 {
    font-size: 10px; font-weight: 400; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
    padding: 10px 14px 7px; border-bottom: 1px solid rgba(var(--acc-main),0.18);
  }
  #leaderboard .lb-body { padding: 5px 0; overflow: hidden; }
  .lb-row { display: flex; align-items: center; gap: 8px; padding: 4px 14px; font-size: 12px; }
  .lb-row.me { background: rgba(var(--acc-main),0.14); }
  .lb-row .rk { width: 18px; color: rgba(var(--acc-main),0.45); font-variant-numeric: tabular-nums; text-align: right; }
  .lb-row .rk.top { font-weight: 600; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .lb-row .rk.rk1 { background-image: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700); }
  .lb-row .rk.rk2 { background-image: linear-gradient(135deg, #c0c0c0, #e8e8e8, #a8a8a8, #d0d0d0); }
  .lb-row .rk.rk3 { background-image: linear-gradient(135deg, #cd7f32, #e8a858, #c46a28, #daa060); }
  .lb-row .nm { flex: 1; color: rgba(var(--acc-text),0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .pt { color: rgba(var(--acc-main),0.85); font-variant-numeric: tabular-nums; }
  .lb-row.me .pt { color: rgba(var(--acc-bright),1); }
  .lb-status { padding: 10px 14px; font-size: 11px; color: rgba(var(--acc-main),0.45); }

  @media (max-width: 640px) {
    h1 { font-size: 1.25rem; letter-spacing: 4px; }
    #hud { top: 58px; font-size: 12px; gap: 3px 14px; }
    #btn3d { width: min(260px, calc(100vw - 56px)); font-size: 1.15rem; }
    #status, .hint { font-size: 12px; }
    #leaderboard { display: none; }
  }
  @media (pointer: coarse) {
    #cursorfx { display: none; }
  }
</style>
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="ui.css">
  <script defer src="crt.js"></script>
  <script src="score.js"></script>
  <script src="scoring.js"></script>
  <script src="shop.js"></script>
</head>
<body>

<div class="orb orb--1"></div>
<div class="orb orb--2"></div>

<a class="back enter" href="/gallery">&larr; Gallery</a>

<h1 class="enter">Button</h1>

<div id="hud" class="enter">
  <span class="stat">Player <b id="playerName">anonymous</b></span>
  <span class="stat">Score <b id="scoreDisplay">0</b></span>
  <span class="stat">Hold <b id="holdDisplay">0.0s</b></span>
  <span class="stat">Gain <b id="gainDisplay">+0</b></span>
</div>

<button id="btn3d" class="enter" type="button">Hold Me</button>

<div id="status" class="enter"></div>
<div class="hint enter">Hold the button &middot; score grows the longer you hold &middot; release to bank it</div>

<div id="leaderboard">
  <h3>Longest Hold &mdash; Button</h3>
  <div class="lb-body" id="lbRows"><div class="lb-status">Loading&hellip;</div></div>
</div>

<div id="cursorfx" class="arrow"></div>

<script>
(() => {
  const btn = document.getElementById('btn3d');
  const nameInput = document.getElementById('playerName');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const holdDisplay = document.getElementById('holdDisplay');
  const gainDisplay = document.getElementById('gainDisplay');
  const status = document.getElementById('status');

  let holding = false;
  let downAt = 0;
  let isLoggedIn = false;
  let serverTotal = null;

  function currentPlayer() {
    return nameInput.textContent.trim() || 'anonymous';
  }
  function refreshScoreDisplay() {
    const local = isLoggedIn ? (ScoreBoard.get(currentPlayer()).total || 0) : 0;
    const total = (isLoggedIn && serverTotal != null) ? serverTotal : local;
    scoreDisplay.textContent = Shop.fmt(total);
  }
  function addScore(points, holdMs) {
    if (!isLoggedIn) return;
    ScoreBoard.add(currentPlayer(), points);
    fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ points, game: 'button', holdMs })
    }).then(r => r.json()).then((d) => {
      if (d && Number.isFinite(d.total)) { serverTotal = d.total; refreshScoreDisplay(); }
      else if (d && Number.isFinite(d.balance)) { serverTotal = d.balance; refreshScoreDisplay(); }
    }).catch(() => {});
  }
  function fmtHold(ms) {
    const s = ms / 1000;
    const m = Math.floor(s / 60);
    const r = (s % 60).toFixed(1);
    return m > 0 ? m + 'm ' + r + 's' : r + 's';
  }
  async function loadLeaderboard() {
    const container = document.getElementById('lbRows');
    let me = null;
    try {
      const mr = await (await fetch('/api/me')).json();
      me = (mr.user && mr.user.username) ? mr.user.username : null;
    } catch {}
    let rows;
    try {
      const res = await fetch('/api/leaderboard?game=button&metric=best&limit=10');
      const data = await res.json();
      rows = data.leaderboard || null;
    } catch { rows = null; }
    if (!rows) { container.innerHTML = '<div class="lb-status">Could not load.</div>'; return; }
    if (!rows.length) { container.innerHTML = '<div class="lb-status">No holds yet. Hold the button!</div>'; return; }
    container.innerHTML = rows.map((row, i) =>
      '<div class="lb-row' + (row.username === me ? ' me' : '') + '">' +
      '<span class="rk' + (i < 3 ? ' top rk' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
      window.Shop.npHTML(row) +
      '<span class="pt">' + fmtHold(row.value) + '</span>' +
      '</div>'
    ).join('');
  }

  function tick() {
    if (!holding) return;
    const holdMs = Date.now() - downAt;
    const p = Math.min(1, holdMs / 5000);
    btn.style.setProperty('--press', String(p));
    holdDisplay.textContent = (holdMs / 1000).toFixed(1) + 's';
    const gain = Scoring.buttonScore(holdMs);
    gainDisplay.textContent = '+' + Shop.fmt(gain);
    requestAnimationFrame(tick);
  }

  function startHold() {
    holding = true;
    downAt = Date.now();
    tick();
  }

  function endHold() {
    if (!holding) return;
    holding = false;
    const holdMs = Date.now() - downAt;
    const gain = Scoring.buttonScore(holdMs);
    status.textContent = 'Held ' + (holdMs / 1000).toFixed(1) + 's · +' + Shop.fmt(gain) + ' pts';
    addScore(gain, holdMs);
    loadLeaderboard();
    btn.style.setProperty('--press', '0');
    holdDisplay.textContent = '0.0s';
    gainDisplay.textContent = '+0';
  }

  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startHold();
  });
  window.addEventListener('pointerup', endHold);
  window.addEventListener('pointercancel', endHold);
  window.addEventListener('blur', endHold);

  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Inject cursor: none globally (fallback for CSS)
  const _curStyle = document.createElement('style');
  _curStyle.textContent = 'html * { cursor: url("assets/cursor-empty.cur") 0 0, none !important; }';
  document.head.appendChild(_curStyle);

  // Sluggish drawn cursor (finger on hover over the button).
  const cursorfx = document.getElementById('cursorfx');
  let realX = window.innerWidth / 2, realY = window.innerHeight / 2;
  let curX = realX, curY = realY;
  let cursorSpritesState = null;
  const TRAIL = 3;
  const trail = [], trailX = [], trailY = [];
  for (let i = 0; i < TRAIL; i++) {
    const t = document.createElement('div');
    t.style.cssText =
      'position:fixed;top:0;left:0;width:31px;height:40px;pointer-events:none;' +
      'z-index:99;will-change:transform;image-rendering:pixelated;' +
      'transform:translate3d(-100px,-100px,0);opacity:' + (0.3 - i * 0.08).toFixed(2) + ';' +
      'background-size:auto 30px;background-repeat:no-repeat;';
    document.body.appendChild(t);
    trail.push(t);
    trailX.push(realX);
    trailY.push(realY);
  }
  document.addEventListener('pointermove', (e) => {
    realX = e.clientX;
    realY = e.clientY;
  });

  function paintCursor() {
    if (cursorSpritesState && cursorSpritesState.arrow) {
      const finger = cursorfx.className === 'finger';
      cursorfx.style.backgroundImage = 'url("' + (finger ? cursorSpritesState.finger : cursorSpritesState.arrow) + '")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.filter = cursorSpritesState.border || '';
    } else {
      cursorfx.style.backgroundImage = '';
      cursorfx.style.filter = '';
    }
  }

  function overButton(x, y) {
    const r = btn.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function cursorTick() {
    curX += (realX - curX) * 0.24;
    curY += (realY - curY) * 0.24;
    const over = overButton(curX, curY);
    cursorfx.className = over ? 'finger' : 'arrow';
    paintCursor();
    const hotX = over ? 8 : 1;
    cursorfx.style.transform = 'translate3d(' + (curX - hotX) + 'px,' + curY + 'px,0)';
    const url = cursorSpritesState && cursorSpritesState.arrow
      ? (over ? cursorSpritesState.finger : cursorSpritesState.arrow)
      : over ? "assets/cursor-finger.png" : "assets/cursor-arrow.png";
    const filt = cursorSpritesState ? (cursorSpritesState.border || '') : '';
    for (let i = TRAIL - 1; i > 0; i--) {
      trailX[i] += (trailX[i - 1] - trailX[i]) * 0.35;
      trailY[i] += (trailY[i - 1] - trailY[i]) * 0.35;
    }
    trailX[0] += (curX - trailX[0]) * 0.4;
    trailY[0] += (curY - trailY[0]) * 0.4;
    for (let j = 0; j < TRAIL; j++) {
      trail[j].style.backgroundImage = 'url("' + url + '")';
      trail[j].style.filter = filt;
      trail[j].style.transform = 'translate3d(' + (trailX[j] - hotX) + 'px,' + trailY[j] + 'px,0)';
    }
    requestAnimationFrame(cursorTick);
  }
  requestAnimationFrame(cursorTick);

  async function applyCosmetics() {
    try {
      const s = await Shop.state();
      const cur = Shop.installed(s.equipped, Shop.CURSOR);
      cursorSpritesState = (cur && cur.color) ? await Shop.cursorSprites(cur.color) : { arrow: null, finger: null, border: '' };
      paintCursor();
    } catch (e) {}
  }

  async function loadPlayerAndScore() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      const user = data.user || null;
      isLoggedIn = !!(user && user.username);
      if (user && user.username) nameInput.textContent = user.username;
      serverTotal = (user && Number.isFinite(user.total))
        ? user.total
        : (user && Number.isFinite(user.balance)) ? user.balance : null;
    } catch {
      isLoggedIn = false;
    }
    await applyCosmetics();
    refreshScoreDisplay();
  }
  loadPlayerAndScore();
  window.addEventListener('pageshow', loadPlayerAndScore);
  loadLeaderboard();
  window.addEventListener('pageshow', loadLeaderboard);
})();
</script>
</body>
</html>
