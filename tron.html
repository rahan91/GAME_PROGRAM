<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'Space Grotesk', 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    cursor: none !important;
  }
  *, *::before, *::after { cursor: url('assets/cursor-empty.cur') 0 0, none !important; }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(var(--acc-dim),0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(var(--acc-orb),0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(var(--acc-main),0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(var(--acc-main),1); }

  h1 { font-weight: 600;
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'Space Grotesk', 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
  }

  .enter { animation: enterIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes enterIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .screen { display: none; position: fixed; inset: 0; z-index: 5; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---- Lobby ---- */
  #lobbyScreen { gap: 16px; padding-top: 70px; padding-bottom: 60px; justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .lobby-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .lobby-input {
    font-family: inherit; font-size: 14px; letter-spacing: 2px;
    padding: 10px 16px; border-radius: 8px;
    background: rgba(0,0,0,0.35); color: rgba(var(--acc-texthi),0.95);
    border: 1px solid rgba(var(--acc-main),0.3);
    outline: none; text-transform: uppercase; width: 180px;
    text-align: center;
  }
  .lobby-input::placeholder { color: rgba(var(--acc-main),0.35); }
  .lobby-input:focus { border-color: rgba(var(--acc-main),0.6); }
  .lobby-btn {
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    padding: 12px 28px; border-radius: 8px;
    background: rgba(var(--acc-btn),0.18);
    color: rgba(var(--acc-texthi),0.95);
    border: 1px solid rgba(var(--acc-btn),0.4);
    transition: background 0.15s;
  }
  .lobby-btn:hover { background: rgba(var(--acc-btn),0.35); }
  .lobby-btn:disabled { opacity: 0.35; cursor: default; }
  .lobby-btn.primary {
    background: rgba(var(--acc-btn),0.3);
    border-color: rgba(var(--acc-btn),0.6);
  }
  .lobby-btn.primary:hover { background: rgba(var(--acc-btn),0.5); }

  .lobby-divider {
    color: rgba(var(--acc-main),0.3);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 6px 0;
  }

  .mode-row { display: flex; gap: 8px; margin-bottom: 12px; }

  .settings-group { margin-bottom: 16px; text-align: center; }
  .settings-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(var(--acc-main),0.5); margin-bottom: 6px; }
  .settings-options { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .settings-opt {
    font-family: inherit; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    padding: 6px 14px; border-radius: 14px;
    background: rgba(0,0,0,0.25); color: rgba(var(--acc-main),0.5);
    border: 1px solid rgba(var(--acc-main),0.15);
    transition: all 0.15s;
  }
  .settings-opt.active {
    color: rgba(var(--acc-texthi),0.9);
    border-color: rgba(var(--acc-btn),0.5);
    background: rgba(var(--acc-btn),0.15);
  }
  .settings-opt:hover { color: rgba(var(--acc-texthi),0.9); }

  .player-list {
    width: min(420px, 90vw); max-height: 220px; overflow-y: auto;
    border: 1px solid rgba(var(--acc-main),0.2);
    border-radius: 12px; background: rgba(var(--acc-panel),0.82);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
  }
  .player-list h3 {
    font-size: 10px; font-weight: 400; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
    padding: 10px 14px 7px; border-bottom: 1px solid rgba(var(--acc-main),0.18);
    position: sticky; top: 0; background: rgba(var(--acc-panel),0.95);
  }
  .player-list .lb-body { padding: 4px 0; }
  .pl-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 12px;
  }
  .pl-row.me { background: rgba(var(--acc-main),0.14); }
  .pl-row .pn { flex: 1; color: rgba(var(--acc-text),0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-row .pr { font-size: 10px; color: rgba(var(--acc-main),0.5); letter-spacing: 1px; }
  .pl-row .ready-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(var(--acc-main),0.25);
  }
  .pl-row .ready-dot.on { background: rgba(100,220,140,0.9); box-shadow: 0 0 6px rgba(100,220,140,0.4); }

  #lobbyStatus {
    font-size: 12px; color: rgba(var(--acc-main),0.55);
    text-align: center; min-height: 18px;
  }

  .hint {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center; color: rgba(var(--acc-main),0.35);
    font-size: 12px; pointer-events: none; z-index: 6;
  }

  /* ---- Game Canvas ---- */
  #gameScreen { gap: 0; padding: 0; justify-content: center; align-items: center; }
  #gameCanvas {
    display: block;
    max-width: 95vw;
    max-height: calc(100vh - 100px);
    border-radius: 8px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(var(--acc-main),0.14);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35) inset;
    cursor: none !important;
    touch-action: none;
  }
  canvas { cursor: none !important; }
  #gameHud {
    position: fixed; top: 64px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 4px 16px; padding: 0 12px;
    pointer-events: none; z-index: 8;
    font-size: 12px; color: rgba(var(--acc-main),0.7);
  }
  #gameHud .stat { letter-spacing: 0.08em; }
  #gameHud b { color: rgba(var(--acc-texthi),0.95); }

  #countdown {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 72px; font-weight: 700; letter-spacing: 4px;
    color: rgba(var(--acc-texthi),0.95);
    text-shadow: 0 0 30px rgba(var(--acc-bright),0.5);
    pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.2s;
  }
  #countdown.show { opacity: 1; }

  /* ---- D-Pad (Mobile) ---- */
  #dpad {
    display: none;
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 15; pointer-events: auto;
  }
  #dpad.active { display: grid; }
  .dpad-grid {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 3px;
  }
  .dpad-btn {
    width: 56px; height: 56px;
    border-radius: 10px;
    border: 1px solid rgba(var(--acc-main),0.3);
    background: rgba(0,0,0,0.55);
    color: rgba(var(--acc-texthi),0.8);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .dpad-btn:active {
    background: rgba(var(--acc-main),0.3);
    border-color: rgba(var(--acc-main),0.6);
  }
  .dpad-btn.disabled {
    opacity: 0.25;
    pointer-events: none;
  }
  .dpad-empty { width: 60px; height: 60px; }

  /* ---- Results ---- */
  #resultsScreen { gap: 16px; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  .results-winner {
    font-size: 28px; font-weight: 700; letter-spacing: 3px;
    color: rgba(var(--acc-bright),1);
    text-shadow: 0 0 20px rgba(var(--acc-bright),0.3);
  }
  .results-sub {
    font-size: 14px; color: rgba(var(--acc-main),0.8);
    text-align: center; line-height: 1.8;
  }
  .results-sub b { color: rgba(var(--acc-bright),1); }
  .results-row {
    display: flex; gap: 10px; margin-top: 8px;
  }
  .lb-panel {
    margin-top: 20px; width: 100%; max-width: 420px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(var(--acc-main),0.15);
    border-radius: 10px; padding: 12px 16px; text-align: left;
  }
  .lb-panel-title {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(var(--acc-main),0.5); margin-bottom: 8px; text-align: center;
  }
  .lb-panel .lb-row {
    display: grid; grid-template-columns: 28px 1fr 50px;
    align-items: center; padding: 4px 0;
    font-size: 12px; color: rgba(var(--acc-main),0.7);
    border-bottom: 1px solid rgba(var(--acc-main),0.06);
  }
  .lb-panel .lb-row:last-child { border-bottom: none; }
  .lb-panel .lb-row.me { color: rgba(var(--acc-bright),1); }
  .lb-panel .lb-rk { color: rgba(var(--acc-main),0.4); font-size: 11px; }
  .lb-panel .lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-panel .lb-elo { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

  /* ---- Cursor ---- */
  #cursorfx {
    position: fixed; top: 0; left: 0;
    width: 31px; height: 40px;
    background-size: auto 30px;
    pointer-events: none;
    z-index: 100;
    will-change: transform;
    image-rendering: pixelated;
    transform: translate3d(0, 0, 0);
  }
  #cursorfx.arrow  { background: url('assets/cursor-arrow.png') no-repeat 0 0 / auto 30px; }
  #cursorfx.finger { background: url('assets/cursor-finger.png') no-repeat 0 0 / auto 30px; }

  @media (max-width: 640px) {
    h1 { font-weight: 600; font-size: 1.2rem; letter-spacing: 4px; }
    .lobby-input { width: 150px; font-size: 12px; }
    .lobby-btn { font-size: 11px; padding: 8px 14px; }
    .player-list { max-height: 180px; }
    #gameCanvas { width: min(95vmin, 500px); }
    .results-winner { font-size: 22px; }
  }
  @media (pointer: coarse) {
    #cursorfx { display: none; }
  }
</style>

<script>
(() => {
  // ---- Cursor FX ----
  const _curStyle = document.createElement('style');
  _curStyle.textContent = 'html * { cursor: url("assets/cursor-empty.cur") 0 0, none !important; }';
  document.head.appendChild(_curStyle);

  const cursorfx = document.getElementById('cursorfx');
  let realX = window.innerWidth / 2, realY = window.innerHeight / 2;
  let curX = realX, curY = realY;
  let cursorSpritesState = null;
  const TRAIL = 3;
  const trail = [], trailX = [], trailY = [];
  for (let i = 0; i < TRAIL; i++) {
    const t = document.createElement('div');
    t.style.cssText =
      'position:fixed;top:0;left:0;width:31px;height:40px;pointer-events:none;' +
      'z-index:99;will-change:transform;image-rendering:pixelated;' +
      'transform:translate3d(-100px,-100px,0);opacity:' + (0.3 - i * 0.08).toFixed(2) + ';' +
      'background-size:auto 30px;background-repeat:no-repeat;';
    document.body.appendChild(t);
    trail.push(t);
    trailX.push(realX);
    trailY.push(realY);
  }
  document.addEventListener('pointermove', (e) => {
    realX = e.clientX;
    realY = e.clientY;
  });
  document.addEventListener('mouseover', (e) => {
    const INTERACTIVE = 'a, button, input, select, textarea, label, summary, [role="button"], [contenteditable]';
    const t = e.target.closest ? e.target.closest(INTERACTIVE) : null;
    const over = !!t;
    cursorfx.className = over ? 'finger' : 'arrow';
  });
  function paintCursor() {
    const finger = cursorfx.className === 'finger';
    if (cursorSpritesState && cursorSpritesState.arrow) {
      const url = finger ? (cursorSpritesState.finger || cursorSpritesState.arrow) : cursorSpritesState.arrow;
      cursorfx.style.backgroundImage = 'url("' + url + '")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.filter = cursorSpritesState.border || '';
    } else {
      cursorfx.style.backgroundImage = finger ? 'url("assets/cursor-finger.png")' : 'url("assets/cursor-arrow.png")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.backgroundSize = 'auto 30px';
      cursorfx.style.filter = '';
    }
  }
  let _lastUrl = '', _lastFilt = '';
  function cursorTick() {
    if (window.matchMedia('(pointer: coarse)').matches) { requestAnimationFrame(cursorTick); return; }
    curX += (realX - curX) * 0.24;
    curY += (realY - curY) * 0.24;
    paintCursor();
    const finger = cursorfx.className === 'finger';
    const url = cursorSpritesState && cursorSpritesState.arrow
      ? (finger ? (cursorSpritesState.finger || cursorSpritesState.arrow) : cursorSpritesState.arrow)
      : finger ? 'assets/cursor-finger.png' : 'assets/cursor-arrow.png';
    const filt = cursorSpritesState ? (cursorSpritesState.border || '') : '';
    const hotX = finger ? 8 : 1;
    cursorfx.style.transform = 'translate3d(' + (curX - hotX) + 'px,' + curY + 'px,0)';
    for (let i = TRAIL - 1; i > 0; i--) {
      trailX[i] += (trailX[i - 1] - trailX[i]) * 0.35;
      trailY[i] += (trailY[i - 1] - trailY[i]) * 0.35;
    }
    trailX[0] += (curX - trailX[0]) * 0.4;
    trailY[0] += (curY - trailY[0]) * 0.4;
    const urlChanged = url !== _lastUrl || filt !== _lastFilt;
    if (urlChanged) _lastUrl = url, _lastFilt = filt;
    for (let j = 0; j < TRAIL; j++) {
      if (urlChanged) {
        trail[j].style.backgroundImage = 'url("' + url + '")';
        trail[j].style.filter = filt;
      }
      trail[j].style.transform = 'translate3d(' + (trailX[j] - hotX) + 'px,' + trailY[j] + 'px,0)';
    }
    requestAnimationFrame(cursorTick);
  }

    const dx = t.clientX - touchStartX;

    const threshold = 20;
    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
      if (Math.abs(dx) > Math.abs(dy)) {
        swipeDir = dx > 0 ? 'right' : 'left';
      } else {
        swipeDir = dy > 0 ? 'down' : 'up';

  // ---- Canvas Resize ----
  let gridCanvas = null;
  function resizeCanvas() {
    let gw, gh;
    if (gameState && gameState.gridSize) {
      gw = gameState.gridSize.w;
      gh = gameState.gridSize.h;
    } else {
      gw = 640; gh = 480;
    }
    const maxW = window.innerWidth * 0.95;
    const maxH = (window.innerHeight - 100) * 0.95;
    const scale = Math.min(maxW / gw, maxH / gh, 2);
    const cw = Math.floor(gw * scale);
    const ch = Math.floor(gh * scale);
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    gridCanvas = document.createElement('canvas');
    gridCanvas.width = cw;
    gridCanvas.height = ch;
    const gc = gridCanvas.getContext('2d');
    gc.fillStyle = 'rgba(0,0,0,0.4)';
    gc.fillRect(0, 0, cw, ch);
    gc.strokeStyle = 'rgba(255,255,255,0.03)';
    gc.lineWidth = 1;
    gc.beginPath();
    for (let x = 0; x <= cw; x += 40) { gc.moveTo(x, 0); gc.lineTo(x, ch); }
    for (let y = 0; y <= ch; y += 40) { gc.moveTo(0, y); gc.lineTo(cw, y); }
    gc.stroke();
    gc.strokeStyle = 'rgba(255,255,255,0.12)';
    gc.lineWidth = 2;
    gc.strokeRect(1, 1, cw - 2, ch - 2);
  }

  // ---- Render Loop ----
  let renderRunning = false;
  function startRenderLoop() {
    if (renderRunning) return;
    renderRunning = true;
    requestAnimationFrame(renderFrame);
  }
  function stopRenderLoop() { renderRunning = false; }

  function renderFrame() {
    if (!renderRunning) return;
    if (!gameState || currentScreen !== 'game') { renderRunning = false; return; }
    drawGame(gameState);
    updateGameHud(gameState);
    requestAnimationFrame(renderFrame);
  }

  // ---- Draw Game ----
  function drawGame(state) {
    const W = canvas.width;
    const H = canvas.height;

    if (gridCanvas) {
      ctx.drawImage(gridCanvas, 0, 0);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, W, H);
    }

    const players = state.players || [];
    const gw = (state.gridSize && state.gridSize.w) || 640;
    const gh = (state.gridSize && state.gridSize.h) || 480;
    const scaleX = W / gw;
    const scaleY = H / gh;

    // Draw trails with glow
    for (let pi = 0; pi < players.length; pi++) {
      const p = players[pi];
      if (!p.trail || !p.trail.length) continue;
      const color = p.color || 'rgba(0,229,255,0.85)';
      const isDead = !p.alive;

      ctx.globalAlpha = isDead ? 0.2 : 1;

      // Glow pass
      if (!isDead) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = 0.25;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(p.trail[0].x * scaleX + scaleX / 2, p.trail[0].y * scaleY + scaleY / 2);
        for (let i = 1; i < p.trail.length; i++) {
          ctx.lineTo(p.trail[i].x * scaleX + scaleX / 2, p.trail[i].y * scaleY + scaleY / 2);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Core trail
      ctx.globalAlpha = isDead ? 0.2 : 0.9;
      ctx.strokeStyle = color;
      ctx.lineWidth = isDead ? 2 : 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x * scaleX + scaleX / 2, p.trail[0].y * scaleY + scaleY / 2);
      for (let i = 1; i < p.trail.length; i++) {
        ctx.lineTo(p.trail[i].x * scaleX + scaleX / 2, p.trail[i].y * scaleY + scaleY / 2);
      }
      ctx.stroke();

      // Head with glow
      const hx = p.x * scaleX + scaleX / 2;
      const hy = p.y * scaleY + scaleY / 2;
      if (!isDead) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(hx, hy, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = isDead ? 0.25 : 1;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(hx, hy, isDead ? 2.5 : 4, 0, Math.PI * 2);
      ctx.fill();

      // Player name
      if (!isDead) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '10px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.username || '', hx, hy - 10);
      }
    }
    ctx.globalAlpha = 1;

    // Alive count overlay
    const aliveCount = players.filter(p => p.alive).length;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.font = 'bold 13px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(aliveCount + ' remaining', W / 2, 20);
  }

  let _lastHudHtml = '';
  function updateGameHud(state) {
    const players = state.players || [];
    const hud = document.getElementById('gameHud');
    const aliveCount = players.filter(p => p.alive).length;
    let html = '<span class="stat">Room <b>' + (roomCode || '-') + '</b></span>';
    html += '<span class="stat">Alive <b>' + aliveCount + '/' + players.length + '</b></span>';
    if (html !== _lastHudHtml) { _lastHudHtml = html; hud.innerHTML = html; }
  }

  // ---- Input: compute current dir from keys/dpad/swipe ----
  function getCurrentDir() {
    let dir = null;
    const up = keys['ArrowUp'] || keys['KeyW'];
    const down = keys['ArrowDown'] || keys['KeyS'];
    const left = keys['ArrowLeft'] || keys['KeyA'];
    const right = keys['ArrowRight'] || keys['KeyD'];
    if (up && !down && !left && !right) dir = 'up';
    else if (down && !up && !left && !right) dir = 'down';
    else if (left && !right && !up && !down) dir = 'left';
    else if (right && !left && !up && !down) dir = 'right';
    if (dpadDir) dir = dpadDir;
    if (swipeDir) dir = swipeDir;
    return dir;
  }

  // ---- Resize handler ----
  window.addEventListener('resize', resizeCanvas);

  // ---- Context menu prevention ----
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- Boot ----
  showScreen('lobby');

  // Re-check auth on pageshow
  window.addEventListener('pageshow', () => {
    loadPlayer();
    loadTronColor();
  });
})();
</script>
</body>
</html>
