<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    padding: 24px;
  }
  .back { color: rgba(140,180,150,0.6); text-decoration: none; font-size: 14px; transition: color 0.2s; }
  .back:hover { color: rgba(140,180,150,1); }
  h1 {
    margin: 24px 0 4px;
    font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(230,200,140,0.9);
  }
  .who { font-size: 13px; color: #8a9a8a; margin-bottom: 20px; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    border: 1px solid rgba(140,180,150,0.2);
    background: rgba(80,100,90,0.12);
    border-radius: 8px; padding: 10px 16px; min-width: 140px;
  }
  .stat b { display: block; font-size: 20px; font-weight: 300; color: rgba(140,180,150,0.95); }
  .stat span { font-size: 11px; letter-spacing: 1px; color: #8a9a8a; }

  table { border-collapse: collapse; width: 100%; max-width: 1000px; background: rgba(0,0,0,0.2); }
  th, td { padding: 8px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(140,180,150,0.12); white-space: nowrap; }
  th { color: #8a9a8a; font-weight: 300; letter-spacing: 1px; font-size: 11px; text-transform: uppercase; }
  td.num, th.num { text-align: right; }
  tr:hover { background: rgba(80,100,90,0.1); }
  tr.me td { color: rgba(230,200,140,0.95); }
  .btn, input.delta {
    font-family: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: rgba(80,100,90,0.2); color: #e0e0e0; border: 1px solid rgba(140,180,150,0.25);
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: rgba(80,100,90,0.4); }
  .btn.danger { border-color: rgba(200,120,110,0.4); color: rgba(230,170,160,0.95); }
  .btn.danger:hover { background: rgba(200,120,110,0.2); }
  input.delta { width: 90px; text-align: right; }

  #notAdmin, #statusBar { display: none; }
  #notAdmin { color: rgba(230,170,160,0.95); font-size: 15px; line-height: 1.8; }
  #statusBar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(60,90,70,0.95); border: 1px solid rgba(140,180,150,0.4);
    padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 50;
  }
  #statusBar.err { background: rgba(160,80,70,0.95); border-color: rgba(230,170,160,0.5); }
  .empty { color: #8a9a8a; padding: 20px; }
</style>
</head>
<body>
  <a class="back" href="/gallery">&larr; back to gallery</a>
  <h1>Admin Panel</h1>
  <div class="who" id="who"></div>

  <div id="statusBar"></div>

  <div id="notAdmin">
    Access denied. This panel is restricted to the user <b>ruruskaado</b> only.
    <br>Log in as ruruskaado to continue.
  </div>

  <div id="panel">
    <div class="stats">
      <div class="stat"><b id="stUsers">-</b><span>USERS</span></div>
      <div class="stat"><b id="stScore">-</b><span>SCORE POOL</span></div>
      <div class="stat"><b id="stSpent">-</b><span>SPENT POOL</span></div>
      <div class="stat"><b id="stPurchases">-</b><span>PURCHASES</span></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th><th>Username</th><th>Total</th><th>Spent</th><th>Balance</th><th class="num">Plays</th>
          <th class="num">Items</th><th>Created</th><th>Adjust (delta)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

<script src="/crt.js"></script>
<script src="/score.js"></script>
<script src="/cursor.js"></script>
<script>
  (function () {
    var notAdmin = document.getElementById('notAdmin');
    var panel = document.getElementById('panel');
    var who = document.getElementById('who');
    var statusBar = document.getElementById('statusBar');

    function flash(msg, isErr) {
      statusBar.textContent = msg;
      statusBar.className = isErr ? 'err' : '';
      statusBar.style.display = 'block';
      setTimeout(function () { statusBar.style.display = 'none'; }, 2200);
    }

    async function load() {
      var me;
      try { me = (await (await fetch('/api/me')).json()).user; } catch (e) {}
      if (!me || !me.username || me.username.toLowerCase() !== 'ruruskaado') {
        who.textContent = me ? 'signed in as ' + me.username + ' — not authorized' : 'not signed in';
        panel.style.display = 'none';
        notAdmin.style.display = 'block';
        return;
      }
      who.textContent = 'signed in as ' + me.username;
      notAdmin.style.display = 'none';
      try { await render(); } catch (e) { flash('Failed to load panel', true); }
    }

    async function render() {
      var data = await (await fetch('/api/admin/users')).json();
      if (data.error) { flash(data.error, true); return; }
      document.getElementById('stUsers').textContent = data.stats.users;
      document.getElementById('stScore').textContent = data.stats.score_pool;
      document.getElementById('stSpent').textContent = data.stats.spent_pool;
      document.getElementById('stPurchases').textContent = data.stats.purchases;

      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      if (!data.users || !data.users.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">no users yet</td></tr>';
        return;
      }
      data.users.forEach(function (u, i) {
        var meUser = data.admin.username;
        var tr = document.createElement('tr');
        if (u.username.toLowerCase() === meUser.toLowerCase()) tr.className = 'me';
        var created = u.created_at ? new Date(u.created_at * 1000).toISOString().slice(0, 10) : '-';
        var delta = document.createElement('input');
        delta.className = 'delta'; delta.type = 'number'; delta.value = '1000';
        var apply = document.createElement('button');
        apply.className = 'btn'; apply.textContent = 'Adjust';
        apply.onclick = function () { adjust(u.username, parseFloat(delta.value)); };
        var reset = document.createElement('button');
        reset.className = 'btn danger'; reset.textContent = 'Reset';
        reset.onclick = function () { resetUser(u.username); };
        var actions = document.createElement('td');
        actions.appendChild(delta);
        actions.appendChild(apply);
        actions.appendChild(reset);
        tr.innerHTML =
          '<td>' + (i + 1) + '</td><td>' + u.username + '</td>' +
          '<td class="num">' + u.total + '</td><td class="num">' + u.spent + '</td>' +
          '<td class="num">' + u.balance + '</td><td class="num">' + u.plays + '</td>' +
          '<td class="num">' + u.items + '</td><td>' + created + '</td>';
        tr.appendChild(actions);
        tbody.appendChild(tr);
      });
    }

    async function adjust(username, delta) {
      if (!Number.isFinite(delta)) { flash('enter a numeric delta', true); return; }
      var res = await fetch('/api/admin/adjust', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, delta: delta })
      });
      var d = await res.json();
      if (!res.ok) { flash(d.error || 'failed', true); return; }
      flash(username + ': ' + (d.delta > 0 ? '+' : '') + d.delta + ' → total ' + d.total);
      render();
    }

    async function resetUser(username) {
      if (!confirm('Reset ' + username + "'s scores, purchases and equips? This cannot be undone.")) return;
      var res = await fetch('/api/admin/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username })
      });
      var d = await res.json();
      if (!res.ok) { flash(d.error || 'failed', true); return; }
      flash(username + ' reset');
      render();
    }

    load();
  })();
</script>
</body>
</html>
