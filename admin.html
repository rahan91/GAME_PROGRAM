<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    padding: 20px;
  }

  .orb { position: fixed; border-radius: 50%; animation: float 12s ease-in-out infinite; pointer-events: none; }
  .orb--1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(var(--acc-dim),0.18) 0%, transparent 70%); top: 0%; left: 5%; }
  .orb--2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(var(--acc-orb),0.14) 0%, transparent 70%); bottom: 0%; right: 0%; animation-delay: -4s; }
  @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.03); } }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(var(--acc-main),0.6); text-decoration: none; font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(var(--acc-main),1); }

  .head {
    max-width: 1100px; margin: 0 auto; padding: 20px 0 0;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(230,200,140,0.9); font-size: 1.3rem;
  }
  .badge {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(230,200,140,0.15); color: rgba(230,200,140,0.8);
    border: 1px solid rgba(230,200,140,0.25);
  }
  .who { margin-left: auto; font-size: 12px; color: rgba(var(--acc-main),0.5); }

  .section { max-width: 1100px; margin: 24px auto 0; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .section-head h2 {
    font-size: 12px; font-weight: 400; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.5);
  }
  .section-head .line { flex: 1; height: 1px; background: rgba(var(--acc-main),0.12); }

  .table-wrap {
    border: 1px solid rgba(var(--acc-main),0.12);
    border-radius: 0 0 10px 10px; overflow: hidden;
    background: rgba(0,0,0,0.25);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; font-size: 13px; }
  th {
    font-size: 10px; font-weight: 400; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.45);
    background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(var(--acc-main),0.1);
  }
  th.num { text-align: right; }
  td { border-bottom: 1px solid rgba(var(--acc-main),0.06); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(var(--acc-dim),0.08); }
  .stats-bar {
    display: flex; gap: 1px; margin-bottom: 1px;
    border-radius: 10px 10px 0 0; overflow: hidden;
    background: rgba(var(--acc-main),0.12);
  }
  .stats-bar .stat {
    flex: 1; padding: 12px 16px;
    background: rgba(0,0,0,0.35);
  }
  .stats-bar .stat:first-child { border-radius: 10px 0 0 0; }
  .stats-bar .stat:last-child { border-radius: 0 10px 0 0; }
  .stats-bar .stat-label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(var(--acc-main),0.5); margin-bottom: 4px;
  }
  .stats-bar .stat-val {
    font-size: 18px; font-weight: 600; color: rgba(var(--acc-text),0.95);
    font-variant-numeric: tabular-nums; letter-spacing: 0;
  }
  td.num {
    text-align: right; font-variant-numeric: tabular-nums;
    cursor: default; user-select: none;
  }
  td.num:hover { background: rgba(var(--acc-btn),0.12); }
  td.user { color: rgba(var(--acc-text),0.95); font-weight: 400; cursor: default; }
  td.user:hover { background: rgba(200,100,90,0.1); }
  td.me { color: rgba(230,200,140,0.95); }
  td.date { color: rgba(var(--acc-main),0.45); font-size: 12px; }
  td.items-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .strip-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 4px;
    background: rgba(200,60,50,0.15); border: 1px solid rgba(200,60,50,0.3);
    color: rgba(255,140,130,0.8); font-size: 12px; line-height: 1;
    cursor: pointer; transition: background 0.15s; flex-shrink: 0;
  }
  .strip-btn:hover { background: rgba(200,60,50,0.35); }
  td.empty { text-align: center; color: rgba(var(--acc-main),0.35); padding: 32px; font-size: 13px; }

  #ctx {
    display: none; position: fixed; z-index: 200;
    background: rgba(20,28,22,0.97); border: 1px solid rgba(var(--acc-main),0.3);
    border-radius: 8px; padding: 10px 12px; min-width: 180px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #ctx .ctx-title {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(var(--acc-main),0.5); margin-bottom: 6px;
  }
  #ctx .ctx-row {
    display: flex; gap: 6px; align-items: center;
  }
  #ctx input {
    flex: 1; width: 100%; padding: 5px 8px; text-align: right;
    border: 1px solid rgba(var(--acc-main),0.2); border-radius: 5px;
    background: rgba(var(--acc-dim),0.12); color: #e0e0e0;
    font-family: inherit; font-size: 12px;
    -moz-appearance: textfield;
  }
  #ctx input::-webkit-inner-spin-button,
  #ctx input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #ctx input:focus { outline: none; border-color: rgba(var(--acc-main),0.45); }
  .ctx-btn {
    padding: 5px 10px; border: 1px solid rgba(var(--acc-main),0.2);
    border-radius: 5px; background: rgba(var(--acc-dim),0.15);
    color: rgba(var(--acc-text),0.9); font-family: inherit; font-size: 11px;
    letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
    transition: background 0.15s; white-space: nowrap;
  }
  .ctx-btn:hover { background: rgba(var(--acc-dim),0.35); }
  .ctx-btn.add { background: rgba(var(--acc-btn),0.2); border-color: rgba(var(--acc-btn),0.3); }
  .ctx-btn.add:hover { background: rgba(var(--acc-btn),0.4); }
  .ctx-btn.sub { background: rgba(200,100,90,0.15); border-color: rgba(200,100,90,0.3); color: rgba(230,170,160,0.9); }
  .ctx-btn.sub:hover { background: rgba(200,100,90,0.3); }
  .ctx-btn.del { background: rgba(200,60,50,0.2); border-color: rgba(200,60,50,0.4); color: rgba(255,140,130,0.95); margin-top: 6px; width: 100%; text-align: center; }
  .ctx-btn.del:hover { background: rgba(200,60,50,0.4); }
  #ctx .ctx-val {
    font-size: 12px; color: rgba(var(--acc-main),0.7); margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  #ctx .ctx-val span:last-child { color: rgba(var(--acc-text),0.9); }

  #gift {
    display: none; position: fixed; z-index: 200;
    background: rgba(20,28,22,0.97); border: 1px solid rgba(var(--acc-main),0.3);
    border-radius: 8px; padding: 12px 14px; min-width: 230px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #gift .gift-title {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(var(--acc-main),0.55); margin-bottom: 10px;
  }
  #gift .gift-select-wrap { position: relative; margin-bottom: 10px; }
  #gift select {
    width: 100%; padding: 7px 28px 7px 10px;
    border: 1px solid rgba(var(--acc-main),0.25); border-radius: 5px;
    background: rgba(var(--acc-dim),0.14); color: #e0e0e0;
    font-family: inherit; font-size: 12px;
    appearance: none; -webkit-appearance: none; cursor: pointer;
  }
  #gift select:focus { outline: none; border-color: rgba(var(--acc-main),0.5); }
  #gift select option { background: #141c16; color: #e0e0e0; }
  #gift .gift-select-wrap::after {
    content: '\25BE'; position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); color: rgba(var(--acc-main),0.7);
    font-size: 10px; pointer-events: none;
  }
  #gift .gift-row { display: flex; gap: 8px; }
  #gift .gift-row .ctx-btn { flex: 1; padding: 7px 10px; text-align: center; }

  #notAdmin {
    display: none; max-width: 1100px; margin: 60px auto; text-align: center;
  }
  #notAdmin .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  #notAdmin .msg { font-size: 15px; color: rgba(230,170,160,0.8); line-height: 1.8; }
  #notAdmin .hint { font-size: 12px; color: rgba(var(--acc-main),0.4); margin-top: 12px; }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(50,80,60,0.95); border: 1px solid rgba(var(--acc-main),0.35);
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    color: rgba(var(--acc-texthi),0.95); z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: rgba(140,50,45,0.95); border-color: rgba(230,140,130,0.4); }

  #panel { display: none; }
  #panel.show { display: block; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  @media (max-width: 700px) {
    th:nth-child(n+6), td:nth-child(n+6) { display: none; }
  }
</style>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <a class="back" href="/gallery">&larr; Gallery</a>

  <div class="head">
    <h1>Admin</h1>
    <div class="badge">restricted</div>
    <div class="who" id="who"></div>
  </div>

  <div id="notAdmin">
    <div class="icon">&#x1f512;</div>
    <div class="msg">Access denied.<br>This panel is restricted to <b>ruruskaado</b>.</div>
    <div class="hint">Log in on the <a href="/gallery" style="color:rgba(230,200,140,0.7);">gallery</a> first.</div>
  </div>

  <div id="panel">
    <div class="section">
      <div class="section-head"><h2>Users</h2><div class="line"></div></div>
      <div class="stats-bar">
        <div class="stat"><div class="stat-label">Users</div><div class="stat-val" id="stUsers">-</div></div>
        <div class="stat"><div class="stat-label">Score Pool</div><div class="stat-val" id="stScore">-</div></div>
        <div class="stat"><div class="stat-label">Spent</div><div class="stat-val" id="stSpent">-</div></div>
        <div class="stat"><div class="stat-label">Purchases</div><div class="stat-val" id="stPurchases">-</div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Username</th><th class="num">Total</th><th class="num">Spent</th>
              <th class="num">Balance</th><th class="num">Plays</th><th class="num">Items</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="ctx">
    <div class="ctx-title" id="ctxTitle">Edit</div>
    <div class="ctx-val"><span>Current</span><span id="ctxCur">0</span></div>
    <div class="ctx-row">
      <input type="number" id="ctxDelta" value="1000" step="100">
      <button class="ctx-btn add" id="ctxAdd">+</button>
      <button class="ctx-btn sub" id="ctxSub">&minus;</button>
    </div>
  </div>

  <div id="gift">
    <div class="gift-title" id="giftTitle">Gift</div>
    <div class="gift-select-wrap">
      <select id="giftSelect"></select>
    </div>
    <div class="gift-row">
      <button class="ctx-btn add" id="giftGo">Gift</button>
      <button class="ctx-btn" id="giftCancel">Cancel</button>
    </div>
    <button class="ctx-btn del" id="giftStrip">Strip Items</button>
  </div>

  <div id="toast"></div>

<script defer src="crt.js"></script>
  <script src="shop.js"></script>
  <script>
(function () {
  var notAdmin = document.getElementById('notAdmin');
  var panel = document.getElementById('panel');
  var who = document.getElementById('who');
  var toast = document.getElementById('toast');
  var ctx = document.getElementById('ctx');
  var ctxTitle = document.getElementById('ctxTitle');
  var ctxCur = document.getElementById('ctxCur');
  var ctxDelta = document.getElementById('ctxDelta');
  var ctxTarget = null;
  var gift = document.getElementById('gift');
  var giftTitle = document.getElementById('giftTitle');
  var giftSelect = document.getElementById('giftSelect');
  var giftGo = document.getElementById('giftGo');
  var giftTarget = null;
  var toastTimer;

  var GIFT_ITEMS = [
    { key: 'maze:dark-green', slot: 'maze', name: 'Dark Green', price: 10000 },
    { key: 'maze:teal', slot: 'maze', name: 'Teal', price: 12000 },
    { key: 'maze:aqua', slot: 'maze', name: 'Aqua', price: 15000 },
    { key: 'maze:blue', slot: 'maze', name: 'Blue', price: 16700 },
    { key: 'maze:indigo', slot: 'maze', name: 'Indigo', price: 17000 },
    { key: 'maze:violet', slot: 'maze', name: 'Violet', price: 18000 },
    { key: 'maze:red', slot: 'maze', name: 'Red', price: 20000 },
    { key: 'maze:orange', slot: 'maze', name: 'Orange', price: 22000 },
    { key: 'maze:yellow', slot: 'maze', name: 'Yellow', price: 25000 },
    { key: 'cursor:black', slot: 'cursor', name: 'Black', price: 3500 },
    { key: 'cursor:red', slot: 'cursor', name: 'Red', price: 7000 },
    { key: 'cursor:orange', slot: 'cursor', name: 'Orange', price: 7700 },
    { key: 'cursor:yellow', slot: 'cursor', name: 'Yellow', price: 8400 },
    { key: 'cursor:lime', slot: 'cursor', name: 'Lime', price: 9100 },
    { key: 'cursor:green', slot: 'cursor', name: 'Green', price: 9800 },
    { key: 'cursor:teal', slot: 'cursor', name: 'Teal', price: 10500 },
    { key: 'cursor:aqua', slot: 'cursor', name: 'Aqua', price: 11200 },
    { key: 'cursor:blue', slot: 'cursor', name: 'Blue', price: 11900 },
    { key: 'cursor:indigo', slot: 'cursor', name: 'Indigo', price: 12600 },
    { key: 'cursor:violet', slot: 'cursor', name: 'Violet', price: 13300 },
    { key: 'cursor:pink', slot: 'cursor', name: 'Pink', price: 14000 },
    { key: 'target:orange', slot: 'target', name: 'Orange', price: 26000 },
    { key: 'target:yellow', slot: 'target', name: 'Yellow', price: 27300 },
    { key: 'target:green', slot: 'target', name: 'Green', price: 29900 },
    { key: 'target:aqua', slot: 'target', name: 'Aqua', price: 32500 },
    { key: 'target:blue', slot: 'target', name: 'Blue', price: 35100 },
    { key: 'target:purple', slot: 'target', name: 'Purple', price: 39000 }
  ];

  (function seedGiftSelect() {
    var i, it;
    for (i = 0; i < GIFT_ITEMS.length; i++) {
      it = GIFT_ITEMS[i];
      var o = document.createElement('option');
      o.value = it.key;
      o.textContent = it.slot.toUpperCase() + ' \u00b7 ' + it.name + ' \u00b7 ' + (window.Shop ? Shop.fmt(it.price) : it.price);
      giftSelect.appendChild(o);
    }
  })();

  function flash(msg, isErr) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = isErr ? 'err show' : 'show';
    toastTimer = setTimeout(function () { toast.className = ''; }, 2400);
  }

  function hideCtx() { ctx.style.display = 'none'; ctxTarget = null; }
  function hideGift() { gift.style.display = 'none'; giftTarget = null; }
  document.addEventListener('click', hideCtx);
  document.addEventListener('scroll', function () { hideCtx(); hideGift(); });
  document.addEventListener('click', hideGift);

  ctx.addEventListener('click', function (e) { e.stopPropagation(); });
  gift.addEventListener('click', function (e) { e.stopPropagation(); });

  ctxDelta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { doCtxAdjust(); e.preventDefault(); }
    if (e.key === 'Escape') hideCtx();
  });

  document.getElementById('ctxAdd').addEventListener('click', function () { doCtxAdjust(false); });
  document.getElementById('ctxSub').addEventListener('click', function () {
    doCtxAdjust(true);
  });

  function doCtxAdjust(negate) {
    if (!ctxTarget) return;
    var delta = Math.round(Number(ctxDelta.value) || 0);
    if (negate) delta = -delta;
    if (!delta) { flash('enter an amount', true); return; }
    adjust(ctxTarget.username, ctxTarget.field, delta);
    hideCtx();
  }

  function showCtx(e, username, field, current) {
    e.preventDefault();
    e.stopPropagation();
    ctxTarget = { username: username, field: field };
    var labels = { total: 'Total', spent: 'Spent', plays: 'Plays' };
    ctxTitle.textContent = (labels[field] || field) + ' \u2014 ' + username;
    ctxCur.textContent = Shop.fmt(current);
    var rect = e.target.getBoundingClientRect();
    ctx.style.display = 'block';
    var cx = rect.left;
    var cy = rect.bottom + 6;
    var ch = Math.max(90, ctx.offsetHeight);
    var cw = Math.max(180, ctx.offsetWidth);
    if (cx + cw > window.innerWidth) cx = window.innerWidth - cw - 8;
    if (cy + ch > window.innerHeight) cy = rect.top - ch - 6;
    if (cy < 8) cy = 8;
    if (cx < 8) cx = 8;
    ctx.style.left = cx + 'px';
    ctx.style.top = cy + 'px';
    ctxDelta.focus();
    ctxDelta.select();
  }

  function openGift(e, username) {
    e.preventDefault();
    e.stopPropagation();
    hideCtx();
    giftTarget = { username: username };
    giftTitle.textContent = 'Gift \u2014 ' + username;
    giftSelect.selectedIndex = 0;
    var rect = e.target.getBoundingClientRect();
    gift.style.display = 'block';
    var cx = rect.left;
    var cy = rect.bottom + 8;
    var gh = Math.max(120, gift.offsetHeight);
    var gw = Math.max(230, gift.offsetWidth);
    if (cx + gw > window.innerWidth) cx = window.innerWidth - gw - 8;
    if (cy + gh > window.innerHeight) cy = rect.top - gh - 8;
    if (cy < 8) cy = 8;
    if (cx < 8) cx = 8;
    gift.style.left = cx + 'px';
    gift.style.top = cy + 'px';
    giftSelect.focus();
  }

  document.getElementById('giftGo').addEventListener('click', async function () {
    if (!giftTarget) return;
    var key = giftSelect.value;
    if (!key) return;
    giftGo.disabled = true;
    try {
      var res = await fetch('/api/admin/gift', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: giftTarget.username, item_key: key })
      });
      var d = await res.json();
      if (!res.ok) { flash(d.error || 'failed', true); return; }
      flash('gifted ' + key + ' to ' + giftTarget.username);
      render();
    } finally {
      giftGo.disabled = false;
      hideGift();
    }
  });
  document.getElementById('giftCancel').addEventListener('click', hideGift);
  document.getElementById('giftStrip').addEventListener('click', async function () {
    if (!giftTarget) return;
    if (!confirm('STRIP ALL ITEMS FROM ' + giftTarget.username + '?\n\nRemoves every purchase and equip.')) return;
    try {
      var res = await fetch('/api/admin/strip', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: giftTarget.username })
      });
      var d = await res.json();
      if (!res.ok) { flash(d.error || 'failed', true); return; }
      flash(d.username + ': stripped ' + d.items_removed + ' item(s), cleared ' + d.equips_cleared + ' equip(s)');
      render();
    } finally {
      hideGift();
    }
  });

  async function load() {
    var me;
    try { me = (await (await fetch('/api/me')).json()).user; } catch (e) {}
    if (!me || !me.username || me.username.toLowerCase() !== 'ruruskaado') {
      who.textContent = me ? 'signed in as ' + me.username : 'not signed in';
      panel.classList.remove('show');
      notAdmin.style.display = '';
      return;
    }
    who.textContent = me.username;
    notAdmin.style.display = 'none';
    panel.classList.add('show');
    try { await render(); } catch (e) { flash('Failed to load', true); }
  }

  async function render() {
    var data = await (await fetch('/api/admin/users')).json();
    if (data.error) { flash(data.error, true); return; }

    document.getElementById('stUsers').textContent = data.stats.users;
    document.getElementById('stScore').textContent = Shop.fmt(data.stats.score_pool);
    document.getElementById('stSpent').textContent = Shop.fmt(data.stats.spent_pool);
    document.getElementById('stPurchases').textContent = data.stats.purchases;

    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    if (!data.users || !data.users.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">no users yet</td></tr>';
      return;
    }
    data.users.forEach(function (u, i) {
      var tr = document.createElement('tr');
      var isMe = u.username.toLowerCase() === data.admin.username.toLowerCase();
      if (isMe) tr.className = 'me';
      var date = u.created_at ? new Date(u.created_at * 1000).toISOString().slice(0, 10) : '-';
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td class="user">' + u.username + '</td>' +
        '<td class="num">' + Shop.fmt(u.total) + '</td>' +
        '<td class="num">' + Shop.fmt(u.spent) + '</td>' +
        '<td class="num">' + Shop.fmt(u.balance) + '</td>' +
        '<td class="num">' + Shop.fmt(u.plays) + '</td>' +
        '<td class="num items-cell"><span>' + u.items + '</span>' + (u.items > 0 && !isMe ? '<button class="strip-btn" title="Strip all items">&times;</button>' : '') + '</td>' +
        '<td class="date">' + date + '</td>';
      tbody.appendChild(tr);

      var cells = tr.querySelectorAll('td');
      cells[2].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'total', u.total); });
      cells[3].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'spent', u.spent); });
      cells[5].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'plays', u.plays); });
      cells[6].addEventListener('contextmenu', function (e) { openGift(e, u.username); });
      var stripBtn = cells[6].querySelector('.strip-btn');
      if (stripBtn) stripBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Strip all items from ' + u.username + '?')) return;
        fetch('/api/admin/strip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: u.username }) })
          .then(function(r){ return r.json(); })
          .then(function(d){ if (d.error) { flash(d.error, true); return; } flash(u.username + ': stripped ' + d.items_removed + ' item(s)'); render(); });
      });
      cells[1].addEventListener('contextmenu', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (isMe) { flash('cannot delete yourself', true); return; }
        deleteUser(u.username);
      });
    });
  }

  async function adjust(username, field, delta) {
    var res = await fetch('/api/admin/adjust', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, field: field, delta: delta })
    });
    var d = await res.json();
    if (!res.ok) { flash(d.error || 'failed', true); return; }
    flash(username + ': ' + field + ' ' + (d.delta > 0 ? '+' : '') + Shop.fmt(d.delta) + ' \u2192 ' + Shop.fmt(d[field]));
    render();
  }

  async function deleteUser(username) {
    if (!confirm('PERMANENTLY DELETE ' + username + "?\n\nThis removes their account, scores, purchases, and equips.")) return;
    var res = await fetch('/api/admin/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username })
    });
    var d = await res.json();
    if (!res.ok) { flash(d.error || 'failed', true); return; }
    flash(username + ' deleted');
    render();
  }

  load();
})();
</script>
</body>
</html>
