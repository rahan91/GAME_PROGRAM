<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crt.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    padding: 20px;
  }

  .orb { position: fixed; border-radius: 50%; animation: float 12s ease-in-out infinite; pointer-events: none; }
  .orb--1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%); top: 0%; left: 5%; }
  .orb--2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%); bottom: 0%; right: 0%; animation-delay: -4s; }
  @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.03); } }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(140,180,150,0.6); text-decoration: none; font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(140,180,150,1); }

  .head {
    max-width: 1100px; margin: 0 auto; padding: 20px 0 0;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(230,200,140,0.9); font-size: 1.3rem;
  }
  .badge {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(230,200,140,0.15); color: rgba(230,200,140,0.8);
    border: 1px solid rgba(230,200,140,0.25);
  }
  .who { margin-left: auto; font-size: 12px; color: rgba(140,180,150,0.5); }

  .stats {
    max-width: 1100px; margin: 24px auto 0;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  .stat {
    border: 1px solid rgba(140,180,150,0.15);
    background: rgba(80,100,90,0.1); border-radius: 10px;
    padding: 14px 16px; text-align: center;
  }
  .stat .val {
    display: block; font-size: 22px; font-weight: 300;
    color: rgba(140,180,150,0.95); margin-bottom: 4px;
  }
  .stat .lbl {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(140,180,150,0.45);
  }

  .section { max-width: 1100px; margin: 28px auto 0; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .section-head h2 {
    font-size: 12px; font-weight: 400; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(140,180,150,0.5);
  }
  .section-head .line { flex: 1; height: 1px; background: rgba(140,180,150,0.12); }

  .table-wrap {
    border: 1px solid rgba(140,180,150,0.12);
    border-radius: 10px; overflow: hidden;
    background: rgba(0,0,0,0.25);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; font-size: 13px; }
  th {
    font-size: 10px; font-weight: 400; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(140,180,150,0.45);
    background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(140,180,150,0.1);
  }
  td { border-bottom: 1px solid rgba(140,180,150,0.06); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(80,100,90,0.08); }
  td.num {
    text-align: right; font-variant-numeric: tabular-nums;
    cursor: default; user-select: none;
  }
  td.num:hover { background: rgba(100,180,120,0.12); }
  td.user { color: rgba(200,220,205,0.95); font-weight: 400; cursor: default; }
  td.user:hover { background: rgba(200,100,90,0.1); }
  td.me { color: rgba(230,200,140,0.95); }
  td.date { color: rgba(140,180,150,0.45); font-size: 12px; }
  td.empty { text-align: center; color: rgba(140,180,150,0.35); padding: 32px; font-size: 13px; }

  #ctx {
    display: none; position: fixed; z-index: 200;
    background: rgba(20,28,22,0.97); border: 1px solid rgba(140,180,150,0.3);
    border-radius: 8px; padding: 10px 12px; min-width: 180px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #ctx .ctx-title {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(140,180,150,0.5); margin-bottom: 6px;
  }
  #ctx .ctx-row {
    display: flex; gap: 6px; align-items: center;
  }
  #ctx input {
    flex: 1; width: 100%; padding: 5px 8px; text-align: right;
    border: 1px solid rgba(140,180,150,0.2); border-radius: 5px;
    background: rgba(80,100,90,0.12); color: #e0e0e0;
    font-family: inherit; font-size: 12px;
    -moz-appearance: textfield;
  }
  #ctx input::-webkit-inner-spin-button,
  #ctx input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #ctx input:focus { outline: none; border-color: rgba(140,180,150,0.45); }
  #ctx .ctx-btn {
    padding: 5px 10px; border: 1px solid rgba(140,180,150,0.2);
    border-radius: 5px; background: rgba(80,100,90,0.15);
    color: rgba(200,220,205,0.9); font-family: inherit; font-size: 11px;
    letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
    transition: background 0.15s; white-space: nowrap;
  }
  #ctx .ctx-btn:hover { background: rgba(80,100,90,0.35); }
  #ctx .ctx-btn.add { background: rgba(100,180,120,0.2); border-color: rgba(100,180,120,0.3); }
  #ctx .ctx-btn.add:hover { background: rgba(100,180,120,0.4); }
  #ctx .ctx-btn.sub { background: rgba(200,100,90,0.15); border-color: rgba(200,100,90,0.3); color: rgba(230,170,160,0.9); }
  #ctx .ctx-btn.sub:hover { background: rgba(200,100,90,0.3); }
  #ctx .ctx-btn.del { background: rgba(200,60,50,0.2); border-color: rgba(200,60,50,0.4); color: rgba(255,140,130,0.95); margin-top: 6px; width: 100%; text-align: center; }
  #ctx .ctx-btn.del:hover { background: rgba(200,60,50,0.4); }
  #ctx .ctx-val {
    font-size: 12px; color: rgba(140,180,150,0.7); margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  #ctx .ctx-val span:last-child { color: rgba(200,220,205,0.9); }

  #notAdmin {
    display: none; max-width: 1100px; margin: 60px auto; text-align: center;
  }
  #notAdmin .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  #notAdmin .msg { font-size: 15px; color: rgba(230,170,160,0.8); line-height: 1.8; }
  #notAdmin .hint { font-size: 12px; color: rgba(140,180,150,0.4); margin-top: 12px; }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(50,80,60,0.95); border: 1px solid rgba(140,180,150,0.35);
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    color: rgba(220,240,225,0.95); z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: rgba(140,50,45,0.95); border-color: rgba(230,140,130,0.4); }

  #panel { display: none; }
  #panel.show { display: block; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    th:nth-child(n+6), td:nth-child(n+6) { display: none; }
  }
</style>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <a class="back" href="/gallery">&larr; Gallery</a>

  <div class="head">
    <h1>Admin</h1>
    <div class="badge">restricted</div>
    <div class="who" id="who"></div>
  </div>

  <div id="notAdmin">
    <div class="icon">&#x1f512;</div>
    <div class="msg">Access denied.<br>This panel is restricted to <b>ruruskaado</b>.</div>
    <div class="hint">Log in on the <a href="/gallery" style="color:rgba(230,200,140,0.7);">gallery</a> first.</div>
  </div>

  <div id="panel">
    <div class="stats">
      <div class="stat"><span class="val" id="stUsers">-</span><span class="lbl">Users</span></div>
      <div class="stat"><span class="val" id="stScore">-</span><span class="lbl">Score Pool</span></div>
      <div class="stat"><span class="val" id="stSpent">-</span><span class="lbl">Spent</span></div>
      <div class="stat"><span class="val" id="stPurchases">-</span><span class="lbl">Purchases</span></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Users</h2><div class="line"></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Username</th><th class="num">Total</th><th class="num">Spent</th>
            <th class="num">Balance</th><th class="num">Plays</th><th class="num">Items</th>
            <th>Joined</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="ctx">
    <div class="ctx-title" id="ctxTitle">Edit</div>
    <div class="ctx-val"><span>Current</span><span id="ctxCur">0</span></div>
    <div class="ctx-row">
      <input type="number" id="ctxDelta" value="1000" step="100">
      <button class="ctx-btn add" id="ctxAdd">+</button>
      <button class="ctx-btn sub" id="ctxSub">&minus;</button>
    </div>
  </div>

  <div id="toast"></div>

<script defer src="crt.js"></script>
<script>
(function () {
  var notAdmin = document.getElementById('notAdmin');
  var panel = document.getElementById('panel');
  var who = document.getElementById('who');
  var toast = document.getElementById('toast');
  var ctx = document.getElementById('ctx');
  var ctxTitle = document.getElementById('ctxTitle');
  var ctxCur = document.getElementById('ctxCur');
  var ctxDelta = document.getElementById('ctxDelta');
  var ctxTarget = null;
  var toastTimer;

  function flash(msg, isErr) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = isErr ? 'err show' : 'show';
    toastTimer = setTimeout(function () { toast.className = ''; }, 2400);
  }

  function hideCtx() { ctx.style.display = 'none'; ctxTarget = null; }
  document.addEventListener('click', hideCtx);
  document.addEventListener('scroll', hideCtx);

  ctx.addEventListener('click', function (e) { e.stopPropagation(); });

  ctxDelta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { doCtxAdjust(); e.preventDefault(); }
    if (e.key === 'Escape') hideCtx();
  });

  document.getElementById('ctxAdd').addEventListener('click', doCtxAdjust);
  document.getElementById('ctxSub').addEventListener('click', function () {
    doCtxAdjust(true);
  });

  function doCtxAdjust(negate) {
    if (!ctxTarget) return;
    var delta = Math.round(Number(ctxDelta.value) || 0);
    if (negate) delta = -delta;
    if (!delta) { flash('enter an amount', true); return; }
    adjust(ctxTarget.username, ctxTarget.field, delta);
    hideCtx();
  }

  function showCtx(e, username, field, current) {
    e.preventDefault();
    e.stopPropagation();
    ctxTarget = { username: username, field: field };
    var labels = { total: 'Total', spent: 'Spent', plays: 'Plays' };
    ctxTitle.textContent = (labels[field] || field) + ' \u2014 ' + username;
    ctxCur.textContent = current.toLocaleString();
    var rect = e.target.getBoundingClientRect();
    ctx.style.display = 'block';
    var cx = rect.left;
    var cy = rect.bottom + 6;
    if (cx + 200 > window.innerWidth) cx = window.innerWidth - 210;
    if (cy + 100 > window.innerHeight) cy = rect.top - 100;
    ctx.style.left = cx + 'px';
    ctx.style.top = cy + 'px';
    ctxDelta.focus();
    ctxDelta.select();
  }

  async function load() {
    var me;
    try { me = (await (await fetch('/api/me')).json()).user; } catch (e) {}
    if (!me || !me.username || me.username.toLowerCase() !== 'ruruskaado') {
      who.textContent = me ? 'signed in as ' + me.username : 'not signed in';
      panel.classList.remove('show');
      notAdmin.style.display = '';
      return;
    }
    who.textContent = me.username;
    notAdmin.style.display = 'none';
    panel.classList.add('show');
    try { await render(); } catch (e) { flash('Failed to load', true); }
  }

  async function render() {
    var data = await (await fetch('/api/admin/users')).json();
    if (data.error) { flash(data.error, true); return; }

    document.getElementById('stUsers').textContent = data.stats.users;
    document.getElementById('stScore').textContent = data.stats.score_pool.toLocaleString();
    document.getElementById('stSpent').textContent = data.stats.spent_pool.toLocaleString();
    document.getElementById('stPurchases').textContent = data.stats.purchases;

    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    if (!data.users || !data.users.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">no users yet</td></tr>';
      return;
    }
    data.users.forEach(function (u, i) {
      var tr = document.createElement('tr');
      var isMe = u.username.toLowerCase() === data.admin.username.toLowerCase();
      if (isMe) tr.className = 'me';
      var date = u.created_at ? new Date(u.created_at * 1000).toISOString().slice(0, 10) : '-';
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td class="user">' + u.username + '</td>' +
        '<td class="num">' + u.total.toLocaleString() + '</td>' +
        '<td class="num">' + u.spent.toLocaleString() + '</td>' +
        '<td class="num">' + u.balance.toLocaleString() + '</td>' +
        '<td class="num">' + u.plays.toLocaleString() + '</td>' +
        '<td class="num">' + u.items + '</td>' +
        '<td class="date">' + date + '</td>';
      tbody.appendChild(tr);

      var cells = tr.querySelectorAll('td');
      cells[2].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'total', u.total); });
      cells[3].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'spent', u.spent); });
      cells[5].addEventListener('contextmenu', function (e) { showCtx(e, u.username, 'plays', u.plays); });
      cells[1].addEventListener('contextmenu', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (isMe) { flash('cannot delete yourself', true); return; }
        deleteUser(u.username);
      });
    });
  }

  async function adjust(username, field, delta) {
    var res = await fetch('/api/admin/adjust', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, field: field, delta: delta })
    });
    var d = await res.json();
    if (!res.ok) { flash(d.error || 'failed', true); return; }
    flash(username + ': ' + field + ' ' + (d.delta > 0 ? '+' : '') + d.delta + ' \u2192 ' + d[field].toLocaleString());
    render();
  }

  async function deleteUser(username) {
    if (!confirm('PERMANENTLY DELETE ' + username + "?\n\nThis removes their account, scores, purchases, and equips.")) return;
    var res = await fetch('/api/admin/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username })
    });
    var d = await res.json();
    if (!res.ok) { flash(d.error || 'failed', true); return; }
    flash(username + ' deleted');
    render();
  }

  load();
})();
</script>
</body>
</html>
