<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    cursor: none !important;
  }
  *, *::before, *::after { cursor: url('assets/cursor-empty.cur') 0 0, none !important; }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(var(--acc-dim),0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(var(--acc-orb),0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(var(--acc-main),0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(var(--acc-main),1); }

  h1 {
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
  }

  .enter { animation: enterIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes enterIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .screen { display: none; position: fixed; inset: 0; z-index: 5; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---- Lobby ---- */
  #lobbyScreen { gap: 16px; padding-top: 70px; justify-content: flex-start; overflow-y: auto; }
  .lobby-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .lobby-input {
    font-family: inherit; font-size: 14px; letter-spacing: 2px;
    padding: 10px 16px; border-radius: 8px;
    background: rgba(0,0,0,0.35); color: rgba(var(--acc-texthi),0.95);
    border: 1px solid rgba(var(--acc-main),0.3);
    outline: none; text-transform: uppercase; width: 180px;
    text-align: center;
  }
  .lobby-input::placeholder { color: rgba(var(--acc-main),0.35); }
  .lobby-input:focus { border-color: rgba(var(--acc-main),0.6); }
  .lobby-btn {
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    padding: 12px 28px; border-radius: 8px;
    background: rgba(var(--acc-btn),0.18);
    color: rgba(var(--acc-texthi),0.95);
    border: 1px solid rgba(var(--acc-btn),0.4);
    transition: background 0.15s;
  }
  .lobby-btn:hover { background: rgba(var(--acc-btn),0.35); }
  .lobby-btn:disabled { opacity: 0.35; cursor: default; }
  .lobby-btn.primary {
    background: rgba(var(--acc-btn),0.3);
    border-color: rgba(var(--acc-btn),0.6);
  }
  .lobby-btn.primary:hover { background: rgba(var(--acc-btn),0.5); }

  .lobby-divider {
    color: rgba(var(--acc-main),0.3);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 6px 0;
  }

  .mode-row { display: flex; gap: 8px; margin-bottom: 12px; }

  .settings-group { margin-bottom: 16px; text-align: center; }
  .settings-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(var(--acc-main),0.5); margin-bottom: 6px; }
  .settings-options { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .settings-opt {
    font-family: inherit; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    padding: 6px 14px; border-radius: 14px;
    background: rgba(0,0,0,0.25); color: rgba(var(--acc-main),0.5);
    border: 1px solid rgba(var(--acc-main),0.15);
    transition: all 0.15s;
  }
  .settings-opt.active {
    color: rgba(var(--acc-texthi),0.9);
    border-color: rgba(var(--acc-btn),0.5);
    background: rgba(var(--acc-btn),0.15);
  }
  .settings-opt:hover { color: rgba(var(--acc-texthi),0.9); }
  .mode-btn {
    font-family: inherit; font-size: 12px; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    padding: 8px 18px; border-radius: 20px;
    background: rgba(0,0,0,0.3); color: rgba(var(--acc-main),0.6);
    border: 1px solid rgba(var(--acc-main),0.2);
    transition: all 0.15s;
  }
  .mode-btn.active {
    color: rgba(var(--acc-texthi),0.95);
    border-color: rgba(var(--acc-btn),0.5);
    background: rgba(var(--acc-btn),0.2);
  }
  .mode-btn:hover { color: rgba(var(--acc-texthi),0.95); }

  .room-code {
    font-size: 18px; letter-spacing: 4px; color: rgba(var(--acc-bright),1);
    padding: 12px 24px; border-radius: 8px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(var(--acc-main),0.25);
    text-align: center;
  }

  .player-list {
    width: min(420px, 90vw); max-height: 220px; overflow-y: auto;
    border: 1px solid rgba(var(--acc-main),0.2);
    border-radius: 12px; background: rgba(var(--acc-panel),0.82);

    backdrop-filter: blur(3px);
  }
  .player-list h3 {
    font-size: 10px; font-weight: 400; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(var(--acc-main),0.85);
    padding: 10px 14px 7px; border-bottom: 1px solid rgba(var(--acc-main),0.18);
    position: sticky; top: 0; background: rgba(var(--acc-panel),0.95);
  }
  .player-list .lb-body { padding: 4px 0; }
  .pl-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 12px;
  }
  .pl-row.me { background: rgba(var(--acc-main),0.14); }
  .pl-row .pn { flex: 1; color: rgba(var(--acc-text),0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-row .pr { font-size: 10px; color: rgba(var(--acc-main),0.5); letter-spacing: 1px; }
  .pl-row .ready-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(var(--acc-main),0.25);
  }
  .pl-row .ready-dot.on { background: rgba(100,220,140,0.9); box-shadow: 0 0 6px rgba(100,220,140,0.4); }

  #lobbyStatus {
    font-size: 12px; color: rgba(var(--acc-main),0.55);
    text-align: center; min-height: 18px;
  }

  .hint {
    position: fixed; bottom: 18px; left: 0; right: 0;
    text-align: center; color: rgba(var(--acc-main),0.35);
    font-size: 12px; pointer-events: none; z-index: 6;
  }

  /* ---- Game Canvas ---- */
  #gameScreen { gap: 0; padding-top: 64px; }
  #gameCanvas {
    display: block;
    width: min(90vmin, 700px);
    max-width: 90vw;
    aspect-ratio: auto;
    border-radius: 12px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(var(--acc-main),0.14);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35) inset;
    cursor: none !important;
    touch-action: none;
  }
  canvas { cursor: none !important; }
  #gameHud {
    position: fixed; top: 64px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 4px 16px; padding: 0 12px;
    pointer-events: none; z-index: 8;
    font-size: 12px; color: rgba(var(--acc-main),0.7);
  }
  #gameHud .stat { letter-spacing: 0.08em; }
  #gameHud b { color: rgba(var(--acc-texthi),0.95); }

  #countdown {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 72px; font-weight: 700; letter-spacing: 4px;
    color: rgba(var(--acc-texthi),0.95);
    text-shadow: 0 0 30px rgba(var(--acc-bright),0.5);
    pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.2s;
  }
  #countdown.show { opacity: 1; }

  /* ---- Results ---- */
  #resultsScreen { gap: 16px; }
  .results-winner {
    font-size: 28px; font-weight: 700; letter-spacing: 3px;
    color: rgba(var(--acc-bright),1);
    text-shadow: 0 0 20px rgba(var(--acc-bright),0.3);
  }
  .results-sub {
    font-size: 14px; color: rgba(var(--acc-main),0.8);
    text-align: center; line-height: 1.8;
  }
  .results-sub b { color: rgba(var(--acc-bright),1); }
  .results-row {
    display: flex; gap: 10px; margin-top: 8px;
  }

  /* ---- Cursor ---- */
  #cursorfx {
    position: fixed; top: 0; left: 0;
    width: 31px; height: 40px;
    background-size: auto 30px;
    pointer-events: none;
    z-index: 100;
    will-change: transform;
    image-rendering: pixelated;
    transform: translate3d(0, 0, 0);
  }
  #cursorfx.arrow  { background: url('assets/cursor-arrow.png') no-repeat 0 0 / auto 30px; }
  #cursorfx.finger { background: url('assets/cursor-finger.png') no-repeat 0 0 / auto 30px; }

  @media (max-width: 640px) {
    h1 { font-size: 1.2rem; letter-spacing: 4px; }
    .lobby-input { width: 150px; font-size: 12px; }
    .lobby-btn { font-size: 11px; padding: 8px 14px; }
    .player-list { max-height: 180px; }
    #gameCanvas { width: min(95vmin, 600px); }
    .results-winner { font-size: 22px; }
  }
  @media (pointer: coarse) {
    #cursorfx { display: none; }
  }
</style>

<script>
(() => {
  // ---- Cursor FX ----
  const _curStyle = document.createElement('style');
  _curStyle.textContent = 'html * { cursor: url("assets/cursor-empty.cur") 0 0, none !important; }';
  document.head.appendChild(_curStyle);

  const cursorfx = document.getElementById('cursorfx');
  let realX = window.innerWidth / 2, realY = window.innerHeight / 2;
  let curX = realX, curY = realY;
  let cursorSpritesState = null;
  const TRAIL = 3;
  const trail = [], trailX = [], trailY = [];
  for (let i = 0; i < TRAIL; i++) {
    const t = document.createElement('div');
    t.style.cssText =
      'position:fixed;top:0;left:0;width:31px;height:40px;pointer-events:none;' +
      'z-index:99;will-change:transform;image-rendering:pixelated;' +
      'transform:translate3d(-100px,-100px,0);opacity:' + (0.3 - i * 0.08).toFixed(2) + ';' +
      'background-size:auto 30px;background-repeat:no-repeat;';
    document.body.appendChild(t);
    trail.push(t);
    trailX.push(realX);
    trailY.push(realY);
  }
  document.addEventListener('pointermove', (e) => {
    realX = e.clientX;
    realY = e.clientY;
  });
  function paintCursor() {
    if (cursorSpritesState && cursorSpritesState.arrow) {
      cursorfx.style.backgroundImage = 'url("' + cursorSpritesState.arrow + '")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.filter = cursorSpritesState.border || '';
    } else {
      cursorfx.style.backgroundImage = '';
      cursorfx.style.filter = '';
    }
  }
  let _lastUrl = '', _lastFilt = '';
  function cursorTick() {
    if (window.matchMedia('(pointer: coarse)').matches) { requestAnimationFrame(cursorTick); return; }
    curX += (realX - curX) * 0.24;
    curY += (realY - curY) * 0.24;
    cursorfx.style.transform = 'translate3d(' + curX + 'px,' + curY + 'px,0)';
    const url = cursorSpritesState && cursorSpritesState.arrow
      ? cursorSpritesState.arrow
      : 'assets/cursor-arrow.png';
    const filt = cursorSpritesState ? (cursorSpritesState.border || '') : '';
    for (let i = TRAIL - 1; i > 0; i--) {
      trailX[i] += (trailX[i - 1] - trailX[i]) * 0.35;
      trailY[i] += (trailY[i - 1] - trailY[i]) * 0.35;
    }
    trailX[0] += (curX - trailX[0]) * 0.4;
    trailY[0] += (curY - trailY[0]) * 0.4;
    const urlChanged = url !== _lastUrl || filt !== _lastFilt;
    if (urlChanged) _lastUrl = url, _lastFilt = filt;
    for (let j = 0; j < TRAIL; j++) {
      if (urlChanged) {
        trail[j].style.backgroundImage = 'url("' + url + '")';
        trail[j].style.filter = filt;
      }
      trail[j].style.transform = 'translate3d(' + trailX[j] + 'px,' + trailY[j] + 'px,0)';
    }
    requestAnimationFrame(cursorTick);
  }
  requestAnimationFrame(cursorTick);

  async function applyCosmetics() {
    try {
      const s = await Shop.state();
      const cur = Shop.installed(s.equipped, Shop.CURSOR);
      cursorSpritesState = (cur && cur.color) ? await Shop.cursorSprites(cur.color) : { arrow: null, finger: null, border: '' };
      paintCursor();
    } catch (e) {}
  }
  applyCosmetics();

  // ---- Auth / Player ----
  let isLoggedIn = false;
  let playerUsername = 'anonymous';
  let myUserId = null;
  async function loadPlayer() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      const user = data.user || null;
      isLoggedIn = !!(user && user.username);
      if (user && user.username) playerUsername = user.username;
      if (user && user.id != null) myUserId = String(user.id);
      window.__user = user || {};
    } catch { isLoggedIn = false; window.__user = {}; }
    document.getElementById('loginBanner').style.display = isLoggedIn ? 'none' : '';
  }
  loadPlayer();

  // ---- Pong Cosmetics (paddle color) ----
  let myPaddleColor = '#8cb496';
  async function loadPongColor() {
    try {
      const s = await Shop.state();
      const item = Shop.installed(s.equipped, Shop.PONG);
      myPaddleColor = (item && item.color) || '#8cb496';
    } catch (e) { myPaddleColor = '#8cb496'; }
  }
  loadPongColor();

  // ---- State ----
  const lobbyScreen = document.getElementById('lobbyScreen');
  const gameScreen = document.getElementById('gameScreen');
  const resultsScreen = document.getElementById('resultsScreen');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const countdownEl = document.getElementById('countdown');

  let currentScreen = 'lobby';
  let roomCode = null;
  let isHost = false;
  let createdRoom = false;
  let myPlayerIndex = -1;
  let selectedMode = 'teams';
  let ready = false;
  let pollTimer = null;
  let gameState = null;
  let lastStateTime = 0;

  // Key state
  const keys = {};
  document.addEventListener('keydown', (e) => { keys[e.code] = true; });
  document.addEventListener('keyup', (e) => { keys[e.code] = false; });

  // Touch state
  let touchDir = 0;
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const y = t.clientY - rect.top;
    touchDir = y < rect.height / 2 ? -1 : 1;
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const y = t.clientY - rect.top;
    touchDir = y < rect.height / 2 ? -1 : 1;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { touchDir = 0; });
  canvas.addEventListener('touchcancel', () => { touchDir = 0; });

  // Mouse control
  let mouseY = -1;
  let mouseActive = false;
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseY = (e.clientY - rect.top) / rect.height;
    mouseActive = true;
  });
  canvas.addEventListener('mouseleave', () => { mouseActive = false; mouseY = -1; });
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseY = (e.clientY - rect.top) / rect.height;
    mouseActive = true;
  });

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (e) { return null; }
  }
  async function apiGet(url) {
    try {
      const res = await fetch(url);
      return await res.json();
    } catch (e) { return null; }
  }

  // ---- Polling ----
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(pollState, 300);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function pollState() {
    if (!roomCode) return;
    const data = await apiGet('/api/pong/state?room=' + encodeURIComponent(roomCode));
    if (!data || data.error || data.destroyed) return;

    const status = data.room ? data.room.status : null;

    if (status === 'waiting') {
      updateLobbyPlayers(data);

      if (!createdRoom && myUserId && data.room.hostId) {
        isHost = String(data.room.hostId) === myUserId;
      }
      document.getElementById('startBtn').style.display = isHost ? '' : 'none';
      document.getElementById('hostBadge').textContent = isHost ? 'YOU ARE HOST' : 'Waiting for host...';

      // Auto-start removed — host clicks Start manually
    }

    // In-game update
    if (status === 'playing' || status === 'countdown') {
      gameState = data;
      if (currentScreen !== 'game') enterGame(data);
    }

    // Results
    if (status === 'finished') {
      gameState = data;
      if (currentScreen !== 'results') enterResults(data);
    }

    lastStateTime = Date.now();
  }

  function updateLobbyPlayers(data) {
    const container = document.getElementById('plRows');
    const players = data.players || [];
    const mode = data.room ? data.room.mode : 'teams';

      container.innerHTML = '<div style="padding:10px 14px;font-size:11px;color:rgba(var(--acc-main),0.45)">Waiting for players...</div>';
      return;
    }
    container.innerHTML = players.map((p, i) => {
      let sideLabel = p.side === 'left' ? 'L' : p.side === 'right' ? 'R' : p.side === 'top' ? 'T' : p.side === 'bottom' ? 'B' : '?';
      return '<div class="pl-row' + (p.username === playerUsername ? ' me' : '') + '">' +
      '<div class="ready-dot' + (p.ready ? ' on' : '') + '"></div>' +
      '<span class="pn">' + (p.username || 'anon') + '</span>' +
      '<span class="pr">' + sideLabel + '#' + (i + 1) + '</span>' +
      '</div>';
    }).join('');
  }

  // ---- Game State Polling ----
  let gamePollTimer = null;

      if (!roomCode || currentScreen !== 'game') { stopGamePoll(); return; }
      const data = await apiGet('/api/pong/state?room=' + encodeURIComponent(roomCode));

        stopGamePoll();

  function renderResults(data) {
    const winner = data.winnerName || data.winner || 'Unknown';

      html = sideLabel + ' Team Wins! (' + winner + ')';
    } else if (mode === 'teams' && data.winnerSide) {

    } else {
      html = winner + ' Wins!';
    }
    document.getElementById('resWinner').textContent = html;

    let sub = '';

      sub += ' &middot; ELO: <b>' + sign + data.eloChange + '</b>';

    // Report ELO + score locally

        method: 'POST',

        body: JSON.stringify({ points: data.points, game: 'pong' })
      }).catch(() => {});
    }
    if (roomCode && data.winner) {
      const playerIds = (data.players || []).map(p => p.userId).filter(Boolean);
      fetch('/api/pong/elo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: roomCode, winner_id: data.winner, players: playerIds })
      }).catch(() => {});

  // ---- Countdown ----
  function showCountdown(num) {
    countdownEl.textContent = num;
    countdownEl.classList.add('show');
    let n = num;
    const iv = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(iv);
        countdownEl.classList.remove('show');
      } else {
        countdownEl.textContent = n;
      }
    }, 1000);
  }

  // ---- roundRect polyfill ----
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === 'number') r = [r, r, r, r];
      else if (!Array.isArray(r)) r = [0, 0, 0, 0];
      const [tl, tr, br, bl] = r;
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + tr);
      this.lineTo(x + w, y + h - br);
      this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      this.lineTo(x + bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - bl);
      this.lineTo(x, y + tl);
      this.quadraticCurveTo(x, y, x + tl, y);
      this.closePath();
      return this;
    };
  }

  // ---- Canvas Resize ----
  function resizeCanvas() {
    if (!gameState) return;
    const pc = (gameState.players || []).length || 2;
    const isQuads = gameState.room && gameState.room.mode === 'quads';
    const w = isQuads ? 700 : Math.min(700, 640 + (pc - 2) * 80);
    const h = isQuads ? 700 : 480;
    canvas.width = w;
    canvas.height = h;
    canvas.style.aspectRatio = w + '/' + h;
  }

  // ---- Render Loop ----
  let renderRunning = false;
  function startRenderLoop() {
    if (renderRunning) return;
    renderRunning = true;
    requestAnimationFrame(renderFrame);
  }
  function stopRenderLoop() { renderRunning = false; }

  function renderFrame() {
    if (!renderRunning) return;
    if (!gameState || currentScreen !== 'game') { renderRunning = false; return; }
    drawGame(gameState);
    updateGameHud(gameState);
    requestAnimationFrame(renderFrame);
  }

  // ---- Draw Game ----
  function drawGame(state) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Dark background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid (batched)
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    const isQuads = state.room && state.room.mode === 'quads';

    // Center lines
    ctx.setLineDash([6, 10]);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    if (isQuads) {
      ctx.beginPath();
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Score display
    const players = state.players || [];
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.font = 'bold 120px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (isQuads) {
      // Show round scores per side
      const leftCount = players.filter(p => p.side === 'left' && p.alive).length;
      const rightCount = players.filter(p => p.side === 'right' && p.alive).length;
      const topCount = players.filter(p => p.side === 'top' && p.alive).length;
      const bottomCount = players.filter(p => p.side === 'bottom' && p.alive).length;
      ctx.font = 'bold 80px "IBM Plex Mono", monospace';
      ctx.fillText(topCount, W * 0.5, H * 0.2);
      ctx.fillText(bottomCount, W * 0.5, H * 0.8);
      ctx.fillText(leftCount, W * 0.2, H * 0.5);
      ctx.fillText(rightCount, W * 0.8, H * 0.5);
      // Round scores
      ctx.font = 'bold 28px "IBM Plex Mono", monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      const rn = state.room.roundNum || 0;
      if (rn > 0) ctx.fillText('+' + rn, W * 0.25, 24);
      if (rn < 0) ctx.fillText('+' + Math.abs(rn), W * 0.75, 24);
    } else {
      const leftAlive = players.filter(p => p.side === 'left' && p.alive).length;
      const rightAlive = players.filter(p => p.side === 'right' && p.alive).length;
      ctx.fillText(leftAlive, W * 0.25, H * 0.5);
      ctx.fillText(rightAlive, W * 0.75, H * 0.5);
    }

    // Side labels
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'top';
    if (isQuads) {
      ctx.textAlign = 'center';
      ctx.fillText('TOP', W * 0.5, 8);
      ctx.fillText('BOTTOM', W * 0.5, H - 18);
      ctx.textAlign = 'left';
      ctx.fillText('LEFT', 8, H * 0.5);
      ctx.textAlign = 'right';
      ctx.fillText('RIGHT', W - 8, H * 0.5);
    } else if (state.room && state.room.mode === 'teams') {
      ctx.fillText('LEFT', W * 0.25, 16);
      ctx.fillText('RIGHT', W * 0.75, 16);
    }

    // Paddles
    const aliveCount = players.filter(p => p.alive).length;
    const pw = Math.max(6, 12 - aliveCount);
    const ph = Math.max(50, 100 - aliveCount * 5);
    const isTeams = state.room && state.room.mode === 'teams';
    const TEAM_RED = '#ef4444';
    const TEAM_BLUE = '#3b82f6';

    function getTeam(side) {
      if (side === 'left' || side === 'top') return TEAM_RED;
      return TEAM_BLUE;
    }

    players.forEach((p) => {
      if (!p.alive) return;
      const color = p.color || '#aaa';
      const teamColor = getTeam(p.side);
      let px, py;

      if (p.side === 'left') { px = 16; py = (p.paddleY != null ? p.paddleY : 0.5) * H - ph / 2; }
      else if (p.side === 'right') { px = W - pw - 16; py = (p.paddleY != null ? p.paddleY : 0.5) * H - ph / 2; }
      else if (p.side === 'top') { py = 16; px = (p.paddleY != null ? p.paddleY : 0.5) * W - ph / 2; }
      else if (p.side === 'bottom') { py = H - pw - 16; px = (p.paddleY != null ? p.paddleY : 0.5) * W - ph / 2; }

      const isHorizontal = p.side === 'top' || p.side === 'bottom';
      const paddleW = isHorizontal ? ph : pw;
      const paddleH = isHorizontal ? pw : ph;

      // Paddle body — player's custom color
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(px, py, paddleW, paddleH, 3);
      ctx.fill();

      // Team accent — small bar on inner edge
      const accentW = isHorizontal ? paddleW : 3;
      const accentH = isHorizontal ? 3 : paddleH;
      let ax = px, ay = py;
      if (p.side === 'left') ax = px + paddleW - 3;
      else if (p.side === 'top') ay = py + paddleH - 3;
      ctx.fillStyle = teamColor;
      ctx.beginPath();
      ctx.roundRect(ax, ay, accentW, accentH, 1);
      ctx.fill();

      // Name
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = p.side === 'top' ? 'bottom' : p.side === 'bottom' ? 'top' : 'bottom';
      const nameX = px + paddleW / 2;
      const nameY = p.side === 'top' ? py - 4 : p.side === 'bottom' ? py + paddleH + 12 : py - 4;
      ctx.fillText(p.username || '', nameX, nameY);
    });

    // Dead paddles
    players.forEach((p) => {
      if (p.alive) return;
      let px, py;
      if (p.side === 'left') { px = 16; py = (p.paddleY != null ? p.paddleY : 0.5) * H - ph / 2; }
      else if (p.side === 'right') { px = W - pw - 16; py = (p.paddleY != null ? p.paddleY : 0.5) * H - ph / 2; }
      else if (p.side === 'top') { py = 16; px = (p.paddleY != null ? p.paddleY : 0.5) * W - ph / 2; }
      else if (p.side === 'bottom') { py = H - pw - 16; px = (p.paddleY != null ? p.paddleY : 0.5) * W - ph / 2; }
      const isHorizontal = p.side === 'top' || p.side === 'bottom';
      const paddleW = isHorizontal ? ph : pw;
      const paddleH = isHorizontal ? pw : ph;
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.beginPath();
      ctx.roundRect(px, py, paddleW, paddleH, 3);
      ctx.fill();
    });

    // Ball
    if (state.ball && (state.ball.vx !== 0 || state.ball.vy !== 0)) {
      const bx = (state.ball.x || 0.5) * W;
      const by = (state.ball.y || 0.5) * H;
      const bs = 8;

      ctx.save();
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bx, by, bs / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function updateGameHud(state) {
    const players = state.players || [];
    const hud = document.getElementById('gameHud');
    const aliveCount = players.filter(p => p.alive).length;
    let html = '<span class="stat">Room <b>' + (roomCode || '-') + '</b></span>';
    html += '<span class="stat">Players <b>' + aliveCount + '/' + players.length + '</b></span>';
    const mode = state.room && state.room.mode;
    html += '<span class="stat">' + (mode === 'quads' ? 'Quads' : 'Teams') + '</span>';
    if (state.room && state.room.roundsTarget) {
      html += '<span class="stat">Round <b>' + (state.room.roundNum || 0) + '</b> / ' + state.room.roundsTarget + '</span>';
    }
    hud.innerHTML = html;
  }

  // ---- Input Loop ----
  let inputRunning = false;
  let lastSentDir = 0;
  function startInputLoop() {
    if (inputRunning) return;
    inputRunning = true;
    sendInput();
  }
  function stopInputLoop() { inputRunning = false; }

  function sendInput() {
    if (!inputRunning || currentScreen !== 'game') { inputRunning = false; return; }

    let dir = 0;
    // Keyboard
    const w = keys['KeyW'] || keys['ArrowUp'];
    const s = keys['KeyS'] || keys['ArrowDown'];
    if (w && !s) dir = -1;
    else if (s && !w) dir = 1;

    // Touch override
    if (touchDir !== 0) dir = touchDir;

    // Mouse override — follow cursor Y position relative to paddle
    if (mouseActive && mouseY >= 0 && gameState) {
      const me = (gameState.players || []).find(p => myUserId && String(p.userId) === myUserId);
      if (me) {
        const paddleCenter = me.paddleY != null ? me.paddleY : 0.5;
        const diff = mouseY - paddleCenter;
        if (Math.abs(diff) > 0.03) dir = diff > 0 ? 1 : -1;
      }
    }

    if (roomCode && dir !== lastSentDir) {
      lastSentDir = dir;
      apiPost('/api/pong/move', { room: roomCode, dir });
    }

    setTimeout(sendInput, 33);
  }

  // ---- Resize handler ----
  window.addEventListener('resize', resizeCanvas);

  // ---- Context menu prevention ----
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- Boot ----
  showScreen('lobby');

  // Re-check auth on pageshow
  window.addEventListener('pageshow', () => {
    loadPlayer();
    loadPongColor();
  });
})();
</script>
</body>
</html>
