<script>
(() => {
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  // ---- Cursor FX ----
  const _curStyle = document.createElement('style');
  _curStyle.textContent = 'html * { cursor: url("assets/cursor-empty.cur") 0 0, none !important; }';
  document.head.appendChild(_curStyle);

  const cursorfx = document.getElementById('cursorfx');
  let realX = window.innerWidth / 2, realY = window.innerHeight / 2;
  let curX = realX, curY = realY;
  let cursorSpritesState = null;
  const TRAIL = 3;
  const trail = [], trailX = [], trailY = [];
  for (let i = 0; i < TRAIL; i++) {
    const t = document.createElement('div');
    t.style.cssText =
      'position:fixed;top:0;left:0;width:31px;height:40px;pointer-events:none;' +
      'z-index:99;will-change:transform;image-rendering:pixelated;' +
      'transform:translate3d(-100px,-100px,0);opacity:' + (0.3 - i * 0.08).toFixed(2) + ';' +
      'background-size:auto 30px;background-repeat:no-repeat;';
    document.body.appendChild(t);
    trail.push(t);
    trailX.push(realX);
    trailY.push(realY);
  }
  document.addEventListener('pointermove', (e) => {
    realX = e.clientX;
    realY = e.clientY;
  });
  document.addEventListener('mouseover', (e) => {
    const INTERACTIVE = 'a, button, input, select, textarea, label, summary, [role="button"], [contenteditable]';
    const t = e.target.closest ? e.target.closest(INTERACTIVE) : null;
    const over = !!t;
    cursorfx.className = over ? 'finger' : 'arrow';
  });
  function paintCursor() {
    const finger = cursorfx.className === 'finger';
    if (cursorSpritesState && cursorSpritesState.arrow) {
      const url = finger ? (cursorSpritesState.finger || cursorSpritesState.arrow) : cursorSpritesState.arrow;
      cursorfx.style.backgroundImage = 'url("' + url + '")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.filter = cursorSpritesState.border || '';
    } else {
      cursorfx.style.backgroundImage = finger ? 'url("assets/cursor-finger.png")' : 'url("assets/cursor-arrow.png")';
      cursorfx.style.backgroundRepeat = 'no-repeat';
      cursorfx.style.backgroundSize = 'auto 30px';
      cursorfx.style.filter = '';
    }
  }
  let _lastUrl = '', _lastFilt = '';
  function cursorTick() {
    if (window.matchMedia('(pointer: coarse)').matches) { requestAnimationFrame(cursorTick); return; }
    curX += (realX - curX) * 0.24;
    curY += (realY - curY) * 0.24;
    cursorfx.style.transform = 'translate3d(' + curX + 'px,' + curY + 'px,0)';
    paintCursor();
    const finger = cursorfx.className === 'finger';
    const url = cursorSpritesState && cursorSpritesState.arrow
      ? (finger ? (cursorSpritesState.finger || cursorSpritesState.arrow) : cursorSpritesState.arrow)
      : finger ? 'assets/cursor-finger.png' : 'assets/cursor-arrow.png';
    const filt = cursorSpritesState ? (cursorSpritesState.border || '') : '';
    const hotX = finger ? 8 : 1;
    cursorfx.style.transform = 'translate3d(' + (curX - hotX) + 'px,' + curY + 'px,0)';
    for (let i = TRAIL - 1; i > 0; i--) {
      trailX[i] += (trailX[i - 1] - trailX[i]) * 0.35;
      trailY[i] += (trailY[i - 1] - trailY[i]) * 0.35;
    }
    trailX[0] += (curX - trailX[0]) * 0.4;
    trailY[0] += (curY - trailY[0]) * 0.4;
    const urlChanged = url !== _lastUrl || filt !== _lastFilt;
    if (urlChanged) _lastUrl = url, _lastFilt = filt;
    for (let j = 0; j < TRAIL; j++) {
      if (urlChanged) {
        trail[j].style.backgroundImage = 'url("' + url + '")';
        trail[j].style.filter = filt;
      }
      trail[j].style.transform = 'translate3d(' + (trailX[j] - hotX) + 'px,' + trailY[j] + 'px,0)';
    }
    requestAnimationFrame(cursorTick);
  }

  // ---- roundRect polyfill ----
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === 'number') r = [r, r, r, r];
      else if (!Array.isArray(r)) r = [0, 0, 0, 0];
      const [tl, tr, br, bl] = r;
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + tr);
      this.lineTo(x + w, y + h - br);
      this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      this.lineTo(x + bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - bl);
      this.lineTo(x, y + tl);
      this.quadraticCurveTo(x, y, x + tl, y);
      this.closePath();
      return this;
    };
  }

  // ---- Canvas Resize ----
  let gridCanvas = null;
  function resizeCanvas() {
    if (!gameState) return;
    const pc = (gameState.players || []).length || 2;
    const isQuads = gameState.room && gameState.room.mode === 'quads';
    const w = isQuads ? 700 : Math.min(700, 640 + (pc - 2) * 80);
    const h = isQuads ? 700 : 480;
    const maxW = window.innerWidth * 0.95;
    const maxH = (window.innerHeight - 80) * 0.95;
    const scale = Math.min(maxW / w, maxH / h, 1);
    const cw = Math.floor(w * scale);
    const ch = Math.floor(h * scale);
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    gridCanvas = document.createElement('canvas');
    gridCanvas.width = cw;
    gridCanvas.height = ch;
    const gc = gridCanvas.getContext('2d');
    gc.fillStyle = '#0a0a0f';
    gc.fillRect(0, 0, cw, ch);
    gc.strokeStyle = 'rgba(255,255,255,0.02)';
    gc.lineWidth = 1;
    gc.beginPath();
    for (let x = 0; x < cw; x += 40) { gc.moveTo(x, 0); gc.lineTo(x, ch); }
    for (let y = 0; y < ch; y += 40) { gc.moveTo(0, y); gc.lineTo(cw, y); }
    gc.stroke();
    gc.strokeStyle = 'rgba(255,255,255,0.08)';
    gc.lineWidth = 2;
    gc.setLineDash([6, 10]);
    gc.beginPath();
    gc.moveTo(cw / 2, 0);
    gc.lineTo(cw / 2, ch);
    gc.stroke();
    if (isQuads) {
      gc.beginPath();
      gc.moveTo(0, ch / 2);
      gc.lineTo(cw, ch / 2);
      gc.stroke();
    }
    gc.setLineDash([]);
  }

  // ---- Client-side physics state ----
  const PADDLE_HALF = 0.12;
  const PADDLE_SPEED = 0.045;
  let localBall = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
  let localPaddles = {};

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function syncFromServer(data, syncBall) {
    if (!data) return;
    if (syncBall) {
      const serverBall = data.ball || {};
      localBall = { x: serverBall.x || 0.5, y: serverBall.y || 0.5, vx: serverBall.vx || 0, vy: serverBall.vy || 0 };
    }
    const players = data.players || [];
    for (const p of players) {
      if (!localPaddles[p.side]) localPaddles[p.side] = { y: 0.5, alive: true };
      localPaddles[p.side].alive = p.alive;
    }
  }

  function runPhysics(dt) {
    if (!gameState || !gameState.room || gameState.room.status !== 'playing') return;
    dt = Math.min(dt, 0.05);

    const players = gameState.players || [];

    for (const p of players) {
      if (!p.alive) continue;
      if (!localPaddles[p.side]) localPaddles[p.side] = { y: 0.5, alive: true };
      const pad = localPaddles[p.side];
      const d = p.dir || 0;
      pad.y = clamp(pad.y + d * PADDLE_SPEED * dt * 60, PADDLE_HALF, 1 - PADDLE_HALF);
    }
  }

  // ---- Render Loop (integrated with physics) ----
  let renderRunning = false;
  let lastPhysicsTime = 0;
  function startRenderLoop() {
    if (renderRunning) return;
    renderRunning = true;
    lastPhysicsTime = Date.now();
    localPaddles = {};
    syncFromServer(gameState, true);
    requestAnimationFrame(renderFrame);
  }
  function stopRenderLoop() { renderRunning = false; }

  function renderFrame() {
    if (!renderRunning) return;
    if (!gameState || currentScreen !== 'game') { renderRunning = false; return; }
    const now = Date.now();
    const dt = (now - lastPhysicsTime) / 1000;
    lastPhysicsTime = now;
    runPhysics(dt);
    drawGame(gameState);
    updateGameHud(gameState);
    requestAnimationFrame(renderFrame);
  }

  // ---- Draw Game ----
  function drawGame(state) {
    const W = canvas.width;
    const H = canvas.height;

    if (gridCanvas) {
      ctx.drawImage(gridCanvas, 0, 0);
    } else {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, W, H);
    }

    const isQuads = state.room && state.room.mode === 'quads';

    // Score display
    const players = state.players || [];
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.font = 'bold 120px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const room = state.room || {};
    const leftScore = room.leftScore || 0;
    const rightScore = room.rightScore || 0;
    const topScore = room.topScore || 0;
    const bottomScore = room.bottomScore || 0;
    const roundsTarget = room.roundsTarget || 3;

    if (isQuads) {
      ctx.font = 'bold 60px "IBM Plex Mono", monospace';
      ctx.fillText(topScore, W * 0.5, H * 0.2);
      ctx.fillText(bottomScore, W * 0.5, H * 0.8);
      ctx.fillText(leftScore, W * 0.2, H * 0.5);
      ctx.fillText(rightScore, W * 0.8, H * 0.5);
    } else {
      ctx.fillText(leftScore, W * 0.25, H * 0.5);
      ctx.fillText(rightScore, W * 0.75, H * 0.5);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.font = '14px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('First to ' + roundsTarget, W / 2, H * 0.5);

    // Side labels
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'top';
    if (isQuads) {
      ctx.textAlign = 'center';
      ctx.fillText('TOP', W * 0.5, 8);
      ctx.fillText('BOTTOM', W * 0.5, H - 18);
      ctx.textAlign = 'left';
      ctx.fillText('LEFT', 8, H * 0.5);
      ctx.textAlign = 'right';
      ctx.fillText('RIGHT', W - 8, H * 0.5);
    } else if (state.room && state.room.mode === 'teams') {
      ctx.fillText('LEFT', W * 0.25, 16);
      ctx.fillText('RIGHT', W * 0.75, 16);
    }

    // Paddles
    const aliveCount = players.filter(p => p.alive).length;
    const pw = Math.max(6, 12 - aliveCount);
    const ph = Math.max(50, 100 - aliveCount * 5);
    const isTeams = state.room && state.room.mode === 'teams';
    const TEAM_RED = '#ef4444';
    const TEAM_BLUE = '#3b82f6';

    function getTeam(side) {
      if (side === 'left' || side === 'top') return TEAM_RED;
      return TEAM_BLUE;
    }

    players.forEach((p) => {
      if (!p.alive) return;
      const color = p.color || '#aaa';
      const teamColor = getTeam(p.side);
      let px, py;

      const isHorizontal = p.side === 'top' || p.side === 'bottom';
      const paddleW = isHorizontal ? ph : pw;
      const paddleH = isHorizontal ? pw : ph;
      const localY = localPaddles[p.side] ? localPaddles[p.side].y : 0.5;

      // Paddle body — team color fill
      ctx.fillStyle = teamColor;
      ctx.beginPath();
      if (p.side === 'left') { px = 16; py = localY * H - paddleH / 2; }
      else if (p.side === 'right') { px = W - pw - 16; py = localY * H - paddleH / 2; }
      else if (p.side === 'top') { py = 16; px = localY * W - paddleW / 2; }
      else if (p.side === 'bottom') { py = H - pw - 16; px = localY * W - paddleW / 2; }
      ctx.roundRect(px, py, paddleW, paddleH, 3);
      ctx.fill();

      // Border — original paddle color, thick
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(px + 1.5, py + 1.5, paddleW - 3, paddleH - 3, 2);
      ctx.stroke();

      // Name
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = p.side === 'top' ? 'bottom' : p.side === 'bottom' ? 'top' : 'bottom';
      const nameX = px + paddleW / 2;
      const nameY = p.side === 'top' ? py - 4 : p.side === 'bottom' ? py + paddleH + 12 : py - 4;
      ctx.fillText(p.username || '', nameX, nameY);
    });

    // Dead paddles
    players.forEach((p) => {
      if (p.alive) return;
      let px, py;
      const localY = localPaddles[p.side] ? localPaddles[p.side].y : 0.5;
      if (p.side === 'left') { px = 16; py = localY * H - ph / 2; }
      else if (p.side === 'right') { px = W - pw - 16; py = localY * H - ph / 2; }
      else if (p.side === 'top') { py = 16; px = localY * W - ph / 2; }
      else if (p.side === 'bottom') { py = H - pw - 16; px = localY * W - ph / 2; }
      const isHorizontal = p.side === 'top' || p.side === 'bottom';
      const paddleW = isHorizontal ? ph : pw;
      const paddleH = isHorizontal ? pw : ph;
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.beginPath();
      ctx.roundRect(px, py, paddleW, paddleH, 3);
      ctx.fill();
    });

    // Ball
    const bx = localBall.x * W;
    const by = localBall.y * H;
    const bs = 8;

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bx, by, bs / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  let _lastHudHtml = '';
  function updateGameHud(state) {
    const players = state.players || [];
    const hud = document.getElementById('gameHud');
    const aliveCount = players.filter(p => p.alive).length;
    const mode = state.room && state.room.mode;
    const room = state.room || {};
    let html = '<span class="stat">Room <b>' + (roomCode || '-') + '</b></span>';
    html += '<span class="stat">Players <b>' + aliveCount + '/' + players.length + '</b></span>';
    html += '<span class="stat">' + (mode === 'quads' ? 'Quads' : 'Teams') + '</span>';
    if (room.leftScore != null && room.rightScore != null) {
      const top = room.topScore || 0;
      const bottom = room.bottomScore || 0;
      if (mode === 'quads') {
        html += '<span class="stat">T <b>' + top + '</b></span>';
        html += '<span class="stat">B <b>' + bottom + '</b></span>';
      }
      html += '<span class="stat">L <b>' + room.leftScore + '</b></span>';
      html += '<span class="stat">R <b>' + room.rightScore + '</b></span>';
      html += '<span class="stat">to <b>' + (room.roundsTarget || 3) + '</b></span>';
    }
    if (html !== _lastHudHtml) { _lastHudHtml = html; hud.innerHTML = html; }
  }

  // ---- Input: compute current dir from keys/touch/mouse ----
  function getCurrentDir() {
    let dir = 0;
    const w = keys['KeyW'] || keys['ArrowUp'];
    const s = keys['KeyS'] || keys['ArrowDown'];
    if (w && !s) dir = -1;
    else if (s && !w) dir = 1;
    if (touchDir !== 0) dir = touchDir;
    if (mouseActive && mouseY >= 0 && gameState) {
      const me = (gameState.players || []).find(p => myUserId && String(p.userId) === myUserId);
      if (me && localPaddles[me.side]) {
        const paddleCenter = localPaddles[me.side].y;
        const diff = mouseY - paddleCenter;
        if (Math.abs(diff) > 0.03) dir = diff > 0 ? 1 : -1;
      }
    }
    return dir;
  }

  // ---- Game State Polling (POST with dir) ----
  let gamePollTimer = null;

  function startGamePoll() {
    stopGamePoll();
    gamePollTimer = setInterval(async () => {
      if (!roomCode || currentScreen !== 'game') { stopGamePoll(); return; }
      const dir = getCurrentDir();
      const data = await apiPost('/api/pong/state', { room: roomCode, dir });
      if (!data || data.error) return;
      gameState = data;
      syncFromServer(data, true);
      if (data.room && (data.room.status === 'finished' || data.room.status === 'waiting')) {
        stopGamePoll();
        if (data.room.status === 'finished') enterResults(data);
      }
    }, 33);
  }
  function stopGamePoll() { if (gamePollTimer) { clearInterval(gamePollTimer); gamePollTimer = null; } }

  // ---- Resize handler ----
  window.addEventListener('resize', resizeCanvas);

  // ---- Context menu prevention ----
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- Boot ----
  showScreen('lobby');

  // Re-check auth on pageshow
  window.addEventListener('pageshow', () => {
    loadPlayer();
    loadPongColor();
  });
})();
</script>
