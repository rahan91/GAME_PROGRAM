<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1c1c1c;
    color: #e0e0e0;
    font-family: 'Space Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb--1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%);
    top: 0%; left: 5%;
  }
  .orb--2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%);
    bottom: 0%; right: 0%;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.03); }
  }

  .back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(140,180,150,0.6); text-decoration: none;
    font-size: 14px; transition: color 0.2s;
  }
  .back:hover { color: rgba(140,180,150,1); }

  h1 {
    margin-bottom: 16px;
    font-family: 'Space Mono', 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(140,180,150,0.85);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls label {
    font-size: 14px;
    color: #8a9a8a;
  }

  .controls input {
    width: 70px;
    padding: 6px 10px;
    border: 1px solid rgba(140,180,150,0.2);
    border-radius: 6px;
    background: rgba(80,100,90,0.15);
    color: #e0e0e0;
    font-size: 14px;
    text-align: center;
  }

  .controls input:focus {
    outline: none;
    border-color: rgba(140,180,150,0.5);
  }

  #generateBtn {
    padding: 8px 24px;
    border: none;
    border-radius: 6px;
    background: rgba(140,180,150,0.3);
    color: #e0e0e0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #generateBtn:hover { background: rgba(140,180,150,0.45); }

  #solveBtn {
    padding: 8px 24px;
    border: none;
    border-radius: 6px;
    background: rgba(100,180,120,0.3);
    color: #e0e0e0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #solveBtn:hover { background: rgba(100,180,120,0.45); }

  #difficultySelect {
    position: relative;
    width: 120px;
    cursor: pointer;
  }

  .select-trigger {
    padding: 6px 10px;
    border: 1px solid rgba(140,180,150,0.2);
    border-radius: 6px;
    background: #0d0d0d;
    color: #e0e0e0;
    font-size: 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
    user-select: none;
  }

  .select-options {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #0d0d0d;
    border: 1px solid rgba(140,180,150,0.15);
    border-radius: 6px;
    overflow: hidden;
    display: none;
    z-index: 20;
  }

  .custom-select.open .select-options {
    display: block;
  }

  .select-option {
    padding: 6px 10px;
    color: #e0e0e0;
    font-size: 14px;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }

  .select-option:hover {
    background: rgba(255,255,255,0.06);
    color: var(--glow-color, #e0e0e0);
    text-shadow: var(--glow-shadow, none);
  }

  .select-option.selected {
    color: #fff;
  }

  #status {
    font-size: 14px;
    color: #6a7a6a;
    margin-bottom: 12px;
    min-height: 20px;
  }

  canvas {
    border: 2px solid rgba(140,180,150,0.2);
    border-radius: 8px;
    cursor: default;
  }

  .hint {
    margin-top: 14px;
    font-size: 13px;
    color: #4a5a4a;
  }

  #scoreboard {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #scoreboard label {
    font-size: 14px;
    color: #8a9a8a;
  }

  #playerName {
    padding: 6px 10px;
    border: 1px solid rgba(140,180,150,0.2);
    border-radius: 6px;
    background: rgba(80,100,90,0.15);
    color: rgba(140,180,150,0.95);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }

  #scoreDisplay {
    font-size: 18px;
    font-weight: 600;
    color: rgba(140,180,150,0.85);
  }

  #resetScoreBtn {
    padding: 5px 14px;
    border: 1px solid rgba(140,180,150,0.2);
    border-radius: 6px;
    background: transparent;
    color: rgba(200,140,160,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  #resetScoreBtn:hover {
    background: rgba(200,140,160,0.08);
    border-color: rgba(200,140,160,0.5);
  }
</style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
</head>
<body>

<a class="back" href="index.html">&larr; Gallery</a>

<h1>Maze</h1>

<div id="scoreboard">
  <label for="playerName">Player</label>
  <span id="playerName" title="Logged-in user">anonymous</span>
  <span id="scoreDisplay">Score: 0</span>
  <button id="resetScoreBtn">Reset Score</button>
</div>

<div class="controls">
  <label for="widthInput">Width</label>
  <input type="number" id="widthInput" value="20" min="5" max="80">
  <label for="heightInput">Height</label>
  <input type="number" id="heightInput" value="20" min="5" max="80">
  <label for="difficultySelect">Difficulty</label>
  <div class="custom-select" id="difficultySelect">
    <div class="select-trigger">Medium</div>
    <div class="select-options">
      <div class="select-option" data-value="very easy">Very Easy</div>
      <div class="select-option" data-value="easy">Easy</div>
      <div class="select-option selected" data-value="medium">Medium</div>
      <div class="select-option" data-value="hard">Hard</div>
      <div class="select-option" data-value="very hard">Very Hard</div>
      <div class="select-option" data-value="insane">Insane</div>
      <div class="select-option" data-value="extreme">Extreme</div>
    </div>
  </div>
  <button id="generateBtn">Generate</button>
  <button id="solveBtn">Solve with AI</button>
</div>

<div id="status"></div>
<canvas id="mazeCanvas"></canvas>
<div class="hint">Arrow keys or WASD to move &middot; Click "Generate" for a new maze</div>

<script>
(() => {
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const generateBtn = document.getElementById('generateBtn');
  const statusEl = document.getElementById('status');
  const nameInput = document.getElementById('playerName');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const difficultySelect = document.getElementById('difficultySelect');
  const selectTrigger = difficultySelect.querySelector('.select-trigger');
  const selectOptions = difficultySelect.querySelectorAll('.select-option');

  let cols, rows, cellSize, grid, player, won, moves, trail, startTime, wallsLayer, trailLayer, trailCtx;
  const PADDING = 2;
  const STORAGE_KEY = 'mazeGameScores';
  let selectedDifficulty = 'medium';

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  const DIFFICULTIES = {
    'very easy': { mult: 1.0, candidates: 8, bias: 0.75, braid: 0.95, target: 'easy' },
    'easy':      { mult: 1.5, candidates: 10, bias: 0.55, braid: 0.65, target: 'easy' },
    'medium':    { mult: 2.5, candidates: 14, bias: 0.30, braid: 0.25, target: 'hard' },
    'hard':      { mult: 4.0, candidates: 18, bias: 0.12, braid: 0.05, target: 'hard' },
    'very hard': { mult: 5.5, candidates: 22, bias: 0.04, braid: 0.00, target: 'hard' },
    'insane':    { mult: 7.5, candidates: 28, bias: 0.01, braid: 0.00, target: 'hard' },
    'extreme':   { mult: 10.0, candidates: 35, bias: 0.00, braid: 0.00, target: 'extreme' }
  };

  function currentDifficulty() {
    return DIFFICULTIES[selectedDifficulty] || DIFFICULTIES['medium'];
  }

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveScores(scores) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }

  function currentPlayer() {
    return nameInput.textContent.trim() || 'anonymous';
  }

  function refreshScoreDisplay() {
    const scores = loadScores();
    scoreDisplay.textContent = 'Score: ' + (scores[currentPlayer()]?.total ?? 0);
  }

  function addScore(points) {
    const scores = loadScores();
    const name = currentPlayer();
    if (!scores[name]) scores[name] = { total: 0, plays: 0 };
    scores[name].total += points;
    scores[name].plays += 1;
    saveScores(scores);
    refreshScoreDisplay();
  }

  function shortestPathLength() {
    const idx = (x, y) => x + y * cols;
    const dist = new Array(cols * rows).fill(-1);
    dist[0] = 0;
    const queue = [grid[0]];
    while (queue.length) {
      const cell = queue.shift();
      if (cell.x === cols - 1 && cell.y === rows - 1) return dist[idx(cell.x, cell.y)];
      const neighbors = [];
      if (!cell.walls.top) neighbors.push(grid[idx(cell.x, cell.y - 1)]);
      if (!cell.walls.right) neighbors.push(grid[idx(cell.x + 1, cell.y)]);
      if (!cell.walls.bottom) neighbors.push(grid[idx(cell.x, cell.y + 1)]);
      if (!cell.walls.left) neighbors.push(grid[idx(cell.x - 1, cell.y)]);
      for (const n of neighbors) {
        const d = idx(n.x, n.y);
        if (dist[d] === -1) { dist[d] = dist[idx(cell.x, cell.y)] + 1; queue.push(n); }
      }
    }
    return moves;
  }

  function roundedSquarePath(cx, cy, size, r) {
    const x = cx - size / 2, y = cy - size / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + size - r, y);
    ctx.quadraticCurveTo(x + size, y, x + size, y + r);
    ctx.lineTo(x + size, y + size - r);
    ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
    ctx.lineTo(x + r, y + size);
    ctx.quadraticCurveTo(x, y + size, x, y + size - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function carveMaze(c, r, bias) {
    const g = [];
    for (let y = 0; y < r; y++)
      for (let x = 0; x < c; x++)
        g.push({ x, y, walls: { top: true, right: true, bottom: true, left: true }, visited: false });
    const idx = (x, y) => x + y * c;
    const stack = [];
    let current = g[0];
    current.visited = true;
    let lastDir = null;
    do {
      const { x, y } = current;
      const dirs = [];
      if (y > 0 && !g[idx(x, y - 1)].visited) dirs.push([0, -1]);
      if (x < c - 1 && !g[idx(x + 1, y)].visited) dirs.push([1, 0]);
      if (y < r - 1 && !g[idx(x, y + 1)].visited) dirs.push([0, 1]);
      if (x > 0 && !g[idx(x - 1, y)].visited) dirs.push([-1, 0]);
      if (dirs.length) {
        let dir;
        const straight = lastDir && dirs.find(d => d[0] === lastDir[0] && d[1] === lastDir[1]);
        if (straight && Math.random() < bias) { dir = straight; }
        else { dir = dirs[Math.floor(Math.random() * dirs.length)]; }
        const next = g[idx(x + dir[0], y + dir[1])];
        stack.push(current);
        if (dir[0] === 1) { current.walls.right = false; next.walls.left = false; }
        if (dir[0] === -1) { current.walls.left = false; next.walls.right = false; }
        if (dir[1] === 1) { current.walls.bottom = false; next.walls.top = false; }
        if (dir[1] === -1) { current.walls.top = false; next.walls.bottom = false; }
        lastDir = dir;
        next.visited = true;
        current = next;
      } else if (stack.length) { current = stack.pop(); lastDir = null; }
    } while (stack.length);
    return g;
  }

  function braidMaze(g, c, r, braid) {
    const idx = (x, y) => x + y * c;
    for (const cell of g) {
      const closed = ['top', 'right', 'bottom', 'left'].filter(w => cell.walls[w]);
      if (closed.length !== 3 || Math.random() >= braid) continue;
      const options = closed.filter(w => {
        if (w === 'top' && cell.y === 0) return false;
        if (w === 'bottom' && cell.y === r - 1) return false;
        if (w === 'left' && cell.x === 0) return false;
        if (w === 'right' && cell.x === c - 1) return false;
        return true;
      });
      if (!options.length) continue;
      const w = options[Math.floor(Math.random() * options.length)];
      const n = g[idx(cell.x + (w === 'right' ? 1 : w === 'left' ? -1 : 0), cell.y + (w === 'bottom' ? 1 : w === 'top' ? -1 : 0))];
      cell.walls[w] = false;
      n.walls[{ top: 'bottom', bottom: 'top', left: 'right', right: 'left' }[w]] = false;
    }
  }

  function solutionLength(g, c, r) {
    const idx = (x, y) => x + y * c;
    const dist = new Array(c * r).fill(-1);
    dist[0] = 0;
    const queue = [g[0]];
    while (queue.length) {
      const cell = queue.shift();
      if (cell.x === c - 1 && cell.y === r - 1) return dist[idx(cell.x, cell.y)];
      const neighbors = [];
      if (!cell.walls.top) neighbors.push(g[idx(cell.x, cell.y - 1)]);
      if (!cell.walls.right) neighbors.push(g[idx(cell.x + 1, cell.y)]);
      if (!cell.walls.bottom) neighbors.push(g[idx(cell.x, cell.y + 1)]);
      if (!cell.walls.left) neighbors.push(g[idx(cell.x - 1, cell.y)]);
      for (const n of neighbors) {
        const d = idx(n.x, n.y);
        if (dist[d] === -1) { dist[d] = dist[idx(cell.x, cell.y)] + 1; queue.push(n); }
      }
    }
    return -1;
  }

  function openDegree(cell) {
    return (cell.walls.top ? 0 : 1) + (cell.walls.right ? 0 : 1) +
           (cell.walls.bottom ? 0 : 1) + (cell.walls.left ? 0 : 1);
  }

  function hardnessScore(g, c, r, solLen) {
    const idx = (x, y) => x + y * c;
    let deadEnds = 0, deadEndDepth = 0, junctions = 0;
    for (const cell of g) {
      const degree = openDegree(cell);
      if (degree === 1) {
        deadEnds++;
        let depth = 0, cur = cell, from = null;
        while (depth < 20) {
          const nbrs = [];
          if (!cur.walls.top && cur.y > 0) nbrs.push(g[idx(cur.x, cur.y - 1)]);
          if (!cur.walls.right && cur.x < c - 1) nbrs.push(g[idx(cur.x + 1, cur.y)]);
          if (!cur.walls.bottom && cur.y < r - 1) nbrs.push(g[idx(cur.x, cur.y + 1)]);
          if (!cur.walls.left && cur.x > 0) nbrs.push(g[idx(cur.x - 1, cur.y)]);
          const next = nbrs.find(n => n !== from);
          if (!next || openDegree(next) !== 2) break;
          from = cur; cur = next; depth++;
        }
        deadEndDepth += depth;
      }
      if (degree >= 3) junctions++;
    }
    const cells = c * r;
    return (
      (solLen / Math.max(1, cells)) * 100 +
      (deadEnds / cells) * 250 +
      (deadEndDepth / cells) * 180 +
      (junctions / cells) * 300
    );
  }

  function generateMaze(c, r) {
    stopAI();
    cols = c; rows = r;
    const maxSize = 700;
    cellSize = Math.floor((maxSize - PADDING * 2) / Math.max(cols, rows));
    cellSize = Math.max(cellSize, 6);
    canvas.width = cols * cellSize + PADDING * 2;
    canvas.height = rows * cellSize + PADDING * 2;

    const diff = currentDifficulty();
    let bestMaze = null;
    let bestScore = diff.target === 'easy' ? Infinity : -Infinity;
    for (let i = 0; i < diff.candidates; i++) {
      const candidate = carveMaze(c, r, diff.bias);
      braidMaze(candidate, c, r, diff.braid);
      const pathLength = solutionLength(candidate, c, r);
      const score = hardnessScore(candidate, c, r, pathLength);
      if (diff.target === 'easy') { if (score < bestScore) { bestScore = score; bestMaze = candidate; } }
      else { if (score > bestScore) { bestScore = score; bestMaze = candidate; } }
    }
    grid = bestMaze;

    player = { x: 0, y: 0 };
    won = false; moves = 0;
    trail = [{ x: 0, y: 0 }];
    startTime = performance.now();
    statusEl.textContent = 'Moves: 0';
    renderWallsLayer();
    initTrailLayer();
    draw();
  }

  function renderWallsLayer() {
    wallsLayer = document.createElement('canvas');
    wallsLayer.width = canvas.width;
    wallsLayer.height = canvas.height;
    const wctx = wallsLayer.getContext('2d');
    wctx.fillStyle = '#1c1c1c';
    wctx.fillRect(0, 0, wallsLayer.width, wallsLayer.height);
    wctx.translate(PADDING, PADDING);

    const wall = (x1, y1, x2, y2) => {
      wctx.beginPath();
      wctx.moveTo(x1, y1);
      wctx.lineTo(x2, y2);
      wctx.stroke();
    };

    wctx.strokeStyle = 'rgba(140,180,150,0.6)';
    wctx.lineWidth = 2;
    wctx.lineCap = 'butt';
    wctx.lineJoin = 'miter';
    for (const cell of grid) {
      const cx = cell.x * cellSize, cy = cell.y * cellSize;
      if (cell.walls.top) wall(cx, cy, cx + cellSize, cy);
      if (cell.walls.right) wall(cx + cellSize, cy, cx + cellSize, cy + cellSize);
      if (cell.walls.bottom) wall(cx, cy + cellSize, cx + cellSize, cy + cellSize);
      if (cell.walls.left) wall(cx, cy, cx, cy + cellSize);
    }

    wctx.strokeStyle = 'rgba(140,180,150,0.9)';
    wctx.lineWidth = 3;
    wctx.strokeRect(0, 0, cols * cellSize, rows * cellSize);
  }

  function draw() {
    ctx.globalAlpha = 1;
    ctx.drawImage(wallsLayer, 0, 0);
    if (trailLayer) ctx.globalAlpha = 0.3;
    if (trailLayer) ctx.drawImage(trailLayer, 0, 0);
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(PADDING, PADDING);

    const sr = cellSize * 0.5;
    ctx.fillStyle = 'rgba(100,180,120,0.8)';
    roundedSquarePath(cellSize / 2, cellSize / 2, sr, sr * 0.3);
    ctx.fill();

    const ex = (cols - 1) * cellSize + cellSize / 2;
    const ey = (rows - 1) * cellSize + cellSize / 2;
    ctx.fillStyle = 'rgba(200,140,160,0.8)';
    roundedSquarePath(ex, ey, sr, sr * 0.3);
    ctx.fill();

    if (!won) {
      const size = cellSize * 0.52;
      ctx.fillStyle = 'rgba(180,200,140,0.9)';
      ctx.shadowColor = 'rgba(180,200,140,0.5)';
      ctx.shadowBlur = 4;
      roundedSquarePath(player.x * cellSize + cellSize / 2, player.y * cellSize + cellSize / 2, size, size * 0.3);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  function initTrailLayer() {
    trailLayer = document.createElement('canvas');
    trailLayer.width = canvas.width;
    trailLayer.height = canvas.height;
    trailCtx = trailLayer.getContext('2d');
    trailCtx.translate(PADDING, PADDING);
    trailCtx.strokeStyle = 'rgba(140,180,150,1)';
    trailCtx.lineWidth = Math.min(Math.max(cellSize * 0.25, 2), 5);
    trailCtx.lineCap = 'round';
    trailCtx.lineJoin = 'round';
  }

  function appendTrailSegment(prevX, prevY, x, y) {
    trailCtx.beginPath();
    trailCtx.moveTo(prevX * cellSize + cellSize / 2, prevY * cellSize + cellSize / 2);
    trailCtx.lineTo(x * cellSize + cellSize / 2, y * cellSize + cellSize / 2);
    trailCtx.stroke();
  }

  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  function move(dx, dy) {
    if (won) return;
    const px = player.x, py = player.y;
    const cell = grid[px + py * cols];
    if (dx === 0 && dy === -1 && cell.walls.top) return;
    if (dx === 1 && dy === 0 && cell.walls.right) return;
    if (dx === 0 && dy === 1 && cell.walls.bottom) return;
    if (dx === -1 && dy === 0 && cell.walls.left) return;
    const nx = px + dx, ny = py + dy;
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return;

    player.x = nx; player.y = ny;
    trail.push({ x: nx, y: ny });
    if (trail.length > 1) {
      const prev = trail[trail.length - 2];
      appendTrailSegment(prev.x, prev.y, nx, ny);
    }
    moves++;
    statusEl.textContent = 'Moves: ' + moves;
    draw();
    if (nx === cols - 1 && ny === rows - 1) {
      finishRun();
      draw();
    }
  }

  function finishRun() {
    won = true;
    const aiWasSolving = aiTimer !== null;
    stopAI();
    if (aiWasSolving) {
      const aiElapsed = (performance.now() - aiStartTime) / 1000;
      const optimal = shortestPathLength();
      const accuracy = Math.min(optimal / Math.max(moves, 1), 1);
      addScore(1);
      statusEl.textContent = 'AI solved it in ' + moves + ' moves! +1 pt (' +
        Math.round(accuracy * 100) + '% accuracy, ' + aiElapsed.toFixed(2) + 's)';
      return;
    }
    const elapsed = Math.max((performance.now() - startTime) / 1000, 0.01);
    const optimal = shortestPathLength();
    const efficiency = Math.min(optimal / Math.max(moves, 1), 1);
    const mazeSize = cols * rows;
    const sizeFactor = Math.min(1, Math.sqrt(mazeSize / 400));
    const difficultyMultiplier = 1 + (currentDifficulty().mult - 1) * sizeFactor * sizeFactor;
    const efficiencyMultiplier = 0.5 + efficiency * 0.5;
    const timeMultiplier = 1 + 1 / Math.sqrt(Math.max(elapsed, 1)) * 0.5;
    const baseScore = 250;
    const points = Math.max(10, Math.round(baseScore * difficultyMultiplier * sizeFactor * efficiencyMultiplier * timeMultiplier));
    addScore(points);
    statusEl.textContent = 'You escaped in ' + moves + ' moves! +' + points +
      ' pts (' + Math.round(efficiency * 100) + '% efficiency, ' + elapsed.toFixed(1) + 's)';
  }

  const KEY_TO_DIR = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  const heldKeys = [];
  const INITIAL_DELAY = 200, REPEAT_INTERVAL = 50;
  let nextMoveTime = 0;
  function pushHeld(key) { const i = heldKeys.indexOf(key); if (i !== -1) heldKeys.splice(i, 1); heldKeys.push(key); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || aiTimer) return;
    if (!KEY_TO_DIR[e.key]) return;
    e.preventDefault();
    if (!heldKeys.includes(e.key)) {
      pushHeld(e.key);
      move(...KEY_TO_DIR[e.key]);
      nextMoveTime = performance.now() + INITIAL_DELAY;
    }
  });
  document.addEventListener('keyup', (e) => { const i = heldKeys.indexOf(e.key); if (i !== -1) heldKeys.splice(i, 1); });
  window.addEventListener('blur', () => { heldKeys.length = 0; });
  setInterval(() => {
    const key = heldKeys[heldKeys.length - 1];
    if (!key || aiTimer) return;
    const now = performance.now();
    if (now >= nextMoveTime) { move(...KEY_TO_DIR[key]); nextMoveTime = now + REPEAT_INTERVAL; }
  }, 15);

  let aiTimer = null, aiStartTime = 0;
  function stopAI() { if (aiTimer) { clearInterval(aiTimer); aiTimer = null; } }

  function bfsPath(sx, sy) {
    const idx = (x, y) => x + y * cols;
    const prev = new Array(cols * rows).fill(-1);
    const seen = new Array(cols * rows).fill(false);
    seen[idx(sx, sy)] = true;
    const queue = [[sx, sy]];
    let end = null;
    while (queue.length && !end) {
      const [x, y] = queue.shift();
      if (x === cols - 1 && y === rows - 1) { end = idx(x, y); break; }
      const cell = grid[idx(x, y)];
      const opts = [];
      if (!cell.walls.top) opts.push([0, -1]);
      if (!cell.walls.right) opts.push([1, 0]);
      if (!cell.walls.bottom) opts.push([0, 1]);
      if (!cell.walls.left) opts.push([-1, 0]);
      for (const [dx, dy] of opts) {
        const nx = x + dx, ny = y + dy;
        if (!seen[idx(nx, ny)]) { seen[idx(nx, ny)] = true; prev[idx(nx, ny)] = idx(x, y); queue.push([nx, ny]); }
      }
    }
    const steps = [];
    let cur = end;
    while (cur !== -1 && cur !== idx(sx, sy)) {
      steps.unshift([cur % cols - prev[cur] % cols, Math.floor(cur / cols) - Math.floor(prev[cur] / cols)]);
      cur = prev[cur];
    }
    return steps;
  }

  const solveBtn = document.getElementById('solveBtn');
  solveBtn.addEventListener('click', () => {
    if (won || aiTimer) return;
    const path = bfsPath(player.x, player.y);
    if (!path || !path.length) { statusEl.textContent = 'Already at the exit!'; return; }
    aiStartTime = performance.now();
    let i = 0;
    const total = path.length;
    const MAX_STEPS_PER_FRAME = 300;
    const stepsPerFrame = Math.max(1, Math.min(MAX_STEPS_PER_FRAME, Math.ceil(total / ((80 / 16.7) || 1))));
    aiTimer = setInterval(() => {
      if (won) { stopAI(); return; }
      for (let k = 0; k < stepsPerFrame; k++) {
        if (i >= total) { stopAI(); break; }
        const [dx, dy] = path[i++];
        const px = player.x, py = player.y;
        player.x += dx; player.y += dy;
        trail.push({ x: player.x, y: player.y });
        appendTrailSegment(px, py, player.x, player.y);
        moves++;
        if (player.x === cols - 1 && player.y === rows - 1) {
          won = true;
          finishRun();
          draw();
          return;
        }
      }
      draw();
    }, 16);
  });

  generateBtn.addEventListener('click', () => {
    const w = clamp(parseInt(widthInput.value) || 20, 5, 80);
    const h = clamp(parseInt(heightInput.value) || 20, 5, 80);
    widthInput.value = w; heightInput.value = h;
    generateMaze(w, h);
  });

  const DIFFICULTY_GLOWS = {
    'very easy': { color: '#4a9eff', shadow: '0 0 8px #4a9effaa, 0 0 20px #4a9eff44' },
    'easy':      { color: '#4aff7a', shadow: '0 0 8px #4aff7aaa, 0 0 20px #4aff7a44' },
    'medium':    { color: '#ffe44a', shadow: '0 0 8px #ffe44aaa, 0 0 20px #ffe44a44' },
    'hard':      { color: '#ff8c4a', shadow: '0 0 8px #ff8c4aaa, 0 0 20px #ff8c4a44' },
    'very hard': { color: '#ff4a4a', shadow: '0 0 8px #ff4a4aaa, 0 0 20px #ff4a4a44' },
    'insane':    { color: '#c84aff', shadow: '0 0 8px #c84affaa, 0 0 20px #c84aff44' },
    'extreme':   { color: '#ff4ad0', shadow: '0 0 10px #ff4ad0bb, 0 0 25px #ff4ad066' }
  };

  function updateDifficultyGlow() {
    const glow = DIFFICULTY_GLOWS[selectedDifficulty] || DIFFICULTY_GLOWS['medium'];
    selectTrigger.style.borderColor = glow.color;
    selectTrigger.style.boxShadow = glow.shadow;
    selectOptions.forEach(opt => {
      const g = DIFFICULTY_GLOWS[opt.dataset.value];
      if (g) {
        opt.style.setProperty('--glow-color', g.color);
        opt.style.setProperty('--glow-shadow', g.shadow);
      }
    });
  }

  function selectOption(opt) {
    selectedDifficulty = opt.dataset.value;
    selectTrigger.textContent = opt.textContent;
    selectOptions.forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    updateDifficultyGlow();
    difficultySelect.classList.remove('open');
    const w = clamp(parseInt(widthInput.value) || 20, 5, 80);
    const h = clamp(parseInt(heightInput.value) || 20, 5, 80);
    generateMaze(w, h);
  }

  selectTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    difficultySelect.classList.toggle('open');
  });

  selectOptions.forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      selectOption(opt);
    });
  });

  document.addEventListener('click', () => {
    difficultySelect.classList.remove('open');
  });

  document.getElementById('resetScoreBtn').addEventListener('click', () => {
    const name = currentPlayer();
    if (!confirm(`Reset ${name}'s score to 0? This cannot be undone.`)) return;
    const scores = loadScores();
    if (scores[name]) { scores[name].total = 0; saveScores(scores); }
    refreshScoreDisplay();
  });

  (async () => {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      nameInput.textContent = data.user ? data.user.username : 'anonymous';
    } catch {
      nameInput.textContent = 'anonymous';
    }
    refreshScoreDisplay();
  })();

  updateDifficultyGlow();
  generateMaze(20, 20);
})();
</script>
</body>
</html>
