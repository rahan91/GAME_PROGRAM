<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1c1c1c;
      color: #e0e0e0;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      overflow: hidden;
    }
    .orb { position: fixed; border-radius: 50%; animation: float 12s ease-in-out infinite; pointer-events: none; }
    .orb--1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%); top: 0%; left: 5%; }
    .orb--2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%); bottom: 0%; right: 0%; animation-delay: -4s; }
    .orb--3 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(190,180,130,0.12) 0%, transparent 70%); bottom: 10%; left: 30%; animation-delay: -8s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.03); }
    }
    .back {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: rgba(140,180,150,0.6); text-decoration: none;
      font-size: 14px; transition: color 0.2s;
    }
    .back:hover { color: rgba(140,180,150,1); }
    .title {
      position: fixed; left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      z-index: 2; pointer-events: none;
    }
    .title h1 {
      font-size: 4rem; font-weight: 300;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(140,180,150,0.85);
      text-shadow: 0 0 60px rgba(100,160,120,0.3);
    }
    .sub {
      margin-top: 18px;
      font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(140,180,150,0.4);
    }
    @media (max-width: 640px) {
      .title h1 { font-size: 2.2rem; letter-spacing: 0.12em; }
    }
  </style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <a class="back" href="index.html">&larr; Gallery</a>

  <div class="title">
    <h1>Shop</h1>
    <div class="sub">Customization coming soon</div>
  </div>
</body>
</html>
