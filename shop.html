<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1c1c1c;
      color: #e0e0e0;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      padding: 20px;
    }
    .orb { position: fixed; border-radius: 50%; animation: float 12s ease-in-out infinite; pointer-events: none; }
    .orb--1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(80,100,90,0.18) 0%, transparent 70%); top: 0%; left: 5%; }
    .orb--2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(70,95,80,0.14) 0%, transparent 70%); bottom: 0%; right: 0%; animation-delay: -4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.03); }
    }

    .back {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: rgba(140,180,150,0.6); text-decoration: none;
      font-size: 14px; transition: color 0.2s;
    }
    .back:hover { color: rgba(140,180,150,1); }

    .head {
      max-width: 900px; margin: 0 auto; padding: 20px 0 4px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    h1 {
      font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(140,180,150,0.85); font-size: 1.4rem;
    }
    #balance {
      display: flex; align-items: center; gap: 10px;
      background: rgba(80,100,90,0.2); border: 1px solid rgba(140,180,150,0.25);
      border-radius: 8px; padding: 8px 14px; font-size: 14px; letter-spacing: 0.08em;
      color: rgba(140,180,150,0.7);
    }
    #balance b { color: rgba(220,240,225,0.95); font-weight: 300; }

    #notice {
      max-width: 900px; margin: 0 auto; padding: 8px 0;
      font-size: 12px; color: rgba(140,180,150,0.4);
    }
    #loginBanner {
      max-width: 900px; margin: 10px auto 0;
      border: 1px solid rgba(220,180,120,0.3); border-radius: 8px;
      background: rgba(220,180,120,0.08); padding: 10px 14px;
      font-size: 13px; color: rgba(230,200,140,0.85);
    }

    .tabs {
      max-width: 900px; margin: 18px auto 0;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tab {
      padding: 7px 18px; border: 1px solid rgba(140,180,150,0.25); border-radius: 6px;
      background: transparent; color: rgba(140,180,150,0.7);
      font-family: inherit; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .tab.active { background: rgba(140,180,150,0.25); color: #e0e0e0; border-color: rgba(140,180,150,0.5); }

    .grid {
      max-width: 900px; margin: 18px auto 60px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;
    }
    .item {
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(140,180,150,0.15); border-radius: 10px;
      background: rgba(80,100,90,0.12); padding: 16px 10px 12px;
      transition: border-color 0.2s, background 0.2s;
    }
    .item:hover { border-color: rgba(140,180,150,0.3); background: rgba(80,100,90,0.18); }
    .item.equipped { border-color: rgba(160,220,180,0.6); background: rgba(140,180,150,0.12); }

    .swatch {
      width: 56px; height: 56px; margin-bottom: 10px; border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      background: rgba(200,220,205,0.07);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .swatch.maze { border-radius: 8px; }
    .swatch.cursor { width: 48px; height: 48px; }
    .swatch.target { position: relative; border-radius: 50%; }
    .swatch.target img { width: 100%; height: 100%; display: block; }
    .swatch.target .tint { position: absolute; inset: 0; mix-blend-mode: color; pointer-events: none; }

    .item .name { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(200,220,205,0.9); }
    .item .price { font-size: 12px; color: rgba(230,200,120,0.85); margin-top: 2px; }
    .item button {
      margin-top: 10px; width: 100%; padding: 6px 0;
      border: none; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.2s, filter 0.2s;
    }
    .item button.buy { background: rgba(140,180,150,0.35); color: #e0e0e0; }
    .item button.buy:hover { background: rgba(140,180,150,0.5); }
    .item button.buy:disabled { background: rgba(140,180,150,0.12); color: rgba(255,255,255,0.35); cursor: default; }
    .item button.equip { background: rgba(100,180,120,0.3); color: #e0e0e0; }
    .item button.equip:hover { background: rgba(100,180,120,0.45); }
    .item .tag { margin-top: 10px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(160,220,180,0.9); }
    .item .unequip {
      margin-top: 6px; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(200,140,160,0.7);
    }
    .item .unequip:hover { color: rgba(200,140,160,1); }
    #statusRow { max-width: 900px; margin: 0 auto; height: 20px; font-size: 13px; color: rgba(220,240,225,0.85); }
    #statusRow.err { color: rgba(220,120,120,0.9); }

    @media (max-width: 640px) {
      .head { padding-top: 54px; }
      h1 { font-size: 1.1rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    }
  </style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
  <script src="score.js"></script>
  <script src="shop.js"></script>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <a class="back" href="/gallery">&larr; Gallery</a>

  <div class="head">
    <h1>Shop</h1>
    <div id="balance">BALANCE <b id="balanceValue">0</b></div>
  </div>

  <div id="notice">Leaderboard total is unaffected &middot; purchases spend your current balance</div>
  <div id="loginBanner" style="display:none;">You are not logged in. <a href="/gallery" style="color:rgba(230,200,140,0.9);">Log in</a> to buy and keep items.</div>

  <div class="tabs" id="tabs"></div>
  <div id="statusRow"></div>
  <div class="grid" id="grid"></div>

  <script>
  (function () {
    var tabsEl = document.getElementById('tabs');
    var gridEl = document.getElementById('grid');
    var balanceEl = document.getElementById('balanceValue');
    var bannerEl = document.getElementById('loginBanner');
    var statusEl = document.getElementById('statusRow');
    var slots = ['maze', 'cursor', 'target'];
    var activeSlot = 'maze';
    var state = null;

    function setStatus(msg, isErr) {
      statusEl.textContent = msg || '';
      statusEl.className = isErr ? 'err' : '';
    }
    function clearStatus() { setStatus(''); }

    function fmt(n) { return Math.round(n * 100) / 100; }

    function renderTabs() {
      tabsEl.innerHTML = '';
      slots.forEach(function (slot) {
        var b = document.createElement('button');
        b.className = 'tab' + (slot === activeSlot ? ' active' : '');
        b.textContent = window.ShopCatalog.slotName(slot);
        b.addEventListener('click', function () { activeSlot = slot; renderTabs(); renderItems(); });
        tabsEl.appendChild(b);
      });
    }

    function swatchHTML(item) {
      if (item.slot === 'cursor') {
        var c = item.color || '#f0f0f0';
        var dk = item.color ? window.Shop.hexToRgba(item.color, 0.6) : '#4a4a4a';
        return '<div class="swatch cursor"><svg viewBox="0 0 25 40" width="100%" height="100%">' +
          '<path d="M1 1 L1 29 L8 22 L14 37 L17 35 L11 20 L19 17 Z" ' +
          'fill="' + c + '" stroke="' + dk + '" stroke-width="1.5" stroke-linejoin="round"/></svg></div>';
      }
      if (item.slot === 'target') {
        var tint = item.color ? '<div class="tint" style="background:' + item.color + ';"></div>' : '';
        return '<div class="swatch target"><img src="assets/target.png" alt="target">' + tint + '</div>';
      }
      return '<div class="swatch maze" style="background:' + (item.color || '#b4c88c') + '"></div>';
    }

    function renderItems() {
      gridEl.innerHTML = '';
      var items = window.ShopCatalog.bySlot[activeSlot] || [];
      var equipped = state.equipped[activeSlot];
      var balance = state.balance;

      items.forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'item';

        var isDefault = !!item.default;
        var owned = isDefault || state.owned.indexOf(item.key) !== -1;
        var isEquipped = equipped === item.key || (isDefault && !equipped);

        if (isEquipped) card.classList.add('equipped');
        card.innerHTML = swatchHTML(item) +
          '<div class="name">' + (item.name === 'Default' ? 'Default' : item.name) + '</div>' +
          '<div class="price">' + (isDefault ? 'Original' : item.price + ' pts') + '</div>';

        var action = document.createElement('div');
        if (isEquipped) {
          action.innerHTML = '<div class="tag">Equipped</div>';
        } else if (isDefault) {
          var eq = document.createElement('button');
          eq.className = 'equip';
          eq.textContent = 'Equip';
          eq.addEventListener('click', function () {
            window.Shop.equip(activeSlot, item.key).then(function () {
              setStatus('Equipped ' + window.ShopCatalog.slotName(activeSlot).toLowerCase() + ' default');
              return refresh();
            }).catch(function (e) { setStatus(e.message, true); });
          });
          action.appendChild(eq);
        } else if (owned) {
          var eq = document.createElement('button');
          eq.className = 'equip';
          eq.textContent = 'Equip';
          eq.addEventListener('click', function () {
            window.Shop.equip(activeSlot, item.key).then(function () {
              setStatus('Equipped ' + item.name);
              return refresh();
            }).catch(function (e) { setStatus(e.message, true); });
          });
          action.appendChild(eq);
        } else {
          var btn = document.createElement('button');
          btn.className = 'buy';
          btn.textContent = 'Buy';
          btn.disabled = balance < item.price;
          btn.addEventListener('click', function () {
            window.Shop.buy(item.key).then(function (d) {
              setStatus('Purchased ' + item.name + ' \u00b7 spent ' + item.price);
              return refresh();
            }).catch(function (e) { setStatus(e.message, true); });
          });
          action.appendChild(btn);
        }

        card.appendChild(action);
        gridEl.appendChild(card);
      });
    }

    function applyBalanceDisplay() {
      balanceEl.textContent = fmt(state.balance);
      bannerEl.style.display = state.loggedIn ? 'none' : '';
    }

    function refresh() {
      return window.Shop.state().then(function (s) {
        state = s;
        applyBalanceDisplay();
        renderItems();
      });
    }

    renderTabs();
    refresh().catch(function (e) { setStatus(e.message, true); });
  })();
  </script>
</body>
</html>
