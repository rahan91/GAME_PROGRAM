<div id="statChip">

<script>
(() => {
  const board = document.getElementById('board');
  const boardWrap = document.getElementById('boardWrap');
  const overlay = document.getElementById('overlay');
  const ovScore = document.getElementById('ovScore');
  const ovMsg = document.getElementById('ovMsg');
  const ovBeat = document.getElementById('ovBeat');
  const ovCov = document.getElementById('ovCov');
  const ovPts = document.getElementById('ovPts');
  const triesDisplay = document.getElementById('triesDisplay');

  const SIZE = 640;           // logical canvas space
  const ctx = board.getContext('2d');

  let dpr = 1;
  let drawing = false;
  let finished = false;
  let stroke = [];            // points traced (logical coords)
  let strokeStart = 0;
  let tries = 0;
  let isLoggedIn = false;
  let serverTotal = null;
  let lastFit = null;         // last computed circle fit + accuracy
  let lastCov = 0;
  let lastPoints = 0;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- canvas sizing (crisp at device pixel ratio) ----------
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    board.width = Math.max(2, Math.round(boardWrap.getBoundingClientRect().width * dpr));
    board.height = Math.max(2, Math.round(boardWrap.getBoundingClientRect().height * dpr));
    resetTransform();
  }
  function resetTransform() {
    ctx.setTransform(board.width / SIZE, 0, 0, board.height / SIZE, 0, 0);
  }
  function toLogical(e) {
    const rect = board.getBoundingClientRect();
    return [
      (e.clientX - rect.left) / rect.width * SIZE,
      (e.clientY - rect.top) / rect.height * SIZE
    ];
  }

  // ---------- geometry / accuracy ----------
  // Fit a circle (centroid center, mean radius) and score circularity:
  // accuracy = 1 - (mean |dist - R|) / R, i.e. how constant the radius is.
  function fitCircle(pts) {
    const n = pts.length;
    if (n < 4) return null;
    let sx = 0, sy = 0;
    for (const p of pts) { sx += p[0]; sy += p[1]; }
    const ccx = sx / n, ccy = sy / n;
    const ds = [];
    let sumR = 0;
    for (const p of pts) {
      const d = Math.hypot(p[0] - ccx, p[1] - ccy);
      ds.push(d);
      sumR += d;
    }
    const R = sumR / n;
    if (!(R > 1e-5)) return null;
    let dev = 0;
    for (const d of ds) dev += Math.abs(d - R);
    const accuracy = clamp(1 - (dev / n) / R, 0, 1);
    const spread = Math.max(...ds) - Math.min(...ds);
    return { cx: ccx, cy: ccy, R, accuracy, spread };
  }
  // unwrapped angular sweep around a center, as a fraction of 360deg
  function sweepAround(pts, ccx, ccy) {
    if (pts.length < 2) return 0;
    let sweep = 0;
    let prev = Math.atan2(ccy - pts[0][1], pts[0][0] - ccx);
    for (let i = 1; i < pts.length; i++) {
      let a = Math.atan2(ccy - pts[i][1], pts[i][0] - ccx);
      let d = a - prev;
      while (d < -Math.PI) d += 2 * Math.PI;
      while (d > Math.PI) d -= 2 * Math.PI;
      sweep += d;
      prev = a;
    }
    return clamp(Math.abs(sweep) / (2 * Math.PI), 0, 1);
  }
  function pathLength(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) d += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return d;
  }

  // ---------- drawing ----------
  function clearBoard() {
    ctx.clearRect(0, 0, SIZE, SIZE);
  }
  function drawStroke() {
    if (stroke.length < 2) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(220,232,226,0.95)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(stroke[0][0], stroke[0][1]);
    for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i][0], stroke[i][1]);
    ctx.stroke();
    ctx.restore();
  }
  function drawFit(fit) {
    if (!fit) return;
    ctx.save();
    ctx.strokeStyle = ringColor;
    ctx.shadowColor = ringColor;
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(fit.cx, fit.cy, fit.R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = ringColor;
    ctx.beginPath();
    ctx.arc(fit.cx, fit.cy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function render() {
    clearBoard();
    drawStroke();
  }

  // ---------- HUD / score ----------
  function currentPlayer() {
    return document.getElementById('playerName').textContent.trim() || 'anonymous';
  }
  function refreshScoreDisplay() {
    const local = isLoggedIn ? (ScoreBoard.get(currentPlayer()).total || 0) : 0;
    const total = (isLoggedIn && serverTotal != null) ? serverTotal : local;
    document.getElementById('scoreDisplay').textContent = Shop.fmt(total);
  }
  function addScore(points) {
    if (!isLoggedIn || points <= 0) return;
    ScoreBoard.add(currentPlayer(), points);
    fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ points, game: 'circle' })
    }).then(r => r.json()).then((d) => {
      if (d && Number.isFinite(d.total)) { serverTotal = d.total; refreshScoreDisplay(); }
      else if (d && Number.isFinite(d.balance)) { serverTotal = d.balance; refreshScoreDisplay(); }
    }).catch(() => {});
  }
  function accText(a) {
    return (a * 100).toFixed(2) + '%';
  }
  function recordCircle(points, elapsed) {
    if (!isLoggedIn || points <= 0) return;
    fetch('/api/circle/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accuracy: lastFit.accuracy, coverage: lastCov, points: Math.round(points), elapsed })
    }).catch(() => {});
  }
  async function loadLeaderboard() {
    const container = document.getElementById('lbRows');
    const userEl = document.getElementById('lbUser');
    const name = currentPlayer();
    let data = null;
    try {
      const url = '/api/circle/leaderboard?limit=10' + (isLoggedIn ? '&user=' + encodeURIComponent(name) : '');
      const res = await fetch(url);
      data = await res.json();
    } catch { data = null; }
    if (!data || !data.top) {
      container.innerHTML = '<div class="lb-status">Could not load.</div>';
      userEl.innerHTML = '';
      return;
    }
    if (!data.top.length) {
      container.innerHTML = '<div class="lb-status">No runs yet. Be the first!</div>';
      userEl.innerHTML = '<span class="muted">Players: 0</span>';
      return;
    }
    container.innerHTML = data.top.map((row, i) =>
      '<div class="lb-row' + (isLoggedIn && row.username === name ? ' me' : '') + '">' +
      '<span class="rk' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</span>' +
      window.Shop.npHTML(row) +
      '<span class="acc">' + accText(row.accuracy) + '</span>' +
      '</div>'
    ).join('');
    if (data.user && data.user.pct != null) {
      const beat = Math.max(1, Math.min(100, Math.round(100 - data.user.pct)));
      if (finished) ovBeat.textContent = 'You beat ' + beat + '% of players';
      userEl.innerHTML = 'You: rank <b>#' + data.user.rank + '</b> of ' + data.players +
        ' &middot; best <b>' + accText(data.user.best) + '</b>' +
        ' &middot; ' + data.user.runs + ' run' + (data.user.runs === 1 ? '' : 's');
    } else {
      userEl.innerHTML = '<span class="muted">Players: ' + data.players + ' &middot; Runs: ' + data.runs + '</span>';
    }
  }

  // ---------- flow ----------
  function startDraw() {
    stroke = [];
    drawing = true;
    finished = false;
    lastFit = null;
    strokeStart = Date.now();
    overlay.classList.remove('show');
    render();
  }
  function finishDraw() {
    drawing = false;
    finished = true;
    const elapsed = (Date.now() - strokeStart) / 1000;
    lastElapsed = elapsed;
    lastFit = fitCircle(stroke);
    if (!lastFit) { abandonDraw('too short'); return; }
    lastCov = sweepAround(stroke, lastFit.cx, lastFit.cy);
    const accuracy = lastFit.accuracy;
    lastPoints = Scoring.circleScore(accuracy, lastCov, elapsed);
    addScore(lastPoints);
    recordCircle(lastPoints, elapsed);
    loadLeaderboard();

    tries++;
    triesDisplay.textContent = tries;

    const pct = Math.round(accuracy * 1000) / 10;
    ovScore.textContent = pct + '%';
    ovMsg.textContent = messageFor(accuracy);
    ovBeat.textContent = isLoggedIn ? '' : 'You beat ' + heuristicBeat(accuracy) + '% of players';
    ovCov.textContent = Math.round(lastCov * 100) + '% of the circle drawn';
    ovPts.textContent = lastPoints > 0 ? ('+' + Shop.fmt(lastPoints) + ' pts &middot; ' + elapsed.toFixed(1) + 's') : 'draw again to keep improving';
    overlay.classList.add('show');
    render();
    // show the fitted circle over the stroke
    drawFit(lastFit);
  }
  function abandonDraw(reason) {
    drawing = false;
    tries++;
    triesDisplay.textContent = tries;
    stroke = [];
    render();
  }
  function messageFor(accuracy) {
    const p = accuracy * 100;
    if (p >= 97) return 'Perfect circle!';
    if (p >= 92) return 'Unbelievably circular';
    if (p >= 85) return 'Stunning roundness';
    if (p >= 75) return 'That\u2019s a nice circle';
    if (p >= 62) return 'Genuinely round-ish';
    if (p >= 48) return 'Shaped like a reminder of a circle';
    if (p >= 30) return 'Are your hands okay?';
    return 'That\u2019s\u2026 not a circle';
  }
  function heuristicBeat(accuracy) {
    return Math.max(1, Math.min(99, Math.round((accuracy * 100 - 55) * 2.5)));
  }

  // ---------- inputs ----------
  board.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('a')) return;
    e.preventDefault();
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    startDraw();
    stroke.push(toLogical(e));
    render();
  });
  window.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = toLogical(e);
    const last = stroke[stroke.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.5) return;
    stroke.push(p);
    render();
    // auto-finish when the stroke closes back onto its start with a real loop behind it
    if (stroke.length > 12 && pathLength(stroke) > 60) {
      const est = fitCircle(stroke);
      const sweep = est ? sweepAround(stroke, est.cx, est.cy) : 0;
      const closeR = Math.max(16, (est && est.R) ? est.R * 0.10 : 20);
      if (sweep >= 0.55 && Math.hypot(p[0] - stroke[0][0], p[1] - stroke[0][1]) < closeR) {
        finishDraw();
      }
    }
  });
  window.addEventListener('pointerup', (e) => {
    if (!drawing) return;
    drawing = false;
    if (stroke.length < 4 || pathLength(stroke) < 40) { abandonDraw('too short'); return; }
    const est = fitCircle(stroke);
    const sweep = est ? sweepAround(stroke, est.cx, est.cy) : 0;
    if (sweep >= 0.5) {
      finishDraw();
    } else {
      abandonDraw('let go too early');
    }
  });
  window.addEventListener('pointercancel', () => { drawing = false; });

  // ---------- crosshair ----------
  const cross = document.getElementById('cross');
  document.addEventListener('pointermove', (e) => {
    cross.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0) translate(-50%,-50%)';
  });
  board.addEventListener('pointerenter', () => cross.classList.add('on'));
  board.addEventListener('pointerleave', () => cross.classList.remove('on'));

  // ---------- cosmetics ----------
  let ringColor = 'rgba(140,180,150,0.85)';
  async function applyCosmetics() {
    try {
      const s = await Shop.state();
      Shop.applyAccentFromState(s);
      const a = Shop.installed(s.equipped, Shop.ACCENT);
      ringColor = (a && a.color) ? Shop.hexToRgba(a.color, 0.85) : 'rgba(140,180,150,0.85)';
    } catch (e) {}
    render();
  }
  async function loadPlayerAndScore() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();
      const user = data.user || null;
      isLoggedIn = !!(user && user.username);
      if (user && user.username) document.getElementById('playerName').textContent = user.username;
      serverTotal = (user && Number.isFinite(user.total))
        ? user.total
        : (user && Number.isFinite(user.balance)) ? user.balance : null;
    } catch {
      isLoggedIn = false;
    }
    await applyCosmetics();
    refreshScoreDisplay();
  }

  // ---------- boot ----------
  fit();
  window.addEventListener('resize', () => { fit(); render(); });
  loadPlayerAndScore();
  window.addEventListener('pageshow', loadPlayerAndScore);
