<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLERY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #1c1c1c;
      overflow: hidden;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      animation: float 12s ease-in-out infinite;
    }
    .orb--1 {
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(80, 100, 90, 0.3) 0%, rgba(80, 100, 90, 0.1) 40%, transparent 70%);
      top: 5%;
      left: 5%;
      animation-delay: 0s;
    }
    .orb--2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(70, 95, 80, 0.25) 0%, rgba(70, 95, 80, 0.08) 40%, transparent 70%);
      top: 50%;
      right: 0%;
      animation-delay: -4s;
    }
    .orb--3 {
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(90, 110, 95, 0.22) 0%, rgba(90, 110, 95, 0.06) 40%, transparent 70%);
      bottom: 0%;
      left: 30%;
      animation-delay: -8s;
    }
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }
    .title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: top 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active {
      top: 60px;
      transform: translateY(0);
    }
    .title h1 {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: 4rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(140, 180, 150, 0.85);
      text-shadow: 0 0 60px rgba(100, 160, 120, 0.3);
      transition: font-size 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active h1 {
      font-size: 2rem;
    }
    .grid {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .grid-inner {
      display: grid;
      grid-template-columns: repeat(3, 140px);
      grid-template-rows: repeat(2, 140px);
      gap: 24px;
    }
    .card {
      width: 140px;
      height: 140px;
      border-radius: 10px;
      background: rgba(80, 100, 90, 0.15);
      border: 1px solid rgba(140, 180, 150, 0.15);
      opacity: 0;
      transform: translateY(120vh);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }
    .card.active {
      opacity: 1;
      transform: translateY(0);
    }
    .card:hover {
      background: rgba(80, 100, 90, 0.25);
      border-color: rgba(140, 180, 150, 0.3);
    }
    .card .icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .label {
      font-family: 'Anonymous Pro', 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(140, 180, 150, 0.7);
    }
    .card .coming {
      font-family: 'Anonymous Pro', 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.55rem;
      color: rgba(140, 180, 150, 0.3);
      margin-top: 4px;
    }
    .card:nth-child(1), .card:nth-child(2) { transition-delay: 0s; }
    .card:nth-child(3), .card:nth-child(4) { transition-delay: 0.15s; }
    .card:nth-child(5), .card:nth-child(6) { transition-delay: 0.3s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    .auth-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      padding: 8px 18px;
      border: 1px solid rgba(140,180,150,0.4);
      border-radius: 6px;
      background: rgba(80,100,90,0.2);
      color: rgba(140,180,150,0.9);
      font-family: 'Anonymous Pro', 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .auth-btn:hover { background: rgba(80,100,90,0.4); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 320px;
      background: #1c1c1c;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 10px;
      padding: 24px;
      font-family: 'Anonymous Pro', 'IBM Plex Mono', 'Courier New', monospace;
    }
    .modal h2 {
      color: rgba(140,180,150,0.9);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }
    .modal .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal .tab {
      flex: 1;
      padding: 6px;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 6px;
      background: transparent;
      color: rgba(140,180,150,0.7);
      cursor: pointer;
    }
    .modal .tab.active {
      background: rgba(140,180,150,0.25);
      color: #e0e0e0;
    }
    .modal input {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 6px;
      background: rgba(80,100,90,0.15);
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: rgba(140,180,150,0.5); }
    .modal .submit {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(140,180,150,0.35);
      color: #e0e0e0;
      font-weight: 600;
      cursor: pointer;
    }
    .modal .submit:hover { background: rgba(140,180,150,0.5); }
    .modal .err {
      color: rgba(220,120,120,0.9);
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .modal .close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: rgba(140,180,150,0.6);
      font-size: 18px;
      cursor: pointer;
    }
    .modal { position: relative; }
    .user-chip { color: rgba(140,180,150,0.9); }
  </style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="vignette"></div>

  <div id="authBtnWrap" style="position:fixed;top:20px;right:20px;z-index:10;">
    <button class="auth-btn" id="authBtn">Login</button>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="close" id="closeAuth">&times;</button>
      <h2 id="modalTitle">Log in</h2>
      <div class="tabs">
        <button class="tab active" data-mode="login">Log in</button>
        <button class="tab" data-mode="register">Register</button>
      </div>
      <div id="authBody">
        <input type="text" id="authLogin" placeholder="Username or email" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="err" id="authErr"></div>
      <button class="submit" id="authSubmit">Log in</button>
    </div>
  </div>

  <div class="title" id="title"><h1>Select your Game</h1></div>
  <div class="grid">
    <div class="grid-inner">
      <a class="card" href="maze.html">
        <div class="icon"><img src="assets/maze.png" alt="Maze" width="48" height="48"></div>
        <div class="label">Maze</div>
      </a>
      <div class="card">
        <div class="icon">&#9679;</div>
        <div class="label">Coming Soon</div>
        <div class="coming"></div>
      </div>
      <div class="card">
        <div class="icon">&#9675;</div>
        <div class="label">Coming Soon</div>
      </div>
      <div class="card">
        <div class="icon">&#9674;</div>
        <div class="label">Coming Soon</div>
      </div>
      <div class="card">
        <div class="icon">&#10022;</div>
        <div class="label">Coming Soon</div>
      </div>
      <div class="card">
        <div class="icon">&#11206;</div>
        <div class="label">Coming Soon</div>
      </div>
    </div>
  </div>
  <script>
    let triggered = false;
    function activate() {
      if (triggered) return;
      triggered = true;
      document.getElementById('title').classList.add('active');
      document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
    }
    document.addEventListener('keydown', activate);
    document.addEventListener('click', activate);
    document.addEventListener('touchstart', activate);
    document.addEventListener('mousemove', activate);

    // ---- Auth ----
    const authBtn = document.getElementById('authBtn');
    const modal = document.getElementById('authModal');
    const closeBtn = document.getElementById('closeAuth');
    const modalTitle = document.getElementById('modalTitle');
    const authBody = document.getElementById('authBody');
    const authErr = document.getElementById('authErr');
    const authSubmit = document.getElementById('authSubmit');
    const tabs = document.querySelectorAll('.tab');
    let mode = 'login';

    function setMode(m) {
      mode = m;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
      modalTitle.textContent = m === 'login' ? 'Log in' : 'Register';
      authSubmit.textContent = m === 'login' ? 'Log in' : 'Create account';
      authErr.textContent = '';
      authBody.innerHTML = '';
      if (m === 'register') {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username" autocomplete="username">' +
          '<input type="email" id="authEmail" placeholder="Email (optional)" autocomplete="email">' +
          '<input type="password" id="authPassword" placeholder="Password (8+ chars)" autocomplete="new-password">';
      } else {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username or email" autocomplete="username">' +
          '<input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">';
      }
    }

    function renderAuthState(user) {
      if (user) {
        authBtn.textContent = 'Logout (' + user.username + ')';
      } else {
        authBtn.textContent = 'Login';
      }
    }

    function openModal() {
      setMode('login');
      modal.classList.add('open');
    }

    authBtn.addEventListener('click', async () => {
      const user = (window.__user && window.__user.username) ? window.__user : null;
      if (user) {
        await fetch('/api/logout', { method: 'POST' });
        window.__user = null;
        renderAuthState(null);
        return;
      }
      openModal();
    });

    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    closeBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    authSubmit.addEventListener('click', async () => {
      const login = document.getElementById('authLogin').value.trim();
      const password = document.getElementById('authPassword').value;
      const emailEl = document.getElementById('authEmail');
      const email = emailEl ? emailEl.value.trim() : undefined;
      const payload = mode === 'register'
        ? { username: login, email, password }
        : { login, password };
      try {
        const res = await fetch('/api/' + (mode === 'register' ? 'register' : 'login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) { authErr.textContent = data.error || 'Request failed'; return; }
        window.__user = data.user;
        renderAuthState(data.user);
        modal.classList.remove('open');
      } catch (err) {
        authErr.textContent = 'Network error';
      }
    });

    (async () => {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        window.__user = data.user || null;
        renderAuthState(window.__user);
      } catch { window.__user = null; renderAuthState(null); }
    })();
  </script>
</body>
</html>
