<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLERY</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #1c1c1c;
      overflow: hidden;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      animation: float 12s ease-in-out infinite;
    }
    .orb--1 {
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(80, 100, 90, 0.3) 0%, rgba(80, 100, 90, 0.1) 40%, transparent 70%);
      top: 5%;
      left: 5%;
      animation-delay: 0s;
    }
    .orb--2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(70, 95, 80, 0.25) 0%, rgba(70, 95, 80, 0.08) 40%, transparent 70%);
      top: 50%;
      right: 0%;
      animation-delay: -4s;
    }
    .orb--3 {
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(90, 110, 95, 0.22) 0%, rgba(90, 110, 95, 0.06) 40%, transparent 70%);
      bottom: 0%;
      left: 30%;
      animation-delay: -8s;
    }
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }
    .title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: top 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active {
      top: 60px;
      transform: translateY(0);
    }
    .title h1 {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(140, 180, 150, 0.85);
      text-shadow: 0 0 60px rgba(100, 160, 120, 0.3);
      transition: font-size 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active h1 {
      font-size: 2rem;
    }
    .grid {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .grid-inner {
      display: grid;
      grid-template-columns: repeat(3, 175px);
      grid-template-rows: repeat(2, 175px);
      gap: 26px;
    }
    .card {
      width: 175px;
      height: 175px;
      border-radius: 10px;
      background: rgba(80, 100, 90, 0.15);
      border: 1px solid rgba(140, 180, 150, 0.15);
      opacity: 0;
      transform: translateY(120vh);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }
    .card.active {
      opacity: 1;
      transform: translateY(0);
    }
    .card:hover {
      background: rgba(80, 100, 90, 0.25);
      border-color: rgba(140, 180, 150, 0.3);
    }
    .card .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .label {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(140, 180, 150, 0.7);
    }
    .card .coming {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.55rem;
      color: rgba(140, 180, 150, 0.3);
      margin-top: 4px;
    }
    .card:nth-child(1), .card:nth-child(2) { transition-delay: 0s; }
    .card:nth-child(3), .card:nth-child(4) { transition-delay: 0.15s; }
    .card:nth-child(5), .card:nth-child(6) { transition-delay: 0.3s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    .lb {
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      background: rgba(30, 38, 34, 0.82);
      border: 1px solid rgba(140, 180, 150, 0.2);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      padding: 18px 0 10px;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lb.active { opacity: 1; }
    .lb-title {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(140, 180, 150, 0.85);
      margin: 0 auto 10px;
      text-shadow: 0 0 30px rgba(100, 160, 120, 0.3);
    }
    .lb-board {
      width: 100%;
      max-height: 55vh;
      overflow-y: auto;
    }
    .lb-head, .lb-row {
      display: grid;
      grid-template-columns: 40px 1fr 56px 68px;
      align-items: center;
      padding: 6px 18px;
    }
    .lb-head {
      color: rgba(140, 180, 150, 0.35);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(140, 180, 150, 0.18);
      margin-bottom: 6px;
    }
    .lb-row {
      color: rgba(200, 220, 205, 0.85);
      font-size: 0.78rem;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
    .lb-head .rk, .lb-head .pl, .lb-head .pt,
    .lb-row .rk, .lb-row .pl, .lb-row .pt { text-align: right; }
    .lb-head .rk, .lb-head .pl, .lb-row .rk, .lb-row .pl { padding-right: 8px; }
    .lb-row .rk { color: rgba(140, 180, 150, 0.45); }
    .lb-row .pl { color: rgba(140, 180, 150, 0.35); font-size: 0.7rem; }
    .lb-row .pt { color: rgba(220, 240, 225, 0.95); }
    .lb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row.me { background: rgba(140, 180, 150, 0.14); }
    .lb-row.me .pt { color: rgba(160, 220, 180, 1); }
    .lb-row .rk.top { color: rgba(230, 200, 120, 0.9); }
    .lb-status {
      color: rgba(140, 180, 150, 0.45);
      font-size: 0.75rem;
      text-align: center;
      padding: 18px 0;
    }
    .auth-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      padding: 8px 18px;
      border: 1px solid rgba(140,180,150,0.4);
      border-radius: 6px;
      background: rgba(80,100,90,0.2);
      color: rgba(140,180,150,0.9);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .auth-btn:hover { background: rgba(80,100,90,0.4); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 320px;
      background: #1c1c1c;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 10px;
      padding: 24px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
    .modal h2 {
      color: rgba(140,180,150,0.9);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }
    .modal .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal .tab {
      flex: 1;
      padding: 6px;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 6px;
      background: transparent;
      color: rgba(140,180,150,0.7);
      cursor: pointer;
    }
    .modal .tab.active {
      background: rgba(140,180,150,0.25);
      color: #e0e0e0;
    }
    .modal input {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(140,180,150,0.2);
      border-radius: 6px;
      background: rgba(80,100,90,0.15);
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: rgba(140,180,150,0.5); }
    .modal .submit {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(140,180,150,0.35);
      color: #e0e0e0;
      font-weight: 600;
      cursor: pointer;
    }
    .modal .submit:hover { background: rgba(140,180,150,0.5); }
    .modal .err {
      color: rgba(220,120,120,0.9);
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .modal .close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: rgba(140,180,150,0.6);
      font-size: 18px;
      cursor: pointer;
    }
    .modal { position: relative; }
    .user-chip { color: rgba(140,180,150,0.9); }
    #pointsWrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(80, 100, 90, 0.2);
      border: 1px solid rgba(140, 180, 150, 0.25);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: rgba(140, 180, 150, 0.7);
    }
    #pointsTotal {
      color: rgba(220, 240, 225, 0.95);
      font-weight: 300;
    }
    #resetPointsBtn {
      border: 1px solid rgba(140, 180, 150, 0.25);
      border-radius: 4px;
      background: transparent;
      color: rgba(200, 140, 160, 0.75);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #resetPointsBtn:hover {
      background: rgba(200, 140, 160, 0.08);
      border-color: rgba(200, 140, 160, 0.5);
    }

    @media (max-width: 1100px) {
      body { overflow-y: auto; overflow-x: hidden; }
      .title {
        position: static;
        top: auto;
        transform: none;
        padding: 84px 16px 8px;
        transition: none;
      }
      .title.active { top: auto; transform: none; }
      .title h1 { font-size: 1.6rem; }
      .title.active h1 { font-size: 1.6rem; }
      .grid {
        position: static;
        display: flex;
        padding: 12px 16px 8px;
      }
      .grid-inner {
        width: min(528px, calc(100vw - 32px));
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: none;
        gap: 14px;
      }
      .card {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        opacity: 1;
        transform: none;
        transition: none;
      }
      .card.active { opacity: 1; transform: none; }
      .card .icon { font-size: 1.5rem; margin-bottom: 4px; }
      .card .icon img { width: 44px; height: 44px; }
      .card .label { font-size: 0.68rem; }
      .card .coming { font-size: 0.5rem; }
      .lb {
        position: static;
        transform: none;
        width: min(440px, calc(100vw - 32px));
        margin: 20px auto 72px;
        padding: 16px 0 8px;
      }
      #pointsWrap {
        max-width: calc(100vw - 24px);
        font-size: 13px;
        padding: 6px 12px;
      }
    }
  </style>
  <link rel="stylesheet" href="crt.css">
  <script defer src="crt.js"></script>
  <script src="score.js"></script>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="vignette"></div>

  <div id="authBtnWrap" style="position:fixed;top:20px;right:20px;z-index:10;">
    <button class="auth-btn" id="authBtn">Login</button>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="close" id="closeAuth">&times;</button>
      <h2 id="modalTitle">Log in</h2>
      <div class="tabs">
        <button class="tab active" data-mode="login">Log in</button>
        <button class="tab" data-mode="register">Register</button>
      </div>
      <div id="authBody">
        <input type="text" id="authLogin" placeholder="Username or email" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="err" id="authErr"></div>
      <button class="submit" id="authSubmit">Log in</button>
    </div>
  </div>

  <div class="title" id="title"><h1>Select your Game</h1></div>
  <div class="grid">
    <div class="grid-inner">
      <a class="card" href="maze.html">
        <div class="icon"><img src="assets/maze.png" alt="Maze" width="56" height="56"></div>
        <div class="label">Maze</div>
      </a>
      <a class="card" href="target.html">
        <div class="icon"><img src="assets/target-icon.png" alt="Target" width="56" height="56"></div>
        <div class="label">Target</div>
      </a>
      <a class="card" href="button.html">
        <div class="icon"><img src="assets/button-icon.png" alt="Button" width="56" height="56"></div>
        <div class="label">Button</div>
      </a>
      <div class="card">
        <div class="icon">&#9674;</div>
        <div class="label">Coming Soon</div>
      </div>
      <div class="card">
        <div class="icon">&#10022;</div>
        <div class="label">Coming Soon</div>
      </div>
      <div class="card">
        <div class="icon">&#11206;</div>
        <div class="label">Coming Soon</div>
      </div>
    </div>
  </div>

  <div class="lb">
    <div class="lb-title">Leaderboard</div>
    <div class="lb-board">
      <div class="lb-head">
        <div class="rk">#</div>
        <div>Player</div>
        <div class="pl">ID</div>
        <div class="pt">Pts</div>
      </div>
      <div id="lbRows"><div class="lb-status">Loading&hellip;</div></div>
    </div>
  </div>

  <div id="pointsWrap">
    <span id="pointsTotal">0</span>
    POINTS
    <button id="resetPointsBtn">Reset</button>
  </div>

  <a href="shop.html" class="auth-btn" id="shopLink"
     style="position:fixed;bottom:20px;left:20px;z-index:10;text-decoration:none;">Shop &rarr;</a>

  <script>
    let triggered = false;
    function activate() {
      if (triggered) return;
      triggered = true;
      document.getElementById('title').classList.add('active');
      document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
      document.querySelector('.lb').classList.add('active');
    }
    document.addEventListener('keydown', activate);
    document.addEventListener('click', activate);
    document.addEventListener('touchstart', activate);
    document.addEventListener('mousemove', activate);

    // ---- Auth ----
    const authBtn = document.getElementById('authBtn');
    const modal = document.getElementById('authModal');
    const closeBtn = document.getElementById('closeAuth');
    const modalTitle = document.getElementById('modalTitle');
    const authBody = document.getElementById('authBody');
    const authErr = document.getElementById('authErr');
    const authSubmit = document.getElementById('authSubmit');
    const tabs = document.querySelectorAll('.tab');
    let mode = 'login';

    function setMode(m) {
      mode = m;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
      modalTitle.textContent = m === 'login' ? 'Log in' : 'Register';
      authSubmit.textContent = m === 'login' ? 'Log in' : 'Create account';
      authErr.textContent = '';
      authBody.innerHTML = '';
      if (m === 'register') {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username" autocomplete="username">' +
          '<input type="email" id="authEmail" placeholder="Email (optional)" autocomplete="email">' +
          '<input type="password" id="authPassword" placeholder="Password (8+ chars)" autocomplete="new-password">';
      } else {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username or email" autocomplete="username">' +
          '<input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">';
      }
    }

    function renderAuthState(user) {
      if (user) {
        authBtn.textContent = 'Logout (' + user.username + ')';
      } else {
        authBtn.textContent = 'Login';
      }
    }

    let serverTotal = null;
    function currentPointsPlayer() {
      return (window.__user && window.__user.username) ? window.__user.username : null;
    }
    function refreshPoints() {
      const player = currentPointsPlayer();
      const local = player ? (ScoreBoard.get(player).total || 0) : 0;
      const total = (player && serverTotal != null) ? serverTotal : local;
      document.getElementById('pointsTotal').textContent = Math.round(total * 100) / 100;
      document.getElementById('resetPointsBtn').style.display = player ? '' : 'none';
    }
    document.getElementById('resetPointsBtn').addEventListener('click', async () => {
      const name = currentPointsPlayer();
      if (!name) return;
      if (!confirm('Reset ' + name + "'s score to 0? This cannot be undone.")) return;
      ScoreBoard.reset(name);
      serverTotal = 0;
      try { await fetch('/api/score/reset', { method: 'POST' }); } catch {}
      refreshPoints();
      loadLeaderboard();
    });

    function openModal() {
      setMode('login');
      modal.classList.add('open');
    }

    authBtn.addEventListener('click', async () => {
      const user = (window.__user && window.__user.username) ? window.__user : null;
      if (user) {
        await fetch('/api/logout', { method: 'POST' });
        window.__user = null;
        serverTotal = null;
        renderAuthState(null);
        refreshPoints();
        loadLeaderboard();
        return;
      }
      openModal();
    });

    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    closeBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    authSubmit.addEventListener('click', async () => {
      const login = document.getElementById('authLogin').value.trim();
      const password = document.getElementById('authPassword').value;
      const emailEl = document.getElementById('authEmail');
      const email = emailEl ? emailEl.value.trim() : undefined;
      const payload = mode === 'register'
        ? { username: login, email, password }
        : { login, password };
      try {
        const res = await fetch('/api/' + (mode === 'register' ? 'register' : 'login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) { authErr.textContent = data.error || 'Request failed'; return; }
        window.__user = data.user;
        renderAuthState(data.user);
        modal.classList.remove('open');
        refreshPoints();
        loadLeaderboard();
      } catch (err) {
        authErr.textContent = 'Network error';
      }
    });

    async function initAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        window.__user = data.user || null;
        serverTotal = (window.__user && Number.isFinite(window.__user.total)) ? window.__user.total : null;
        renderAuthState(window.__user);
      } catch { window.__user = null; serverTotal = null; renderAuthState(null); }
      refreshPoints();
    }
    initAuth();

    // ---- Universal leaderboard ----
    async function loadLeaderboard() {
      const container = document.getElementById('lbRows');
      let me = null;
      try {
        const mr = await fetch('/api/me');
        const md = await mr.json();
        me = (md.user && md.user.username) ? md.user.username : null;
      } catch {}
      let rows;
      try {
        const res = await fetch('/api/leaderboard?limit=100');
        const data = await res.json();
        rows = data.leaderboard || null;
      } catch {
        rows = null;
      }
      if (!rows) {
        container.innerHTML = '<div class="lb-status">Could not load the leaderboard.</div>';
        return;
      }
      if (!rows.length) {
        container.innerHTML = '<div class="lb-status">No scores yet. Play a game, then come back.</div>';
        return;
      }
      const meUser = me;
      container.innerHTML = rows.map((row, i) =>
        '<div class="lb-row' + (row.username === meUser ? ' me' : '') + '">' +
        '<div class="rk' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</div>' +
        '<div class="nm">' + row.username + '</div>' +
        '<div class="pl">' + (row.id !== undefined ? row.id : '') + '</div>' +
        '<div class="pt">' + (row.total !== undefined ? Math.round(row.total * 100) / 100 : 0) + '</div>' +
        '</div>'
      ).join('');
    }
    loadLeaderboard();
    window.addEventListener('pageshow', () => { initAuth(); loadLeaderboard(); });
  </script>
</body>
</html>
