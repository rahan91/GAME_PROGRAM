  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #1c1c1c;
      overflow: hidden;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      animation: float 12s ease-in-out infinite;
    }
    .orb--1 {
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(var(--acc-dim), 0.3) 0%, rgba(var(--acc-dim), 0.1) 40%, transparent 70%);
      top: 5%;
      left: 5%;
      animation-delay: 0s;
    }
    .orb--2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(var(--acc-orb), 0.25) 0%, rgba(var(--acc-orb), 0.08) 40%, transparent 70%);
      top: 50%;
      right: 0%;
      animation-delay: -4s;
    }
    .orb--3 {
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(var(--acc-dim), 0.22) 0%, rgba(var(--acc-dim), 0.06) 40%, transparent 70%);
      bottom: 0%;
      left: 30%;
      animation-delay: -8s;
    }
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }
    .title {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: top 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active {
      top: 60px;
      transform: translateY(0);
    }
    .title h1 {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(180deg, rgba(var(--acc-texthi), 0.95) 0%, rgba(var(--acc-main), 0.6) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(var(--acc-btn), 0.3)) drop-shadow(0 0 60px rgba(var(--acc-btn), 0.12));
      transition: font-size 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title.active h1 {
      font-size: 2rem;
    }
    .grid {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .grid-inner {
      display: grid;
      grid-template-columns: repeat(3, 175px);
      gap: 26px;
    }
    .card {
      width: 175px;
      height: 175px;
      border-radius: 12px;
      background: rgba(var(--acc-dim), 0.15);
      border: 1px solid rgba(var(--acc-main), 0.15);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(120vh);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.3s, background 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .card.active {
      opacity: 1;
      transform: translateY(0);
    }
    .card.active::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      background: radial-gradient(circle at 50% 120%, rgba(var(--acc-btn), 0.16) 0%, transparent 60%);
    }
    .card.active:hover::after { opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      .card.active:hover {
        background: rgba(var(--acc-dim), 0.3);
        border-color: rgba(var(--acc-main), 0.55);
        transform: translateY(-6px) scale(1.03);
        box-shadow:
          0 14px 44px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(var(--acc-main), 0.15),
          0 0 30px rgba(var(--acc-btn), 0.15);
      }
      .card.active:hover .icon { transform: scale(1.15); }
    }
    .card .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card .icon img { border-radius: 8px; }
    .card .label {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(var(--acc-main), 0.7);
    }
    .card .coming {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.55rem;
      color: rgba(var(--acc-main), 0.3);
      margin-top: 4px;
    }
    .card.online {
      border-color: rgba(var(--acc-btn), 0.45);
      box-shadow: 0 0 18px rgba(var(--acc-btn), 0.2), 0 6px 24px rgba(0,0,0,0.25);
    }
    .card.online::before {
      content: "ONLINE";
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(var(--acc-btn), 0.3);
      color: rgba(var(--acc-texthi), 0.9);
      border: 1px solid rgba(var(--acc-btn), 0.4);
      z-index: 2;
    }
    .card:not(a) {
      border-style: dashed;
      background: rgba(var(--acc-dim), 0.08);
    }
    .card:not(a) .icon { opacity: 0.35; }
    .card:not(a) .label { color: rgba(var(--acc-main), 0.4); }
    .card.active {
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (hover: hover) and (pointer: fine) {
      .card.active:hover {
        transition: transform 0.15s ease, background 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    .lb {
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      background: rgba(var(--acc-panel), 0.82);
      border: 1px solid rgba(var(--acc-main), 0.2);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      padding: 18px 0 10px;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lb.active { opacity: 1; }
    .lb-title {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(var(--acc-main), 0.85);
      margin: 0 auto 10px;
      text-shadow: 0 0 30px rgba(var(--acc-btn), 0.3);
    }
    .lb-board {
      width: 100%;
      max-height: 55vh;
      overflow-y: auto;
    }
    .lb-head, .lb-row {
      display: grid;
      grid-template-columns: 40px 1fr 56px 68px;
      align-items: center;
      padding: 6px 18px;
    }
    .lb-head {
      color: rgba(var(--acc-main), 0.35);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(var(--acc-main), 0.18);
      margin-bottom: 6px;
    }
    .lb-row {
      color: rgba(var(--acc-text), 0.85);
      font-size: 0.78rem;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
    .lb-head .rk, .lb-head .pl, .lb-head .pt,
    .lb-row .rk, .lb-row .pl, .lb-row .pt { text-align: right; }
    .lb-head .rk, .lb-head .pl, .lb-row .rk, .lb-row .pl { padding-right: 8px; }
    .lb-row .rk { color: rgba(var(--acc-main), 0.45); }
    .lb-row .pl { color: rgba(var(--acc-main), 0.35); font-size: 0.7rem; }
    .lb-row .pt { color: rgba(var(--acc-texthi), 0.95); }
    .lb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row.me { background: rgba(var(--acc-main), 0.14); }
    .lb-row.me .pt { color: rgba(var(--acc-bright), 1); }
    .lb-row .rk.top { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .lb-row .rk.rk1 { background-image: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700); }
  .lb-row .rk.rk2 { background-image: linear-gradient(135deg, #c0c0c0, #e8e8e8, #a8a8a8, #d0d0d0); }
  .lb-row .rk.rk3 { background-image: linear-gradient(135deg, #cd7f32, #e8a858, #c46a28, #daa060); }
    .lb-status {
      color: rgba(var(--acc-main), 0.45);
      font-size: 0.75rem;
      text-align: center;
      padding: 18px 0;
    }
    .auth-btn {
      position: fixed;
      top: 20px;

      z-index: 10;
      padding: 8px 18px;
      border: 1px solid rgba(var(--acc-main),0.4);

    }
    @media (hover: hover) and (pointer: fine) {
      .auth-btn:hover {
        background: rgba(var(--acc-main), 0.18);
        border-color: rgba(var(--acc-main), 0.6);
        box-shadow: 0 0 18px rgba(var(--acc-btn), 0.15);

    .shop-cta {
      position: fixed;
      bottom: 20px;
      left: 20px;

      text-decoration: none;
      color: rgba(var(--acc-main), 0.75);

      font-size: 14px;
      padding: 8px 18px;
      border: 1px solid rgba(var(--acc-main), 0.4);
      border-radius: 6px;
      background: rgba(var(--acc-dim), 0.2);

    @media (hover: hover) and (pointer: fine) {
      .shop-cta:hover {
        background: rgba(var(--acc-main), 0.18);

      .shop-cta:active { transform: translateY(1px); }
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 320px;
      background: #1c1c1c;
      border: 1px solid rgba(var(--acc-main),0.2);
      border-radius: 10px;
      padding: 24px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
    .modal h2 {
      color: rgba(var(--acc-main),0.9);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }
    .modal .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal .tab {
      flex: 1;
      padding: 6px;
      border: 1px solid rgba(var(--acc-main),0.2);
      border-radius: 6px;
      background: transparent;
      color: rgba(var(--acc-main),0.7);
      cursor: pointer;
    }
    .modal .tab.active {
      background: rgba(var(--acc-main),0.25);
      color: #e0e0e0;
    }
    .modal input {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(var(--acc-main),0.2);
      border-radius: 6px;
      background: rgba(var(--acc-dim),0.15);
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: rgba(var(--acc-main),0.5); }
    .modal .submit {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(var(--acc-main),0.35);
      color: #e0e0e0;
      font-weight: 600;
      cursor: pointer;
    }
    .modal .submit:hover { background: rgba(var(--acc-main),0.5); }
    .modal .err {
      color: rgba(220,120,120,0.9);
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .modal .close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: rgba(var(--acc-main),0.6);
      font-size: 18px;
      cursor: pointer;
    }
    .modal { position: relative; }
    .user-chip { color: rgba(var(--acc-main),0.9); }
    #pointsWrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(var(--acc-dim), 0.2);
      border: 1px solid rgba(var(--acc-main), 0.25);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: rgba(var(--acc-main), 0.7);
    }
    #pointsTotal {
      color: rgba(var(--acc-texthi), 0.95);
      font-weight: 300;
    }
    #resetPointsBtn {
      border: 1px solid rgba(var(--acc-main), 0.25);
      border-radius: 4px;
      background: transparent;
      color: rgba(200, 140, 160, 0.75);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #resetPointsBtn:hover {
      background: rgba(200, 140, 160, 0.08);
      border-color: rgba(200, 140, 160, 0.5);
    }

    @media (max-width: 1100px) {
      body { overflow-y: auto; overflow-x: hidden; }
      .title {
        position: static;
        top: auto;
        transform: none;
        padding: 84px 16px 8px;
        transition: none;
      }
      .title.active { top: auto; transform: none; }
      .title h1 { font-size: 1.6rem; }
      .title.active h1 { font-size: 1.6rem; }
      .grid {
        position: static;
        display: flex;
        padding: 12px 16px 8px;
      }
      .grid-inner {
        width: min(558px, calc(100vw - 32px));
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: none;
        gap: 14px;
      }
      .card {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        opacity: 1;
        transform: none;
        transition: none;
      }
      .card.active { opacity: 1; transform: none; }
      .card .icon { font-size: 1.5rem; margin-bottom: 4px; }
      .card .icon img { width: 44px; height: 44px; }
      .card .label { font-size: 0.68rem; }
      .card .coming { font-size: 0.5rem; }
      .lb {
        position: static;
        transform: none;
        width: min(440px, calc(100vw - 32px));

      }
      #pointsWrap {
        max-width: calc(100vw - 24px);
        font-size: 13px;
        padding: 6px 12px;
      }
    }
  </style>

  <script>
    let triggered = false;
    function activate() {
      if (triggered) return;
      triggered = true;
      document.getElementById('title').classList.add('active');
      document.querySelectorAll('.card').forEach(c => c.classList.add('active'));
      document.querySelector('.lb').classList.add('active');
    }
    document.addEventListener('keydown', activate);
    document.addEventListener('click', activate);
    document.addEventListener('touchstart', activate);
    document.addEventListener('mousemove', activate);

    // ---- Auth ----
    const authBtn = document.getElementById('authBtn');
    const modal = document.getElementById('authModal');
    const closeBtn = document.getElementById('closeAuth');
    const modalTitle = document.getElementById('modalTitle');
    const authBody = document.getElementById('authBody');
    const authErr = document.getElementById('authErr');
    const authSubmit = document.getElementById('authSubmit');
    const tabs = document.querySelectorAll('.tab');
    let mode = 'login';

    function setMode(m) {
      mode = m;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
      modalTitle.textContent = m === 'login' ? 'Log in' : 'Register';
      authSubmit.textContent = m === 'login' ? 'Log in' : 'Create account';
      authErr.textContent = '';
      authBody.innerHTML = '';
      if (m === 'register') {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username" autocomplete="username">' +
          '<input type="email" id="authEmail" placeholder="Email (optional)" autocomplete="email">' +
          '<input type="password" id="authPassword" placeholder="Password (8+ chars)" autocomplete="new-password">';
      } else {
        authBody.innerHTML =
          '<input type="text" id="authLogin" placeholder="Username or email" autocomplete="username">' +
          '<input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">';
      }
    }

    function renderAuthState(user) {
      if (user) {
        authBtn.textContent = 'Logout (' + user.username + ')';
        document.getElementById('adminLink').style.display =
          user.username.toLowerCase() === 'ruruskaado' ? '' : 'none';
      } else {
        authBtn.textContent = 'Login';
        document.getElementById('adminLink').style.display = 'none';
      }
    }

    let serverTotal = null;
    function currentPointsPlayer() {
      return (window.__user && window.__user.username) ? window.__user.username : null;
    }
    function refreshPoints() {
      const player = currentPointsPlayer();
      const local = player ? (ScoreBoard.get(player).total || 0) : 0;
      const total = (player && serverTotal != null) ? serverTotal : local;
      document.getElementById('pointsTotal').textContent = Shop.fmt(total);
      document.getElementById('resetPointsBtn').style.display = player ? '' : 'none';
    }
    document.getElementById('resetPointsBtn').addEventListener('click', async () => {
      const name = currentPointsPlayer();
      if (!name) return;
      if (!confirm('Reset ' + name + "'s score to 0? This cannot be undone.")) return;
      ScoreBoard.reset(name);
      serverTotal = 0;
      try { await fetch('/api/score/reset', { method: 'POST' }); } catch {}
      refreshPoints();
      loadLeaderboard();
    });

    function openModal() {
      setMode('login');
      modal.classList.add('open');
    }

    authBtn.addEventListener('click', async () => {
      const user = (window.__user && window.__user.username) ? window.__user : null;
      if (user) {
        await fetch('/api/logout', { method: 'POST' });
        window.__user = null;
        serverTotal = null;
        renderAuthState(null);
        refreshPoints();
        loadLeaderboard();
        return;
      }
      openModal();
    });

    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    closeBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    authSubmit.addEventListener('click', async () => {
      const login = document.getElementById('authLogin').value.trim();
      const password = document.getElementById('authPassword').value;
      const emailEl = document.getElementById('authEmail');
      const email = emailEl ? emailEl.value.trim() : undefined;
      const payload = mode === 'register'
        ? { username: login, email, password }
        : { login, password };
      try {
        const res = await fetch('/api/' + (mode === 'register' ? 'register' : 'login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) { authErr.textContent = data.error || 'Request failed'; return; }
        window.__user = data.user;
        renderAuthState(data.user);
        modal.classList.remove('open');
        refreshPoints();
        loadLeaderboard();
      } catch (err) {
        authErr.textContent = 'Network error';
      }
    });

    async function initAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        window.__user = data.user || null;
        serverTotal = (window.__user && Number.isFinite(window.__user.total))
          ? window.__user.total
          : (window.__user && Number.isFinite(window.__user.balance)) ? window.__user.balance : null;
        renderAuthState(window.__user);
      } catch { window.__user = null; serverTotal = null; renderAuthState(null); }
      refreshPoints();
    }
    initAuth();

    // ---- Universal leaderboard ----
    async function loadLeaderboard() {
      const container = document.getElementById('lbRows');
      let me = null;
      try {
        const mr = await fetch('/api/me');
        const md = await mr.json();
        me = (md.user && md.user.username) ? md.user.username : null;
      } catch {}
      let rows;
      try {
        const res = await fetch('/api/leaderboard?limit=100');
        const data = await res.json();
        rows = data.leaderboard || null;
      } catch {
        rows = null;
      }
      if (!rows) {
        container.innerHTML = '<div class="lb-status">Could not load the leaderboard.</div>';
        return;
      }
      if (!rows.length) {
        container.innerHTML = '<div class="lb-status">No scores yet. Play a game, then come back.</div>';
        return;
      }
      const meUser = me;
      container.innerHTML = rows.map((row, i) =>
        '<div class="lb-row' + (row.username === meUser ? ' me' : '') + '">' +
        '<div class="rk' + (i < 3 ? ' top rk' + (i + 1) : '') + '">' + (i + 1) + '</div>' +
        window.Shop.npHTML(row) +
        '<div class="pl">' + (row.id !== undefined ? row.id : '') + '</div>' +
        '<div class="pt">' + (row.total !== undefined ? Shop.fmt(row.total) : 0) + '</div>' +
        '</div>'
      ).join('');
    }
    loadLeaderboard();
    window.addEventListener('pageshow', () => { initAuth(); loadLeaderboard(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { initAuth(); loadLeaderboard(); } });
  </script>
</body>
</html>
